      '<td style="color:var(--warning);font-weight:700">' + (notApplied ? '—' : F(comm)) + '</td>' +
      '<td style="color:var(--success);font-weight:700">' + (notApplied ? '—' : F(p.breakdown && p.breakdown.capital)) + '</td>' +
      '<td style="color:' + (N(p.newPendingCommission) > 0 ? 'var(--danger)' : 'var(--success)') + ';font-weight:700">' + (notApplied ? '—' : F(p.newPendingCommission)) + '</td>' +
    '</tr>';
  }).join('');

  return '' +
    '<div class="card" style="margin-bottom:20px">' +
      '<div class="card-header"><h2 class="card-title"><i class="fas fa-money-check"></i> Cheque Registry</h2></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px">' +
        mini('⏳ Pending', pending.length, F(pending.reduce((s,c) => s + N(c.amount), 0)), '#f59e0b') +
        mini('✅ Cleared', cleared.length, null, '#10b981') +
        mini('❌ Bounced', bounced.length, null, '#ef4444') +
        mini('Total', cheques.length, null, '#6366f1') +
      '</div>' +
      (cheques.length === 0
        ? '<div class="empty-state"><i class="fas fa-money-check"></i><h3>No cheques recorded</h3></div>'
        : '<div class="table-container"><table><thead><tr><th>Cheque #</th><th>Bank</th><th>Plan</th><th>Amount</th><th>Cheque Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + chqRows + '</tbody></table></div>'
      ) +
    '</div>' +
    '<div class="card">' +
      '<div class="card-header"><h2 class="card-title">All Payments</h2></div>' +
      (FIN.payments.length === 0
        ? '<div class="empty-state"><i class="fas fa-money-check-alt"></i><h3>No payments</h3></div>'
        : '<div class="table-container"><table><thead><tr><th>Eff. Date</th><th>Given</th><th>Plan</th><th>Amount</th><th>Method</th><th>Status</th><th>Commission</th><th>Capital</th><th>Pending</th></tr></thead><tbody>' + allRows + '</tbody></table></div>'
      ) +
    '</div>';

  function mini(label, value, sub, color) {
    return '<div style="background:white;border-radius:12px;padding:14px;border:1px solid var(--border)">' +
      '<div style="font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px">' + label + '</div>' +
      '<div style="font-size:22px;font-weight:800;color:' + color + ';margin-top:4px">' + value + '</div>' +
      (sub ? '<div style="font-size:10.5px;color:var(--gray);margin-top:2px">' + sub + '</div>' : '') +
    '</div>';
  }
}

/* ── Tab 4: Deductions ── */
function renderDeductionsTab() {
  if (FIN.deductions.length === 0) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
      '<h2 style="font-size:18px;font-weight:700">Planned Deductions</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="FIN.openDeductionModal()"><i class="fas fa-plus"></i> Add Deduction</button>' +
    '</div>' +
    '<div class="empty-state"><i class="fas fa-shield-alt"></i><h3>No planned deductions</h3></div>';
  }
  const sorted = FIN.deductions.slice().sort((a,b) => {
    const oa = isOverdueDed(a) ? 0 : 1, ob = isOverdueDed(b) ? 0 : 1;
    if (oa !== ob) return oa - ob;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });

  const rows = sorted.map(d => {
    const pl = planById(d.planId);
    const rem = remainingDed(d);
    const direct = paidDirect(d);
    const fromMain = paidFromMain(d);
    const total = paidTotal(d);
    const overdue = isOverdueDed(d);
    const daysOver = daysOverdueDed(d);
    const sk = statusKeyDed(d);
    const pct = N(d.amount) > 0 ? (total / N(d.amount) * 100) : 0;
    let statusClass = 'pending', statusLabel = 'Pending', statusBg = '#fef3c7', statusCol = '#b45309';
    if (sk === 'settled') { statusLabel = 'Settled ✓'; statusBg = '#d1fae5'; statusCol = '#065f46'; }
    else if (sk === 'partial') { statusLabel = 'Partial'; statusBg = '#dbeafe'; statusCol = '#1e40af'; }
    if (overdue && sk !== 'settled') { statusLabel = 'Overdue ' + daysOver + 'd'; statusBg = '#fee2e2'; statusCol = '#b91c1c'; }

    return '<tr>' +
      '<td>' + (pl ? E(pl.vehicle) : '—') + '</td>' +
      '<td><strong>' + E(d.label) + '</strong>' + (d.notes ? '<div style="font-size:11px;color:var(--gray)">' + E(d.notes) + '</div>' : '') + '</td>' +
      '<td><strong>' + F(d.amount) + '</strong></td>' +
      '<td>' +
        (direct > 0 ? '<div style="color:var(--info);font-weight:600">' + F(direct) + ' <span style="font-size:10px;color:var(--gray)">direct</span></div>' : '') +
        (fromMain > 0 ? '<div style="color:var(--warning);font-weight:600">' + F(fromMain) + ' <span style="font-size:10px;color:var(--gray)">from cleared</span></div>' : '') +
        (total === 0 ? '<span style="color:var(--gray)">—</span>' : '') +
        '<div style="background:var(--border);height:5px;border-radius:3px;overflow:hidden;width:100px;margin-top:4px"><div style="height:100%;width:' + pct + '%;background:var(--primary)"></div></div>' +
      '</td>' +
      '<td><strong style="color:' + (rem > 0 ? 'var(--danger)' : 'var(--success)') + '">' + F(rem) + '</strong></td>' +
      '<td style="color:' + (overdue ? 'var(--danger)' : 'inherit') + ';font-weight:' + (overdue ? '700' : '400') + '">' + dfmt(d.dueDate) + (overdue ? '<div style="font-size:10px;color:var(--danger)">⚠ ' + daysOver + 'd</div>' : '') + '</td>' +
      '<td><span style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;background:' + statusBg + ';color:' + statusCol + '">' + statusLabel + '</span></td>' +
      '<td>' +
        '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
          (rem > 0.001 ? '<button class="btn btn-xs btn-success" onclick="FIN.openDedPayModal(\'' + d.id + '\')"><i class="fas fa-hand-holding-usd"></i> Pay</button>' : '') +
          '<button class="btn btn-xs btn-secondary" onclick="FIN.showDedDetail(\'' + d.id + '\')"><i class="fas fa-eye"></i></button>' +
          '<button class="btn btn-xs btn-danger" onclick="FIN.removeDeduction(\'' + d.id + '\')"><i class="fas fa-trash"></i></button>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join('');

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
    '<h2 style="font-size:18px;font-weight:700">Planned Deductions (' + FIN.deductions.length + ')</h2>' +
    '<button class="btn btn-primary btn-sm" onclick="FIN.openDeductionModal()"><i class="fas fa-plus"></i> Add Deduction</button>' +
  '</div>' +
  '<div class="table-container"><table><thead><tr><th>Plan</th><th>Label</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

/* ── Tab 5: Reports ── */
function renderReportsTab() {
  const validPmts = FIN.payments.filter(p => p.status !== 'bounced' && p.status !== 'pending');
  const pendingPmts = FIN.payments.filter(p => p.status === 'pending');
  const totalStart = FIN.plans.reduce((s,p) => s + N(p.capitalStart), 0);
  const totalCurrent = FIN.plans.reduce((s,p) => s + N(p.capitalCurrent), 0);
  const totalPaid = validPmts.reduce((s,p) => s + N(p.amount), 0);
  const totalComm = validPmts.reduce((s,p) => s + N(p.breakdown && p.breakdown.commissionPending) + N(p.breakdown && p.breakdown.commissionCurrent), 0);
  const totalDeds = validPmts.reduce((s,p) => s + ((p.breakdown && p.breakdown.deductions) || []).reduce((ss,d) => ss + N(d.paid), 0), 0);
  const pendingChequeVal = pendingPmts.reduce((s,p) => s + N(p.amount), 0);
  const ratio = totalPaid > 0 ? (totalComm / totalPaid * 100) : 0;
  const dedRatio = totalPaid > 0 ? (totalDeds / totalPaid * 100) : 0;
  const capRatio = totalPaid > 0 ? Math.max(0, 100 - ratio - dedRatio) : 0;

  return '' +
    '<div class="card" style="margin-bottom:20px">' +
      '<div class="card-header"><h2 class="card-title">Portfolio Summary</h2></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">' +
        rep('Total Starting Capital', F(totalStart), '#6366f1') +
        rep('Current Outstanding', F(totalCurrent), '#f59e0b') +
        rep('Total Paid (Cleared)', F(totalPaid), '#10b981') +
        rep('⏳ Pending Cheques', F(pendingChequeVal), '#f59e0b') +
        rep('Commission Paid', F(totalComm), '#3b82f6') +
        rep('Deductions Settled', F(totalDeds), '#06b6d4') +
      '</div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:20px">' +
      '<div class="card-header"><h2 class="card-title">Payment Composition</h2></div>' +
      '<div style="font-size:12px;color:var(--gray);margin-bottom:12px">Where cleared payment money went:</div>' +
      bar('Deductions', totalDeds, dedRatio, '#06b6d4') +
      bar('Commission', totalComm, ratio, '#f59e0b') +
      bar('Capital', totalPaid - totalDeds - totalComm, capRatio, '#10b981') +
    '</div>' +
    '<div class="card">' +
      '<div class="card-header"><h2 class="card-title">Plan-wise Breakdown</h2></div>' +
      (FIN.plans.length === 0
        ? '<div class="empty-state"><i class="fas fa-chart-line"></i><h3>No data</h3></div>'
        : '<div class="table-container"><table><thead><tr><th>Plan</th><th>Company</th><th>Start Cap</th><th>Current Cap</th><th>Cleared</th><th>Pending</th><th>Commission</th><th>Progress</th></tr></thead><tbody>' +
          FIN.plans.map(p => {
            const planPmts = validPmts.filter(x => x.planId === p.id);
            const paid = planPmts.reduce((s,x) => s + N(x.amount), 0);
            const comm = planPmts.reduce((s,x) => s + N(x.breakdown && x.breakdown.commissionPending) + N(x.breakdown && x.breakdown.commissionCurrent), 0);
            const pendVal = FIN.payments.filter(x => x.planId === p.id && x.status === 'pending').reduce((s,x) => s + N(x.amount), 0);
            const pct = N(p.capitalStart) > 0 ? ((N(p.capitalStart) - N(p.capitalCurrent)) / N(p.capitalStart) * 100) : 0;
            return '<tr>' +
              '<td><strong>' + E(p.vehicle) + '</strong></td><td>' + E(p.company) + '</td>' +
              '<td>' + F(p.capitalStart) + '</td><td>' + F(p.capitalCurrent) + '</td>' +
              '<td style="color:var(--success);font-weight:700">' + F(paid) + '</td>' +
              '<td style="color:#f59e0b;font-weight:700">' + (pendVal > 0 ? F(pendVal) : '—') + '</td>' +
              '<td style="color:var(--info);font-weight:700">' + F(comm) + '</td>' +
              '<td style="min-width:120px"><div style="font-size:11px;color:var(--gray);margin-bottom:4px">' + pct.toFixed(1) + '%</div><div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--success),var(--primary))"></div></div></td>' +
            '</tr>';
          }).join('') +
        '</tbody></table></div>'
      ) +
    '</div>';

  function rep(label, value, color) {
    return '<div style="background:white;border:1px solid var(--border);border-radius:12px;padding:14px">' +
      '<div style="font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px">' + label + '</div>' +
      '<div style="font-size:20px;font-weight:800;color:' + color + ';margin-top:4px">' + value + '</div>' +
    '</div>';
  }
  function bar(label, val, pct, color) {
    return '<div style="margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="font-weight:600">' + label + '</span><span>' + F(val) + ' (' + pct.toFixed(1) + '%)</span></div>' +
      '<div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + color + '"></div></div>' +
    '</div>';
  }
}

/* ══════════════════════════════════════════════════════
   PLAN DETAIL VIEW
   ══════════════════════════════════════════════════════ */
function renderPlanDetail(el) {
  const p = planById(FIN.activePlanId);
  if (!p) {
    el.innerHTML = '<div class="card"><div class="empty-state">' +
      '<i class="fas fa-exclamation-circle"></i><h3>Plan not found</h3>' +
      '<p style="margin-top:8px">It may have been deleted.</p>' +
      '<button class="btn btn-primary" style="margin-top:16px" onclick="NC.navigate(\'finance-dashboard\')">Back to Finance</button>' +
      '</div></div>';
    return;
  }

  const allPmts = FIN.payments.filter(x => x.planId === p.id).sort((a,b) => new Date(b.effectiveDate || b.date) - new Date(a.effectiveDate || a.date));
  const committed = allPmts.filter(x => x.status !== 'pending' && x.status !== 'bounced');
  const pendingChqs = allPmts.filter(x => x.status === 'pending');
  const bouncedChqs = allPmts.filter(x => x.status === 'bounced');

  const planDeds = FIN.deductions.filter(x => x.planId === p.id).sort((a,b) => {
    const oa = isOverdueDed(a) ? 0 : 1, ob = isOverdueDed(b) ? 0 : 1;
    if (oa !== ob) return oa - ob;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });

  const totalPaid = committed.reduce((s,x) => s + N(x.amount), 0);
  const totalCommission = committed.reduce((s,x) => s + N(x.breakdown && x.breakdown.commissionPending) + N(x.breakdown && x.breakdown.commissionCurrent), 0);
  const totalCapitalReduced = committed.reduce((s,x) => s + N(x.breakdown && x.breakdown.capital), 0);
  const paidPct = N(p.capitalStart) > 0 ? ((N(p.capitalStart) - N(p.capitalCurrent)) / N(p.capitalStart) * 100) : 0;
  const overdueDeds = planDeds.filter(isOverdueDed);

  const committedState = replayCommitted(p);
  const projection = pendingChqs.length ? projectPending(p, committedState) : null;

  const replayLookup = {};
  committedState.timeline.forEach(t => { replayLookup[t.payment.id] = t; });
  const projLookup = {};
  if (projection) projection.timeline.forEach(t => { projLookup[t.payment.id] = t; });

  const pendingVal = pendingChqs.reduce((s,c) => s + N(c.amount), 0);
  const bouncedVal = bouncedChqs.reduce((s,c) => s + N(c.amount), 0);

  el.innerHTML =
  '<div style="background:white;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px">' +
    /* Header row */
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px">' +
      '<div style="display:flex;gap:14px;align-items:flex-start;flex:1;min-width:0">' +
        '<button onclick="NC.navigate(\'finance-dashboard\')" style="width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--light);cursor:pointer;font-size:14px"><i class="fas fa-arrow-left"></i></button>' +
        '<div>' +
          '<h2 style="font-size:22px;font-weight:800;margin-bottom:4px">' + E(p.vehicle) + '</h2>' +
          '<div style="font-size:13px;color:var(--gray)"><i class="fas fa-building"></i> ' + E(p.company) + '</div>' +
          '<div style="font-size:12px;color:var(--gray);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap">' +
            '<span><i class="fas fa-calendar-alt"></i> Started <strong>' + dfmt(p.startDate) + '</strong></span>' +
            '<span><i class="fas fa-repeat"></i> Interval <strong>' + (p.expectedInterval || 30) + 'd</strong></span>' +
            '<span><i class="fas fa-exclamation-triangle"></i> Late fee <strong>' + (p.penaltyRate || 0) + '%</strong></span>' +
            (N(p.gracePeriod) > 0 ? '<span><i class="fas fa-hourglass-start"></i> Grace <strong>' + p.gracePeriod + 'd</strong></span>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        iconBtn('plus',      'primary',  'Record Payment', 'FIN.openPaymentModal(\'' + p.id + '\')') +
        iconBtn('layer-group','secondary','Bulk Entry',   'FIN.openBulkModal(\'' + p.id + '\')') +
        iconBtn('sync',      'warning',  'Recalculate',   'FIN.forceRecalc(\'' + p.id + '\')') +
        iconBtn('edit',      'secondary','Edit Plan',     'FIN.openPlanModal(\'' + p.id + '\')') +
        iconBtn('eraser',    'gray',     'Clear Payments','FIN.clearPlanTransactions(\'' + p.id + '\')') +
        iconBtn('trash-alt', 'danger',   'Delete Plan',   'FIN.hardDeletePlan(\'' + p.id + '\')') +
      '</div>' +
    '</div>' +

    /* KPI row */
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding-top:16px;border-top:1px solid var(--border)">' +
      hk('Capital Outstanding', F(p.capitalCurrent), 'of ' + F(p.capitalStart), 'var(--warning)') +
      hk('Pending Commission', F(p.pendingCommission), 'carried forward', N(p.pendingCommission) > 0 ? 'var(--danger)' : 'var(--success)') +
      hk('Progress', paidPct.toFixed(1) + '%', F(totalPaid) + ' cleared', 'var(--primary)') +
      hk('Payments', '<span style="color:var(--success)">' + committed.length + '</span> · <span style="color:#f59e0b">' + pendingChqs.length + '</span> · <span style="color:var(--danger)">' + bouncedChqs.length + '</span>', 'cleared · pending · bounced', null) +
    '</div>' +
    '<div style="background:var(--border);height:10px;border-radius:5px;overflow:hidden;margin-top:14px"><div style="height:100%;width:' + paidPct + '%;background:linear-gradient(90deg,var(--success),var(--primary))"></div></div>' +
    (overdueDeds.length ? '<div style="background:linear-gradient(135deg,#fee2e2,#fecaca);border:1.5px solid #ef4444;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:12.5px;color:#991b1b;display:flex;gap:10px;align-items:flex-start"><i class="fas fa-exclamation-triangle" style="font-size:16px;margin-top:1px"></i><div><strong>' + overdueDeds.length + ' overdue deduction(s).</strong> Will auto-deduct from next cleared payment.</div></div>' : '') +
  '</div>' +

  /* Summary & Projection */
  detailSection('Summary & Projection', 'chart-bar', '#6366f1', true,
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden">' +
      '<div style="padding:18px;background:white">' +
        '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:var(--primary-dark)"><i class="fas fa-check-circle"></i> Current Committed</div>' +
        projRow('Capital Outstanding', F(p.capitalCurrent), 'var(--warning)') +
        projRow('Pending Commission', F(p.pendingCommission), N(p.pendingCommission) > 0 ? 'var(--danger)' : 'var(--success)') +
        projRow('Total Cleared', F(totalPaid), 'var(--success)') +
        projRow('Capital Reduced', F(totalCapitalReduced)) +
        projRow('Commission Paid', F(totalCommission), 'var(--info)') +
      '</div>' +
      '<div style="padding:18px;background:linear-gradient(135deg,#fef3c7,#fef9e7);border-left:2px dashed #f59e0b">' +
        '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;color:#92400e"><i class="fas fa-hourglass-half"></i> After ' + pendingChqs.length + ' Pending Clear</div>' +
        (pendingChqs.length === 0
          ? '<div style="text-align:center;padding:30px 10px;color:var(--gray);font-size:13px"><i class="fas fa-inbox" style="font-size:32px;opacity:.3;display:block;margin-bottom:8px"></i>No pending cheques</div>'
          : projRow('Projected Capital', F(projection.capital), '#92400e') +
            '<div style="font-size:11px;color:#92400e;margin-top:-2px;margin-bottom:6px;padding-left:2px">↓ ' + F(projection.deltaCapital) + ' will be reduced</div>' +
            projRow('Projected Pending Comm.', F(projection.pending), '#92400e') +
            projRow('Commission from Pending', F(projection.deltaCommission), '#b45309') +
            projRow('New Progress', (N(p.capitalStart) > 0 ? (((N(p.capitalStart) - projection.capital) / N(p.capitalStart)) * 100).toFixed(1) : '0') + '%')
        ) +
      '</div>' +
    '</div>',
    'Capital: <strong>' + F(p.capitalCurrent) + '</strong> · Progress: <strong>' + paidPct.toFixed(1) + '%</strong>' + (pendingChqs.length ? ' · Projected: <strong style="color:#b45309">' + F(projection.capital) + '</strong>' : '')
  ) +

  /* Pending cheques */
  (pendingChqs.length ? detailSection('Pending Cheques', 'hourglass-half', '#f59e0b', true,
    '<div style="background:linear-gradient(135deg,#fef3c7,#fed7aa);border:1.5px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:16px"><i class="fas fa-info-circle"></i> Each card shows <strong>exactly what will happen when the cheque is Cleared</strong>. Mark Cleared to apply, or Bounced to ignore.</div>' +
    pendingChqs.map(c => impactCardHTML(c, 'pending', projLookup[c.id])).join(''),
    '<strong>' + F(pendingVal) + '</strong>'
  ) : '') +

  /* Cleared payments */
  (committed.length ? detailSection('Cleared Payments', 'check-circle', '#10b981', false,
    committed.map(c => '<details style="border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden">' +
      '<summary style="cursor:pointer;list-style:none;padding:12px 16px;background:linear-gradient(90deg,rgba(16,185,129,.06),transparent);display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span style="padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#d1fae5;color:#065f46">✅</span>' +
        '<strong>Cheque #' + E(c.chequeNo || '—') + '</strong>' +
        (c.chequeBank ? '<span style="color:var(--gray);font-size:12px">· ' + E(c.chequeBank) + '</span>' : '') +
        '<span style="color:var(--gray);font-size:12px">· ' + dfmt(c.effectiveDate || c.date) + '</span>' +
        '<span style="margin-left:auto;font-weight:800;color:#065f46">' + F(c.amount) + '</span>' +
      '</summary>' +
      '<div style="padding:14px;background:var(--light)">' + impactCardHTML(c, 'cleared', replayLookup[c.id]) + '</div>' +
    '</details>').join(''),
    'Total: <strong>' + F(totalPaid) + '</strong> · Commission: <strong>' + F(totalCommission) + '</strong>'
  ) : '') +

  /* Bounced */
  (bouncedChqs.length ? detailSection('Bounced Cheques', 'times-circle', '#ef4444', false,
    bouncedChqs.map(c => impactCardHTML(c, 'bounced', null)).join(''),
    'Value: <strong>' + F(bouncedVal) + '</strong>'
  ) : '') +

  /* Payment Schedule */
  detailSection('Payment Schedule', 'calendar-check', '#3b82f6', false,
    scheduleHTML(committedState, pendingChqs, bouncedChqs, projection),
    (committed.length + pendingChqs.length + bouncedChqs.length) + ' total entries'
  ) +

  /* What-If */
  detailSection('What-If Simulator', 'flask', '#16a34a', false,
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px">' +
      '<div class="form-group" style="margin:0"><label>Amount (Rs.)</label><input type="number" id="finWiAmount" step="0.01" oninput="FIN.runWhatIf(\'' + p.id + '\')"></div>' +
      '<div class="form-group" style="margin:0"><label>Method</label><select id="finWiMethod" onchange="FIN.runWhatIf(\'' + p.id + '\')"><option value="cheque">Cheque</option><option value="cash">Cash</option></select></div>' +
      '<div class="form-group" style="margin:0"><label>Date</label><input type="date" id="finWiDate" value="' + T() + '" onchange="FIN.runWhatIf(\'' + p.id + '\')"></div>' +
    '</div>' +
    '<div id="finWhatIfResult"></div>',
    'Test a hypothetical cleared payment'
  ) +

  /* Amortization */
  detailSection('Amortization Projection', 'chart-area', '#f59e0b', false,
    '<div style="display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap;margin-bottom:14px">' +
      '<label>Monthly payment:</label>' +
      '<input type="number" id="finAmortMonthly" value="1000000" step="10000" style="width:130px;padding:6px 10px;border:2px solid var(--border);border-radius:8px;font-size:12px">' +
      '<button class="btn btn-primary btn-xs" onclick="FIN.runAmortization(\'' + p.id + '\')"><i class="fas fa-play"></i> Project</button>' +
    '</div>' +
    '<div id="finAmortResult"></div>',
    'Simulate monthly payments until plan closes'
  ) +

  /* Planned deductions */
  detailSection('Planned Deductions', 'shield-alt', '#06b6d4', false,
    '<div style="display:flex;justify-content:flex-end;margin-bottom:12px">' +
      '<button class="btn btn-primary btn-sm" onclick="FIN.openDeductionModal(\'' + p.id + '\')"><i class="fas fa-plus"></i> Add Deduction</button>' +
    '</div>' +
    deductionsTableHTML(planDeds),
    '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:#e0e7ff;color:#4338ca">' + planDeds.length + '</span>' +
    (overdueDeds.length ? ' <span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:#fee2e2;color:#991b1b">' + overdueDeds.length + ' overdue</span>' : '')
  );

  /* Helpers */
  function iconBtn(icon, cls, tip, onclick) {
    const colors = {
      primary:   'background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;border:none',
      secondary: 'background:var(--light);color:var(--dark);border:1px solid var(--border)',
      warning:   'background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border:none',
      danger:    'background:linear-gradient(135deg,#ef4444,#dc2626);color:white;border:none',
      gray:      'background:#64748b;color:white;border:none'
    };
    return '<button onclick="' + onclick + '" title="' + tip + '" style="width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;' + colors[cls] + '"><i class="fas fa-' + icon + '"></i></button>';
  }
  function hk(label, value, sub, color) {
    return '<div style="padding:12px 14px;border-radius:10px;background:var(--light)">' +
      '<div style="font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px">' + label + '</div>' +
      '<div style="font-size:18px;font-weight:800;margin-top:4px;' + (color ? 'color:' + color : '') + '">' + value + '</div>' +
      (sub ? '<div style="font-size:10.5px;color:var(--gray);margin-top:2px">' + sub + '</div>' : '') +
    '</div>';
  }
  function projRow(label, value, color) {
    return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,.06)">' +
      '<span style="color:var(--gray)">' + label + '</span>' +
      '<span style="font-weight:700;' + (color ? 'color:' + color : '') + '">' + value + '</span>' +
    '</div>';
  }
  function detailSection(title, icon, color, open, bodyHTML, metaHTML) {
    return '<details class="fin-section" ' + (open ? 'open' : '') + ' style="background:white;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px;overflow:hidden;border:1px solid var(--border)">' +
      '<summary style="cursor:pointer;list-style:none;padding:16px 20px;display:flex;align-items:center;gap:14px;transition:.2s">' +
        '<span style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px"><i class="fas fa-' + icon + '" style="color:' + color + '"></i> ' + title + '</span>' +
        '<span style="margin-left:auto;font-size:12px;color:var(--gray);display:flex;gap:14px;flex-wrap:wrap;align-items:center">' + (metaHTML || '') + '</span>' +
      '</summary>' +
      '<div style="padding:20px;border-top:1px solid var(--border)">' + bodyHTML + '</div>' +
    '</details>';
  }
}

/* ══════════════════════════════════════════════════════
   IMPACT CARD
   ══════════════════════════════════════════════════════ */
function impactCardHTML(pmt, kind, replayRow) {
  const plan = planById(pmt.planId) || {};
  const row = replayRow || {};
  const isPending = kind === 'pending';
  const isBounced = kind === 'bounced';

  const b = pmt.breakdown || {};
  const days              = row.days !== undefined ? row.days : (b.days || 0);
  const daysChargeable    = row.daysChargeable !== undefined ? row.daysChargeable : (b.daysChargeable || days);
  const grace             = row.grace !== undefined ? row.grace : (b.grace || 0);
  const dailyCommission   = row.dailyCommission !== undefined ? row.dailyCommission : (b.dailyCommission || 0);
  const accruedCommission = row.accruedCommission !== undefined ? row.accruedCommission : (b.accruedCommission || 0);
  const penalty           = row.penalty !== undefined ? row.penalty : (b.penalty || 0);
  const pendingBefore     = row.pendingBefore !== undefined ? row.pendingBefore : (b.pendingBefore || 0);
  const pendingAfter      = row.pendingAfter !== undefined ? row.pendingAfter : (pmt.newPendingCommission || 0);
  const capitalBefore     = row.capitalBefore !== undefined ? row.capitalBefore : (N(plan.capitalCurrent) || 0);
  const capitalAfter      = row.capitalAfter !== undefined ? row.capitalAfter : (pmt.newCapital || 0);

  const dedPaid           = (row.deductions || b.deductions || []).reduce((s,d) => s + N(d.paid), 0);
  const commPendingPaid   = row.commissionPendingPaid !== undefined ? row.commissionPendingPaid : (b.commissionPending || 0);
  const commCurrentPaid   = row.commissionCurrentPaid !== undefined ? row.commissionCurrentPaid : (b.commissionCurrent || 0);
  const capitalPaid       = row.capitalPaid !== undefined ? row.capitalPaid : (b.capital || 0);
  const totalApplied      = dedPaid + commPendingPaid + commCurrentPaid + capitalPaid;

  const totalCommissionOwed = pendingBefore + accruedCommission;
  const dueDeds = row.dueDeds || [];
  const totalDedDue = dueDeds.reduce((s,d) => s + d.remaining, 0);
  const progressBefore = N(plan.capitalStart) > 0 ? ((N(plan.capitalStart) - capitalBefore) / N(plan.capitalStart) * 100) : 0;
  const progressAfter  = N(plan.capitalStart) > 0 ? ((N(plan.capitalStart) - capitalAfter)  / N(plan.capitalStart) * 100) : 0;

  const statusLabel = isBounced ? '❌ BOUNCED' : (isPending ? '⏳ PENDING — NOT YET APPLIED' : '✅ CLEARED');
  const headerContext = isPending ? 'Will apply to plan when marked as Cleared' : (isBounced ? 'Removed from plan (no impact)' : 'Applied to plan');
  const bgHeader = isBounced ? 'linear-gradient(135deg,#fef2f2,#fee2e2)' : (isPending ? 'linear-gradient(135deg,#fffbeb,#fef3c7)' : 'linear-gradient(135deg,#f0fdf4,#dcfce7)');
  const borderColor = isBounced ? '#ef4444' : (isPending ? '#f59e0b' : '#10b981');
  const badgeColor  = isBounced ? '#ef4444' : (isPending ? '#f59e0b' : '#10b981');

  return '<div style="border:1.5px solid ' + borderColor + ';border-radius:12px;overflow:hidden;margin-bottom:14px;background:white;' + (isBounced ? 'opacity:.75' : '') + '">' +
    '<div style="padding:14px 18px;border-bottom:1px solid var(--border);background:' + bgHeader + '">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px">' +
        '<span style="padding:4px 10px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:' + badgeColor + ';color:white">' + statusLabel + '</span>' +
        '<strong>Cheque #' + E(pmt.chequeNo || '—') + '</strong>' +
        (pmt.chequeBank ? '<span style="color:var(--gray)">· ' + E(pmt.chequeBank) + '</span>' : '') +
        '<span style="margin-left:auto;font-size:17px;font-weight:800;color:var(--primary-dark)">' + F(pmt.amount) + '</span>' +
      '</div>' +
      '<div style="font-size:11.5px;color:var(--gray);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap">' +
        '<span><i class="fas fa-calendar-check"></i> Cheque date: <strong>' + dfmt(pmt.effectiveDate || pmt.date) + '</strong></span>' +
        '<span><i class="fas fa-clock"></i> Recorded: ' + dfmt(pmt.date) + '</span>' +
        '<span><i class="fas fa-info-circle"></i> ' + headerContext + '</span>' +
      '</div>' +
    '</div>' +
    (isBounced
      ? '<div style="padding:14px 18px"><div style="background:linear-gradient(135deg,#fee2e2,#fecaca);border:1.5px solid #ef4444;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#991b1b;display:flex;gap:10px;align-items:flex-start"><i class="fas fa-times-circle"></i><div><strong>This cheque bounced.</strong> No impact on capital or commission.' + (pmt.bounceReason ? ' Reason: ' + E(pmt.bounceReason) : '') + '</div></div></div>'
      : '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">' +
          /* Period */
          '<div style="padding:14px 18px;border-bottom:1px solid var(--border)">' +
            '<div style="font-size:10.5px;font-weight:800;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">📅 Period Covered</div>' +
            impRow('From', dfmt(row.startDate || plan.startDate)) +
            impRow('To', dfmt(row.endDate || pmt.effectiveDate || pmt.date)) +
            impRow('Total days', days + ' days') +
            (grace > 0 ? impRow('Grace applied', grace + ' days') : '') +
            '<div style="display:flex;justify-content:space-between;padding:8px 0 5px;font-weight:800;border-top:1.5px dashed var(--border);margin-top:6px"><span>Chargeable days</span><span>' + daysChargeable + ' days</span></div>' +
          '</div>' +
          /* Commission */
          '<div style="padding:14px 18px;border-bottom:1px solid var(--border);border-left:1px solid var(--border)">' +
            '<div style="font-size:10.5px;font-weight:800;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">💰 Commission Breakdown</div>' +
            impRow('Capital at start', F(capitalBefore)) +
            impRow('Daily rate', FX(dailyCommission)) +
            impRow('Accrued (' + daysChargeable + 'd)', FX(dailyCommission * daysChargeable)) +
            (penalty > 0 ? impRow('⚠ Late fee', '+ ' + FX(penalty), '#b45309') : '') +
            (pendingBefore > 0 ? impRow('Pending from before', FX(pendingBefore)) : '') +
            '<div style="display:flex;justify-content:space-between;padding:8px 0 5px;font-weight:800;border-top:1.5px dashed var(--border);margin-top:6px"><span>Total commission due</span><span>' + FX(totalCommissionOwed) + '</span></div>' +
          '</div>' +
          /* Deductions */
          '<div style="padding:14px 18px;border-bottom:1px solid var(--border)">' +
            '<div style="font-size:10.5px;font-weight:800;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">📋 Deductions Due</div>' +
            (dueDeds.length === 0
              ? '<div style="color:var(--gray);font-style:italic;font-size:11.5px;padding:6px 0">No deductions due</div>'
              : dueDeds.map(d => impRow(d.label, FX(d.remaining))).join('') +
                '<div style="display:flex;justify-content:space-between;padding:8px 0 5px;font-weight:800;border-top:1.5px dashed var(--border);margin-top:6px"><span>Total</span><span>' + FX(totalDedDue) + '</span></div>'
            ) +
          '</div>' +
          /* Split */
          '<div style="padding:14px 18px;border-bottom:1px solid var(--border);border-left:1px solid var(--border)">' +
            '<div style="font-size:10.5px;font-weight:800;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">💳 Payment Split (' + F(pmt.amount) + ')</div>' +
            stepRow(1, '→ Deductions', FX(dedPaid), dedPaid > 0) +
            stepRow(2, '→ Pending commission', FX(commPendingPaid), commPendingPaid > 0) +
            stepRow(3, '→ Current commission', FX(commCurrentPaid), commCurrentPaid > 0) +
            stepRow(4, '→ Capital reduction', FX(capitalPaid), capitalPaid > 0, true) +
            '<div style="display:flex;justify-content:space-between;padding:8px 0 5px;font-weight:800;border-top:1.5px dashed var(--border);margin-top:8px"><span>Sum applied</span><span>' + FX(totalApplied) + '</span></div>' +
            (Math.abs(totalApplied - N(pmt.amount)) > 0.01
              ? impRow('Unapplied remainder', FX(N(pmt.amount) - totalApplied), '#b45309')
              : '') +
          '</div>' +
          /* Result */
          '<div style="padding:14px 18px;background:' + (isPending ? 'linear-gradient(135deg,#fffbeb,#fef3c7)' : 'linear-gradient(135deg,#f0fdf4,#dcfce7)') + ';grid-column:1/-1;border-bottom:1px solid var(--border)">' +
            '<div style="font-size:10.5px;font-weight:800;color:var(--gray);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">📊 ' + (isPending ? 'Impact When Cleared' : 'Impact Applied') + '</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">' +
              deltaBlock('Capital', capitalBefore, capitalAfter, '↓ ' + F(capitalPaid), capitalPaid > 0) +
              deltaBlock('Commission Paid', null, commPendingPaid + commCurrentPaid, 'Pending after: ' + F(pendingAfter), null) +
              deltaBlock('Progress', progressBefore.toFixed(1) + '%', progressAfter.toFixed(1) + '%', '↑ ' + (progressAfter - progressBefore).toFixed(1) + '%', true) +
            '</div>' +
            (pendingAfter > 0.01
              ? '<div style="margin-top:12px;padding:10px 12px;background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;font-size:12px;color:#92400e"><i class="fas fa-exclamation-triangle"></i> <strong>Carry-forward:</strong> ' + FX(pendingAfter) + ' will be deducted from the next cleared payment.</div>'
              : '') +
          '</div>' +
        '</div>' +
      '<div style="padding:12px 18px;background:var(--light);border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">' +
        '<button class="btn btn-xs ' + (isPending ? 'btn-success' : 'btn-secondary') + '" onclick="FIN.openChequeModal(\'' + pmt.id + '\')"><i class="fas fa-' + (isPending ? 'check' : 'edit') + '"></i> ' + (isPending ? 'Mark Cleared / Bounced' : 'Change Status') + '</button>' +
        '<button class="btn btn-xs btn-secondary" onclick="FIN.showReceipt(\'' + pmt.id + '\')"><i class="fas fa-receipt"></i> Receipt</button>' +
        '<button class="btn btn-xs btn-danger" onclick="FIN.deletePayment(\'' + pmt.id + '\')"><i class="fas fa-trash"></i> Delete</button>' +
      '</div>'
    ) +
  '</div>';

  function impRow(lbl, val, color) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px"><span style="color:var(--gray)">' + lbl + '</span><span style="font-weight:700;' + (color ? 'color:' + color : '') + '">' + val + '</span></div>';
  }
  function stepRow(num, lbl, val, active, capital) {
    const bg = capital ? 'linear-gradient(90deg,rgba(16,185,129,.08),transparent)' : 'white';
    return '<div style="display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 9px;background:' + bg + ';border-radius:7px;border:1px solid ' + (capital ? '#10b981' : 'var(--border)') + ';margin-bottom:5px;' + (active ? '' : 'opacity:.5') + '">' +
      '<div style="width:22px;height:22px;border-radius:50%;background:' + (active ? 'linear-gradient(135deg,#6366f1,#4f46e5)' : 'var(--light)') + ';color:' + (active ? 'white' : 'var(--gray)') + ';font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center">' + num + '</div>' +
      '<div style="font-size:12px;' + (active ? 'color:var(--dark);font-weight:600' : 'color:var(--gray)') + '">' + lbl + '</div>' +
      '<div style="font-weight:800;font-size:13px;' + (capital ? 'color:#10b981' : '') + '">' + val + '</div>' +
    '</div>';
  }
  function deltaBlock(label, from, to, badge, positive) {
    let valHTML = '';
    if (from === null) {
      valHTML = '<span style="font-size:18px;color:#f59e0b;font-weight:800">' + F(to) + '</span>';
    } else if (typeof from === 'string' && from.endsWith('%')) {
      valHTML = '<span style="color:var(--gray);text-decoration:line-through;font-size:12px">' + from + '</span><span style="color:var(--gray);font-size:11px">→</span><span style="color:var(--primary-dark);font-size:16px;font-weight:800">' + to + '</span>';
    } else {
      valHTML = '<span style="color:var(--gray);text-decoration:line-through;font-size:12px">' + F(from) + '</span><span style="color:var(--gray);font-size:11px">→</span><span style="color:var(--primary-dark);font-size:16px;font-weight:800">' + F(to) + '</span>';
    }
    const badgeClass = positive === true ? 'ok' : (positive === false ? 'warn' : 'warn');
    const badgeBg = positive === true ? '#d1fae5' : '#fef3c7';
    const badgeCol = positive === true ? '#065f46' : '#b45309';
    return '<div style="background:white;padding:12px;border-radius:10px;border:1px solid var(--border);text-align:center">' +
      '<div style="font-size:10px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">' + label + '</div>' +
      '<div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;flex-wrap:wrap">' + valHTML + '</div>' +
      '<div style="display:inline-block;margin-top:6px;padding:3px 8px;border-radius:8px;font-size:10.5px;font-weight:700;background:' + badgeBg + ';color:' + badgeCol + '">' + badge + '</div>' +
    '</div>';
  }
}

/* ══════════════════════════════════════════════════════
   SCHEDULE TABLE
   ══════════════════════════════════════════════════════ */
function scheduleHTML(replay, pendingChqs, bouncedChqs, projection) {
  const plan = (replay && replay.plan) ? replay.plan : (planById(FIN.activePlanId) || {});
  const committed = replay ? replay.timeline : [];
  const pendingRows = projection ? projection.pendingOnly : [];
  const bounced = (bouncedChqs || []).map(c => ({ payment: c, kind: 'bounced' }));

  const allRows = [
    ...committed.map(t => Object.assign({}, t, { kind: 'committed' })),
    ...pendingRows,
    ...bounced.map(b => ({ payment: b.payment, kind: 'bounced', days: 0, commissionPaid: 0, capitalPaid: 0, capitalAfter: null }))
  ].sort((a,b) => new Date(a.payment.effectiveDate || a.payment.date) - new Date(b.payment.effectiveDate || b.payment.date));

  if (allRows.length === 0) {
    return '<div class="empty-state"><i class="fas fa-calendar-alt"></i><h3>No payments yet</h3><p style="margin-top:8px">Commission begins accruing from <strong>' + dfmt(plan.startDate) + '</strong></p></div>';
  }
  const expectedInterval = N(plan.expectedInterval) || 30;

  return '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px">' +
      '<div style="background:var(--light);padding:8px 12px;border-radius:8px;font-size:12px"><strong>Cleared:</strong> ' + committed.length + '</div>' +
      '<div style="background:#fffbeb;padding:8px 12px;border-radius:8px;font-size:12px;color:#92400e"><strong>Pending:</strong> ' + pendingRows.length + '</div>' +
      '<div style="background:#fef2f2;padding:8px 12px;border-radius:8px;font-size:12px;color:#991b1b"><strong>Bounced:</strong> ' + bounced.length + '</div>' +
    '</div>' +
    '<div style="overflow-x:auto"><table style="font-size:12.5px">' +
      '<thead><tr><th>#</th><th>Payment Date</th><th>Period</th><th>Capital Before</th><th>Commission</th><th>Capital Reduced</th><th>Capital After</th><th>Status</th></tr></thead>' +
      '<tbody>' + allRows.map((t, i) => {
        const isPending = t.kind === 'pending';
        const isBounced = t.kind === 'bounced';
        const rowClass = isBounced ? 'bounced-row' : (isPending ? 'pending-row' : (t.wasLate ? 'late-row' : 'paid-row'));
        const rowBg = isBounced ? '#fef2f2' : (isPending ? '#fffbeb' : 'white');
        const statusLabel = isBounced ? 'BOUNCED' : (isPending ? '⏳ PENDING' : (t.wasLate ? 'LATE +' + (t.days - expectedInterval) + 'd' : 'ON TIME'));
        const statusColor = isBounced ? '#ef4444' : (isPending ? '#f59e0b' : (t.wasLate ? '#f59e0b' : '#10b981'));
        return '<tr style="background:' + rowBg + ';' + (isBounced ? 'opacity:.7;' : '') + '">' +
          '<td>#' + (i+1) + '</td>' +
          '<td><strong>' + dfmt(t.payment.effectiveDate || t.payment.date) + '</strong></td>' +
          '<td>' + (t.startDate ? dfmt(t.startDate) + ' → ' + dfmt(t.endDate) : '—') + (t.days ? '<div style="font-size:10px;color:var(--gray)">' + t.days + ' days</div>' : '') + '</td>' +
          '<td>' + (t.capitalBefore !== undefined ? F(t.capitalBefore) : '—') + '</td>' +
          '<td style="color:' + (isPending || isBounced ? 'var(--gray)' : 'var(--warning)') + ';font-weight:600">' + (isBounced ? '—' : F(t.commissionPaid)) + (t.penalty > 0 ? '<div style="font-size:10px;color:#b45309">incl. ' + F(t.penalty) + '</div>' : '') + '</td>' +
          '<td style="color:' + (isPending || isBounced ? 'var(--gray)' : 'var(--success)') + ';font-weight:600">' + (isBounced ? '—' : F(t.capitalPaid)) + '</td>' +
          '<td>' + (t.capitalAfter !== null && t.capitalAfter !== undefined ? '<strong>' + F(t.capitalAfter) + '</strong>' : '—') + '</td>' +
          '<td><span style="padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;background:' + statusColor + ';color:white">' + statusLabel + '</span></td>' +
        '</tr>';
      }).join('') + '</tbody>' +
    '</table></div>';
}

/* ══════════════════════════════════════════════════════
   DEDUCTIONS TABLE
   ══════════════════════════════════════════════════════ */
function deductionsTableHTML(planDeds) {
  if (!planDeds.length) return '<div class="empty-state"><i class="fas fa-shield-alt"></i><h3>No planned deductions</h3></div>';
  return '<div class="table-container"><table>' +
    '<thead><tr><th>Label</th><th>Total</th><th>Paid</th><th>Remaining</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>' +
    '<tbody>' + planDeds.map(d => {
      const rem = remainingDed(d);
      const direct = paidDirect(d);
      const fromMain = paidFromMain(d);
      const total = paidTotal(d);
      const overdue = isOverdueDed(d);
      const daysOver = daysOverdueDed(d);
      const sk = statusKeyDed(d);
      const pct = N(d.amount) > 0 ? (total / N(d.amount) * 100) : 0;
      let statusBg = '#fef3c7', statusCol = '#b45309', statusLabel = 'Pending';
      if (sk === 'settled') { statusBg = '#d1fae5'; statusCol = '#065f46'; statusLabel = 'Settled ✓'; }
      else if (sk === 'partial') { statusBg = '#dbeafe'; statusCol = '#1e40af'; statusLabel = 'Partial'; }
      if (overdue && sk !== 'settled') { statusBg = '#fee2e2'; statusCol = '#b91c1c'; statusLabel = 'Overdue ' + daysOver + 'd'; }

      return '<tr>' +
        '<td><strong>' + E(d.label) + '</strong>' + (d.notes ? '<div style="font-size:11px;color:var(--gray)">' + E(d.notes) + '</div>' : '') + '</td>' +
        '<td><strong>' + F(d.amount) + '</strong></td>' +
        '<td>' +
          (direct > 0 ? '<div style="color:var(--info);font-weight:600">' + F(direct) + ' <span style="font-size:10px;color:var(--gray)">direct</span></div>' : '') +
          (fromMain > 0 ? '<div style="color:var(--warning);font-weight:600">' + F(fromMain) + ' <span style="font-size:10px;color:var(--gray)">from cleared</span></div>' : '') +
          (total === 0 ? '<span style="color:var(--gray)">—</span>' : '') +
          '<div style="background:var(--border);height:5px;border-radius:3px;overflow:hidden;width:100px;margin-top:4px"><div style="height:100%;width:' + pct + '%;background:var(--primary)"></div></div>' +
        '</td>' +
        '<td><strong style="color:' + (rem > 0 ? 'var(--danger)' : 'var(--success)') + '">' + F(rem) + '</strong></td>' +
        '<td style="color:' + (overdue ? 'var(--danger)' : 'inherit') + ';font-weight:' + (overdue ? '700' : '400') + '">' + dfmt(d.dueDate) + (overdue ? '<div style="font-size:10px;color:var(--danger)">⚠ ' + daysOver + 'd</div>' : '') + '</td>' +
        '<td><span style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px;font-weight:700;background:' + statusBg + ';color:' + statusCol + '">' + statusLabel + '</span></td>' +
        '<td>' +
          '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
            (rem > 0.001 ? '<button class="btn btn-xs btn-success" onclick="FIN.openDedPayModal(\'' + d.id + '\')"><i class="fas fa-hand-holding-usd"></i> Pay</button>' : '') +
            '<button class="btn btn-xs btn-secondary" onclick="FIN.showDedDetail(\'' + d.id + '\')"><i class="fas fa-eye"></i></button>' +
            '<button class="btn btn-xs btn-danger" onclick="FIN.removeDeduction(\'' + d.id + '\')"><i class="fas fa-trash"></i></button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    }).join('') + '</tbody>' +
  '</table></div>';
}

  /* ── Plan CRUD ── */
  openPlanModal(id) {
    const p = id ? planById(id) : null;
    NC.modal({
      id:'finPlanModal',
      title: p ? 'Edit Finance Plan' : 'New Finance Plan',
      width:720,
      fields: [
        { id:'company', label:'Finance Company *', type:'text', required:true, value:p ? p.company : '', hint:'e.g. LOLC Finance' },
        { id:'vehicle', label:'Vehicle / Loan *', type:'text', required:true, value:p ? p.vehicle : '', hint:'e.g. Toyota Axio' },
        { id:'capitalStart', label:'Starting Capital (Rs.) *', type:'number', required:true, step:'0.01', value:p ? p.capitalStart : '' },
        { id:'commissionRate', label:'Commission Rate (per 100,000/day) *', type:'number', required:true, step:'0.01', value:p ? p.commissionRate : '48' },
        { id:'startDate', label:'Plan Start Date *', type:'date', required:true, value:p ? p.startDate : T() },
        { id:'endDate', label:'Expected End Date', type:'date', value:p ? (p.endDate || '') : '' },
        { id:'expectedInterval', label:'Expected Payment Interval (days)', type:'number', value:p ? (p.expectedInterval || 30) : 30 },
        { id:'penaltyRate', label:'Late Fee (%)', type:'number', step:'0.1', value:p ? (p.penaltyRate || 0) : 0 },
        { id:'gracePeriod', label:'Grace Period (days)', type:'number', value:p ? (p.gracePeriod || 0) : 0 },

            capitalCurrent: Math.max(0, N(p.capitalCurrent) + diff),

            pendingCommission: N(p.pendingCommission),
            status: p.status || 'active',
            updatedAt: NC.ts()
          }), { merge:true });
          NC.toast('Plan updated', 'success');

          await db.collection('finance_plans').add(Object.assign({}, d, {
            capitalStart: capital,
            capitalCurrent: capital,
            commissionRate: rate,
            pendingCommission: 0,
            status: 'active',
            createdAt: NC.ts(),
            createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
          }));
          NC.toast('Plan created', 'success');

  onMethodChange() {
    const m = $('finPayMethod').value;

  previewCalc() {
    const planId = FIN.activePlanId;
    const p = planById(planId);
    if (!p) return;
    const method = $('finPayMethod').value;
    const amount = N($('finPayAmount').value);
    const effDate = method === 'cheque' ? $('finPayChequeDate').value : $('finPayDate').value;
    const chequeStatus = $('finPayChequeStatus').value;
    const willApplyNow = method !== 'cheque' || chequeStatus === 'cleared';
    const host = $('finCalcPreview');
    if (!host) return;

    if (!amount || amount <= 0 || !effDate) {
      host.innerHTML = '<div style="text-align:center;color:var(--gray);font-size:13px"><i class="fas fa-calculator"></i> Enter amount and dates to see the breakdown</div>';
      return;
    }
    const calc = calcPayment(p, amount, effDate);
    const isBackdated = FIN.payments.some(x =>
      x.planId === planId && x.status !== 'pending' && x.status !== 'bounced'
      && new Date(x.effectiveDate || x.date) > new Date(effDate));

    const dedPaid = calc.breakdown.deductions.reduce((s,d) => s + d.paid, 0);
    const commPendingPaid = calc.breakdown.commissionPending;
    const commCurrentPaid = calc.breakdown.commissionCurrent;
    const capitalPaid = calc.breakdown.capital;
    const totalApplied = dedPaid + commPendingPaid + commCurrentPaid + capitalPaid;

    host.innerHTML =
      (!willApplyNow
        ? '<div style="background:#fffbeb;border:1.5px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:12px"><i class="fas fa-hourglass-half"></i> <strong>PENDING.</strong> Recorded but will NOT reduce capital or add commission until Cleared.</div>'
        : '<div style="background:#d1fae5;border:1.5px solid #10b981;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#065f46;margin-bottom:12px"><i class="fas fa-check-circle"></i> <strong>Will apply immediately</strong> — capital and commission update on save.</div>') +
      (isBackdated ? '<div style="background:#dbeafe;border:1.5px solid #3b82f6;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#1e40af;margin-bottom:12px"><i class="fas fa-history"></i> <strong>Backdated entry.</strong> Plan will be replayed chronologically.</div>' : '') +
      '<div style="font-weight:800;font-size:13px;margin-bottom:10px;color:var(--primary-dark)"><i class="fas fa-calculator"></i> Breakdown — effective ' + dfmt(calc.effectiveDate) + '</div>' +
      crow('Days from last cleared payment', calc.days + ' days') +
      crow('Chargeable days (grace: ' + calc.grace + 'd)', calc.daysChargeable, true) +
      crow('Capital at this point', FX(p.capitalCurrent)) +
      crow('Daily commission', FX(calc.dailyCommission), true) +
      crow('Accrued commission', FX(calc.accruedCommission - calc.penalty), true) +
      (calc.penalty > 0 ? crow('⚠ Late fee (' + p.penaltyRate + '%)', FX(calc.penalty), true, '#b45309') : '') +
      crow('Pending commission', FX(calc.pendingBefore), false, calc.pendingBefore > 0 ? 'var(--danger)' : '') +
      crow('Due deductions', FX(calc.deductionsTotal), false, calc.deductionsTotal > 0 ? 'var(--warning)' : '') +
      '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:14.5px;border-top:2px solid var(--info);margin-top:6px;color:var(--primary-dark)"><span>Total Due</span><span>' + FX(calc.totalDue) + '</span></div>' +
      '<div style="margin:14px 0 8px;font-weight:700;font-size:12px;color:var(--gray);text-transform:uppercase">How the payment is applied</div>' +
      calc.breakdown.deductions.map(d => crow((d.fullyPaid ? '✓ ' : '◐ ') + d.label, FX(d.paid), true)).join('') +
      crow('→ Pending commission', FX(commPendingPaid), true) +
      crow('→ Current commission', FX(commCurrentPaid), true) +
      crow('→ Capital reduction', FX(capitalPaid), true, 'var(--success)') +
      '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:14.5px;border-top:2px solid var(--info);margin-top:6px;color:var(--primary-dark)"><span>Sum applied</span><span>' + FX(totalApplied) + '</span></div>' +
      crow('New Pending Commission', FX(calc.newPendingCommission), false, calc.newPendingCommission > 0 ? 'var(--danger)' : 'var(--success)') +
      crow('New Capital', FX(calc.newCapitalCurrent)) +
      (calc.newPendingCommission > 0 ? '<div style="margin-top:10px;padding:10px;background:#fef3c7;color:#92400e;border-radius:8px;font-size:12px"><i class="fas fa-exclamation-triangle"></i> Shortfall of ' + FX(calc.newPendingCommission) + ' carries to next payment.</div>' : '');

    function crow(lbl, val, sub, color) {
      return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,.08);' + (sub ? 'padding-left:16px;font-size:12px;color:var(--gray)' : '') + '"><span>' + lbl + '</span><strong style="' + (color ? 'color:' + color : '') + '">' + val + '</strong></div>';
    }
  },

  async savePayment(planId) {
    const p = planById(planId);
    if (!p) return NC.toast('Plan not found', 'error');

    const method = $('finPayMethod').value;
    const amount = N($('finPayAmount').value);
    const effDate = method === 'cheque' ? $('finPayChequeDate').value : $('finPayDate').value;
    const notes = $('finPayNotes').value.trim();
    if (!amount || amount <= 0 || !effDate) return NC.toast('Fill required fields', 'error');

    let reference = '', chequeNo = '', chequeBank = '', chequeStatus = 'cleared';
    if (method === 'cheque') {
      chequeNo = $('finPayChequeNo').value.trim();
      chequeBank = $('finPayChequeBank').value.trim();
      chequeStatus = $('finPayChequeStatus').value;
      if (!chequeNo) return NC.toast('Cheque number is required', 'error');
      reference = 'Cheque #' + chequeNo + (chequeBank ? ' · ' + chequeBank : '');
    } else {
      reference = ($('finPayRef') || {}).value || '';
    }

    const isBackdated = FIN.payments.some(x =>
      x.planId === planId && x.status !== 'pending' && x.status !== 'bounced'
      && new Date(x.effectiveDate || x.date) > new Date(effDate));

    const calc = calcPayment(p, amount, effDate);
    const payment = {
      planId,
      date: method === 'cheque' ? T() : effDate,
      effectiveDate: calc.effectiveDate,
      amount, method, reference, chequeNo, chequeBank,
      status: chequeStatus, notes,
      breakdown: {
        days: calc.days, daysChargeable: calc.daysChargeable, grace: calc.grace,
        dailyCommission: calc.dailyCommission,
        accruedCommission: calc.accruedCommission, penalty: calc.penalty,
        pendingBefore: calc.pendingBefore, deductionsTotal: calc.deductionsTotal,
        deductions: calc.breakdown.deductions,
        commissionPending: calc.breakdown.commissionPending,
        commissionCurrent: calc.breakdown.commissionCurrent,
        capital: calc.breakdown.capital
      },
      newPendingCommission: calc.newPendingCommission,
      newCapital: calc.newCapitalCurrent,
      createdAt: NC.ts(),
      createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
    };

    try {
      const ref = await db.collection('finance_payments').add(payment);
      payment.id = ref.id;

      if (chequeStatus === 'cleared') {
        for (const dd of calc.breakdown.deductions) {
          if (!dd.paid || dd.paid <= 0) continue;
          const ded = dedById(dd.id);
          if (!ded) continue;
          await db.collection('finance_deductions').doc(ded.id).update({
            mainDeductions: NC.au({ paymentId: ref.id, amount: dd.paid, date: payment.effectiveDate })
          }).catch(e => console.warn('[save] ded update', e));
        }
        if (isBackdated) {
          NC.toast('Backdated — recalculating…', 'info');
          await loadFinance(true);
          await recalcPlan(planId);
          await loadFinance(true);
        } else {
          const update = {
            capitalCurrent: calc.newCapitalCurrent,
            pendingCommission: calc.newPendingCommission,
            updatedAt: NC.ts()
          };
          if (calc.newCapitalCurrent <= 0.01 && calc.newPendingCommission <= 0.01) update.status = 'completed';
          await db.collection('finance_plans').doc(planId).set(update, { merge:true });
          await loadFinance(true);
        }
        NC.toast('✅ Payment ' + F(amount) + ' CLEARED — applied', 'success');
      } else {
        await loadFinance(true);
        NC.toast('⏳ Cheque ' + F(amount) + ' recorded as PENDING', 'info');
      }
      NC.closeModal('finPayModal');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) {
      console.error(e);
      NC.toast('Error: ' + e.message, 'error');
    }
  },

  async deletePayment(id) {
    const pmt = paymentById(id);
    if (!pmt) return;
    if (!await NC.confirm('Delete this payment? Plan will be recalculated.', { danger:true, confirmLabel:'Delete' })) return;
    try {
      await db.collection('finance_payments').doc(id).delete();
      await loadFinance(true);
      await recalcPlan(pmt.planId);
      await loadFinance(true);
      NC.toast('Payment deleted & plan recalculated', 'success');
      if (NC.state.activeView === 'finance-plan-detail' && FIN.activePlanId === pmt.planId) {
        renderPlanDetail($('finance-plan-detail'));
      } else {
        renderFinanceTab();
      }
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  async forceRecalc(planId) {
    if (!await NC.confirm('Recalculate the plan from scratch? Only CLEARED payments will be replayed.', { confirmLabel:'Recalculate' })) return;
    try {
      await loadFinance(true);
      await recalcPlan(planId);
      await loadFinance(true);
      NC.toast('Plan recalculated', 'success');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },
