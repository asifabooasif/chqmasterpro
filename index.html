<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonCheque · Aurora</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --primary:#6366f1;--primary-dark:#4f46e5;--secondary:#06b6d4;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --dark:#1e293b;--light:#f8fafc;--gray:#64748b;--border:#e2e8f0;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;overflow-x:hidden;color:var(--dark)}
.hidden{display:none!important}
a{color:var(--primary);text-decoration:none}

/* ──────── LOGIN ──────── */
.login-bg{background:radial-gradient(ellipse at 20% 30%,rgba(168,85,247,.4) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 20%,rgba(236,72,153,.3) 0%,transparent 50%),
  linear-gradient(180deg,#1e1b4b 0%,#312e81 50%,#4c1d95 100%);
  position:fixed;inset:0;z-index:-1;overflow:hidden}
.mountain{position:absolute;bottom:0;width:0;height:0;border-left:300px solid transparent;border-right:300px solid transparent;border-bottom:400px solid rgba(147,51,234,.3);animation:float 8s ease-in-out infinite}
.mountain-1{left:-100px;animation-delay:0s}
.mountain-2{left:200px;bottom:50px;border-bottom-color:rgba(168,85,247,.25);animation-delay:2s}
.mountain-3{right:-50px;border-bottom-color:rgba(192,132,252,.2);animation-delay:4s}
.moon{position:absolute;top:80px;right:150px;width:80px;height:80px;background:radial-gradient(circle,rgba(251,191,36,.8) 0%,rgba(245,158,11,.4) 100%);border-radius:50%;box-shadow:0 0 40px rgba(251,191,36,.5);animation:pulse 4s ease-in-out infinite}
.star{position:absolute;background:white;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
.star-1{top:100px;left:200px;width:3px;height:3px}
.star-2{top:150px;left:400px;width:2px;height:2px;animation-delay:.5s}
.star-3{top:200px;left:100px;width:4px;height:4px;animation-delay:1s}
.star-4{top:120px;left:600px;width:2px;height:2px;animation-delay:1.5s}
.login-container{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.login-box{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:24px;padding:48px;width:100%;max-width:450px;box-shadow:0 25px 50px rgba(0,0,0,.25);animation:slideUp .6s ease;position:relative;z-index:1}
.login-header{text-align:center;margin-bottom:32px}
.login-header h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ──────── FORMS & BUTTONS ──────── */
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:13px;color:var(--dark)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;transition:all .3s ease;background:white}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:11px 22px;border:none;border-radius:10px;font-weight:600;cursor:pointer;transition:all .3s ease;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-family:inherit;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(99,102,241,.3)}
.btn-secondary{background:white;color:var(--dark);border:2px solid var(--border)}
.btn-secondary:hover{background:var(--light);transform:translateY(-2px)}
.btn-success{background:linear-gradient(135deg,var(--success),#059669);color:white}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(16,185,129,.3)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#dc2626);color:white}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 15px rgba(239,68,68,.3)}
.btn-info{background:linear-gradient(135deg,var(--info),#2563eb);color:white}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px}
.btn-block{width:100%;justify-content:center}

/* ──────── APP SHELL ──────── */
.nc-app{display:none;min-height:100vh;position:relative;z-index:1}
.nc-app.active{display:flex;animation:fadeIn .5s ease}
.nc-sidebar{width:270px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border-right:1px solid var(--border);padding:24px;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:all .3s ease;animation:slideIn .5s ease}
.nc-sidebar-header{margin-bottom:22px}
.nc-sidebar-header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nc-version-badge{display:inline-block;padding:3px 10px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border-radius:20px;font-size:10px;font-weight:700;margin-top:6px}
.nc-nav-tabs{display:flex;gap:4px;margin-bottom:16px;padding:4px;background:var(--light);border-radius:12px;position:sticky;top:0;z-index:5}
.nc-nav-tab{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:9px;font-weight:700;font-size:11px;cursor:pointer;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .18s ease;font-family:inherit}
.nc-nav-tab.active{background:white;box-shadow:0 2px 8px rgba(99,102,241,.18);transform:translateY(-1px)}
.nc-nav-pane{display:none;flex-direction:column;gap:2px}
.nc-nav-pane.active{display:flex}
.nc-nav-title{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--gray);margin-bottom:10px;letter-spacing:.5px;padding-left:8px}
.nc-nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .3s ease;margin-bottom:4px;font-weight:500;font-size:14px;color:var(--dark);position:relative;overflow:hidden}
.nc-nav-item::before{content:'';position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(135deg,var(--primary),var(--primary-dark));transition:width .3s ease;z-index:-1}
.nc-nav-item:hover::before{width:100%}
.nc-nav-item:hover{color:white;transform:translateX(5px)}
.nc-nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;transform:translateX(5px)}
.nc-nav-item i{width:18px;text-align:center;transition:transform .3s ease}
.nc-nav-item:hover i{transform:scale(1.2)}
.nc-main{margin-left:270px;padding:28px;flex:1;width:calc(100% - 270px);transition:all .3s ease;position:relative;z-index:1;min-height:100vh}
.nc-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:16px 24px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);animation:slideDown .5s ease}
.nc-page-title{font-size:24px;font-weight:800}
.nc-topbar-right{display:flex;align-items:center;gap:12px}
.nc-user-name{font-weight:700}
.nc-user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
.nc-mobile-menu-btn{display:none;width:40px;height:40px;border:none;background:var(--primary);color:white;border-radius:10px;cursor:pointer;font-size:18px;margin-right:12px}
.nc-sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;backdrop-filter:blur(4px)}
.nc-sidebar-close-btn{display:none;position:absolute;top:20px;right:20px;width:36px;height:36px;border:none;background:var(--light);border-radius:8px;cursor:pointer;font-size:16px}

/* ──────── VIEWS ──────── */
.nc-view{display:none;animation:fadeIn .4s ease}
.nc-view.active{display:block}

/* ──────── CARDS & WIDGETS ──────── */
.card{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:24px;animation:slideUp .6s ease}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.card-title{font-size:18px;font-weight:700}
.widgets-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:24px}
.widget{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:all .3s ease}
.widget:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(0,0,0,.1)}
.widget-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.widget-title{font-size:13px;font-weight:600;color:var(--gray)}
.widget-value{font-size:28px;font-weight:800}
.widget-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.widget-icon.primary{background:#dbeafe;color:var(--info)}
.widget-icon.success{background:#d1fae5;color:var(--success)}
.widget-icon.warning{background:#fef3c7;color:var(--warning)}
.widget-icon.danger{background:#fee2e2;color:var(--danger)}

/* ──────── TABLES ──────── */
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:14px;text-align:left;border-bottom:1px solid var(--border)}
th{font-weight:700;color:var(--gray);font-size:11px;text-transform:uppercase;background:var(--light)}
tr:hover{background:var(--light)}

/* ──────── BADGES ──────── */
.status-badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.status-draft{background:#f1f5f9;color:#475569}
.status-in-hand{background:#dbeafe;color:#1e40af}
.status-issued{background:#fef3c7;color:#b45309}
.status-deposited{background:#e0e7ff;color:#4338ca}
.status-returned{background:#fee2e2;color:#b91c1c}
.status-cleared{background:#d1fae5;color:#065f46}
.status-stopped{background:#fecaca;color:#991b1b}

/* ──────── MODAL ──────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s ease}
.modal-overlay.active{display:flex}
.modal{background:white;border-radius:18px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.25);animation:scaleIn .4s ease}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;border-radius:18px 18px 0 0;z-index:10}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border:none;background:var(--light);border-radius:8px;cursor:pointer;transition:all .3s ease;font-size:14px}
.modal-close:hover{background:var(--danger);color:white}
.modal-body{padding:24px}
.modal-footer{padding:20px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:white;border-radius:0 0 18px 18px}

/* ──────── TOAST ──────── */
.nc-toast-container{position:fixed;top:20px;right:20px;z-index:3000}
.toast{background:white;padding:14px 20px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);margin-bottom:10px;animation:slideInRight .4s ease;min-width:300px;border-left:4px solid var(--info);display:flex;align-items:center;gap:12px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast i{font-size:16px}

/* ──────── EMPTY STATE ──────── */
.empty-state{text-align:center;padding:50px 20px;color:var(--gray)}
.empty-state i{font-size:56px;margin-bottom:14px;opacity:.3;display:block}
.empty-state h3{color:var(--dark);margin-bottom:8px}

/* ──────── MOBILE ──────── */
@media (max-width:768px){
  .nc-sidebar{transform:translateX(-100%);width:280px}
  .nc-sidebar.active{transform:translateX(0)}
  .nc-sidebar-close-btn{display:block}
  .nc-sidebar-overlay.active{display:block}
  .nc-main{margin-left:0;padding:16px;width:100%}
  .nc-mobile-menu-btn{display:block}
  .nc-topbar{padding:12px 16px;flex-wrap:wrap;gap:12px}
  .nc-page-title{font-size:20px}
  .widgets-grid{grid-template-columns:1fr;gap:12px}
  .form-row{grid-template-columns:1fr}
  .modal{max-width:100%;margin:10px}
  .modal-footer{flex-direction:column}
  .modal-footer .btn{width:100%;justify-content:center}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     LOGIN SCREEN
     ══════════════════════════════════════════════════════ -->
<div class="login-container" id="ncLoginScreen">
  <div class="login-bg">
    <div class="moon"></div>
    <div class="star star-1"></div><div class="star star-2"></div>
    <div class="star star-3"></div><div class="star star-4"></div>
    <div class="mountain mountain-1"></div>
    <div class="mountain mountain-2"></div>
    <div class="mountain mountain-3"></div>
  </div>
  <div class="login-box">
    <div class="login-header">
      <h1>NeonCheque</h1>
      <p style="color:var(--gray);font-size:14px;margin-top:8px">Secure • Real-time • Team-ready</p>
    </div>
    <form id="ncLoginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="ncLoginEmail" placeholder="you@company.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="ncLoginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    <div style="text-align:center;margin-top:20px;color:var(--gray);font-size:13px">
      <p>Don't have an account? <a href="#" onclick="NC.showSignup();return false;" style="font-weight:600">Sign Up</a></p>
    </div>
    <button class="btn btn-secondary btn-block" onclick="NC.signInWithGoogle()" style="margin-top:16px">
      <i class="fab fa-google"></i> Sign in with Google
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     SIGNUP SCREEN
     ══════════════════════════════════════════════════════ -->
<div class="login-container hidden" id="ncSignupScreen">
  <div class="login-bg">
    <div class="moon"></div>
    <div class="star star-1"></div><div class="star star-2"></div>
    <div class="mountain mountain-1"></div><div class="mountain mountain-2"></div>
  </div>
  <div class="login-box">
    <div class="login-header"><h1>Create Account</h1></div>
    <form id="ncSignupForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="ncSignupName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="ncSignupEmail" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="ncSignupPassword" required minlength="6"></div>
      <button type="submit" class="btn btn-primary btn-block">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>
    <div style="text-align:center;margin-top:20px;color:var(--gray);font-size:13px">
      <p>Already have an account? <a href="#" onclick="NC.showLogin();return false;" style="font-weight:600">Sign In</a></p>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════ -->
<div class="nc-app" id="ncApp">
  <div class="nc-sidebar-overlay" id="ncSidebarOverlay" onclick="NC.toggleSidebar()"></div>

  <aside class="nc-sidebar" id="ncSidebar">
    <button class="nc-sidebar-close-btn" onclick="NC.toggleSidebar()">
      <i class="fas fa-times"></i>
    </button>
    <div class="nc-sidebar-header">
      <h1>NeonCheque</h1>
      <span class="nc-version-badge">✦ v6.0</span>
    </div>
    <div class="nc-nav-tabs" id="ncNavTabs"></div>
    <nav id="ncNavPanes"></nav>
  </aside>

  <main class="nc-main">
    <div class="nc-topbar">
      <div style="display:flex;align-items:center">
        <button class="nc-mobile-menu-btn" onclick="NC.toggleSidebar()">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="nc-page-title" id="ncPageTitle">Dashboard</h1>
      </div>
      <div class="nc-topbar-right">
        <div id="ncBellSlot"></div>
        <div class="nc-user-name" id="ncUserName">User</div>
        <div class="nc-user-avatar" id="ncUserAvatar">U</div>
      </div>
    </div>
    <div id="ncMainContent">
      <div class="empty-state">
        <i class="fas fa-circle-notch" style="animation:rotate 1.2s linear infinite;color:var(--primary)"></i>
        <h3>Loading modules…</h3>
      </div>
    </div>
  </main>
</div>

<!-- Root containers for modals & toasts -->
<div id="ncModalRoot"></div>
<div id="ncToastRoot" class="nc-toast-container"></div>

<!-- ══════════════════════════════════════════════════════
     PART 1 — CORE (window.NC)
     ══════════════════════════════════════════════════════ -->
<script>
(function () {
'use strict';
if (window.NC && window.NC.__core) return;

/* ══════════════════════════════════════════════════════════
   1 · FIREBASE
   ══════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyAZ7wyQhcaWoZa1ify5xqUKk12YodLTxU8",
  authDomain: "neoncheque.firebaseapp.com",
  projectId: "neoncheque",
  storageBucket: "neoncheque.firebasestorage.app",
  messagingSenderId: "963160183498",
  appId: "1:963160183498:web:d4ed74978b8c66be251a33",
  measurementId: "G-GE2TJQBDNX"
};
firebase.initializeApp(firebaseConfig);
window.db = firebase.firestore();
window.auth = firebase.auth();

/* ══════════════════════════════════════════════════════════
   2 · THE NC OBJECT
   ══════════════════════════════════════════════════════════ */
const NC = {};
window.NC = NC;
NC.__core = true;
NC.version = '6.0';

/* ─── Registries ─── */
NC.modules = {};       // name -> config
NC.views   = {};       // id -> { id, title, tab, icon, render }
NC.state   = {         // global reactive state
  user: null,
  allCheques: [],
  categories: [],
  loans: [],
  projects: [],
  parties: [],
  banks: []
};
NC.data    = {};       // per-collection cache
NC._events = {};       // pub/sub

/* ══════════════════════════════════════════════════════════
   3 · UTILITIES
   ══════════════════════════════════════════════════════════ */
NC.$ = id => document.getElementById(id);
NC.N = n => { const v = parseFloat(n); return isNaN(v) ? 0 : v; };
NC.fmt = n => 'Rs. ' + Math.round(NC.N(n)).toLocaleString('en-IN');
NC.fmtExact = n => 'Rs. ' + NC.N(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
NC.E = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
NC.T = () => new Date().toISOString().slice(0, 10);
NC.nowISO = () => new Date().toISOString();
NC.uid = p => (p || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
NC.ts = () => firebase.firestore.FieldValue.serverTimestamp();
NC.au = v => firebase.firestore.FieldValue.arrayUnion(v);
NC.ar = v => firebase.firestore.FieldValue.arrayRemove(v);
NC.inc = n => firebase.firestore.FieldValue.increment(n);
NC.dateFmt = d => {
  if (!d) return '—';
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
};
NC.daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ══════════════════════════════════════════════════════════
   4 · TOAST
   ══════════════════════════════════════════════════════════ */
NC.toast = function (msg, type) {
  type = type || 'info';
  const root = NC.$('ncToastRoot');
  if (!root) return;
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icon = type === 'success' ? 'check-circle'
             : type === 'error'   ? 'exclamation-circle'
             : type === 'warning' ? 'exclamation-triangle'
             : 'info-circle';
  t.innerHTML = '<i class="fas fa-' + icon + '"></i><span>' + NC.E(msg) + '</span>';
  root.appendChild(t);
  setTimeout(() => t.remove(), 3500);
};

/* ══════════════════════════════════════════════════════════
   5 · MODAL ENGINE
   ══════════════════════════════════════════════════════════ */
NC.modal = function (opts) {
  opts = opts || {};
  const id = opts.id || ('ncModal_' + Date.now().toString(36));
  let host = NC.$(id);
  if (host) host.remove();

  host = document.createElement('div');
  host.id = id;
  host.className = 'modal-overlay';
  host.style.zIndex = opts.zIndex || 2100;

  const width = opts.width || 560;
  const fields = opts.fields || [];
  const saveLabel = opts.saveLabel || 'Save';
  const cancelLabel = opts.cancelLabel || 'Cancel';

  let bodyHTML = '';
  fields.forEach(f => {
    const req = f.required ? ' *' : '';
    const v = f.value == null ? '' : String(f.value);
    let input;
    if (f.type === 'select') {
      input = '<select id="ncMF_' + f.id + '">' +
        (f.placeholder ? '<option value="">' + NC.E(f.placeholder) + '</option>' : '') +
        (f.options || []).map(o => {
          const val = typeof o === 'string' ? o : o.value;
          const lbl = typeof o === 'string' ? o : o.label;
          return '<option value="' + NC.E(val) + '"' + (String(v) === String(val) ? ' selected' : '') + '>' + NC.E(lbl) + '</option>';
        }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      input = '<textarea id="ncMF_' + f.id + '" rows="3">' + NC.E(v) + '</textarea>';
    } else {
      input = '<input type="' + (f.type || 'text') + '" id="ncMF_' + f.id + '" value="' + NC.E(v) + '"' +
              (f.step ? ' step="' + f.step + '"' : '') +
              (f.min != null ? ' min="' + f.min + '"' : '') +
              (f.max != null ? ' max="' + f.max + '"' : '') + '>';
    }
    const hint = f.hint ? '<small style="color:var(--gray);font-size:11px">' + NC.E(f.hint) + '</small>' : '';
    bodyHTML += '<div class="form-group"><label>' + NC.E(f.label) + req + '</label>' + input + hint + '</div>';
  });
  if (opts.bodyHTML) bodyHTML += opts.bodyHTML;

  host.innerHTML =
    '<div class="modal" style="max-width:' + width + 'px">' +
      '<div class="modal-header">' +
        '<h2 class="modal-title">' + (opts.title || 'Dialog') + '</h2>' +
        '<button class="modal-close" data-close="1"><i class="fas fa-times"></i></button>' +
      '</div>' +
      '<div class="modal-body">' + bodyHTML + '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn btn-secondary" data-close="1">' + NC.E(cancelLabel) + '</button>' +
        (opts.hideSave ? '' : '<button class="btn btn-primary" id="' + id + '_save"><i class="fas fa-save"></i> ' + NC.E(saveLabel) + '</button>') +
      '</div>' +
    '</div>';

  document.body.appendChild(host);

  // close handlers
  host.querySelectorAll('[data-close]').forEach(el => el.onclick = () => host.classList.remove('active'));
  host.addEventListener('click', e => { if (e.target === host) host.classList.remove('active'); });

  // save handler
  const saveBtn = NC.$(id + '_save');
  if (saveBtn && typeof opts.onSave === 'function') {
    saveBtn.onclick = async function () {
      const data = {};
      for (const f of fields) {
        const el = NC.$('ncMF_' + f.id);
        if (!el) continue;
        let v = el.value;
        if (f.type === 'number') v = NC.N(v);
        if (f.required && !v) { NC.toast('Required: ' + f.label, 'error'); return; }
        data[f.id] = v;
      }
      try {
        saveBtn.disabled = true;
        const original = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving…';
        await opts.onSave(data, host);
        host.classList.remove('active');
        saveBtn.disabled = false;
        saveBtn.innerHTML = original;
      } catch (e) {
        console.error('[NC.modal] save error', e);
        NC.toast('Error: ' + e.message, 'error');
        saveBtn.disabled = false;
      }
    };
  }

  host.classList.add('active');
  // focus first input
  setTimeout(() => {
    const first = host.querySelector('input, select, textarea');
    if (first) first.focus();
  }, 100);
  return host;
};

NC.closeModal = function (id) {
  const el = NC.$(id);
  if (el) el.classList.remove('active');
};

/* ══════════════════════════════════════════════════════════
   6 · CONFIRM (promise-based)
   ══════════════════════════════════════════════════════════ */
NC.confirm = function (msg, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    const id = 'ncConfirm_' + Date.now().toString(36);
    const host = document.createElement('div');
    host.id = id;
    host.className = 'modal-overlay';
    host.style.zIndex = 2200;
    host.innerHTML =
      '<div class="modal" style="max-width:440px">' +
        '<div class="modal-header"><h2 class="modal-title">' + NC.E(opts.title || 'Confirm') + '</h2></div>' +
        '<div class="modal-body"><div style="white-space:pre-wrap;line-height:1.6">' + NC.E(msg) + '</div></div>' +
        '<div class="modal-footer">' +
          '<button class="btn btn-secondary" data-no="1">' + NC.E(opts.cancelLabel || 'Cancel') + '</button>' +
          '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-yes="1">' + NC.E(opts.confirmLabel || 'Confirm') + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(host);
    const done = v => { host.remove(); resolve(v); };
    host.querySelector('[data-no]').onclick = () => done(false);
    host.querySelector('[data-yes]').onclick = () => done(true);
    host.addEventListener('click', e => { if (e.target === host) done(false); });
    host.classList.add('active');
  });
};

/* ══════════════════════════════════════════════════════════
   7 · EVENT BUS
   ══════════════════════════════════════════════════════════ */
NC.on = function (evt, fn) {
  if (!NC._events[evt]) NC._events[evt] = [];
  if (NC._events[evt].indexOf(fn) === -1) NC._events[evt].push(fn);
};
NC.off = function (evt, fn) {
  if (!NC._events[evt]) return;
  NC._events[evt] = NC._events[evt].filter(f => f !== fn);
};
NC.emit = function (evt, data) {
  const list = (NC._events[evt] || []).slice();
  list.forEach(fn => { try { fn(data); } catch (e) { console.error('[NC.emit] ' + evt, e); } });
};

/* ══════════════════════════════════════════════════════════
   8 · DATA CACHE LAYER
   ══════════════════════════════════════════════════════════ */
NC.load = async function (col, opts) {
  opts = opts || {};
  const fresh = opts.fresh === true;
  if (!fresh && NC.data[col] && !opts.force) return NC.data[col];
  try {
    let q = db.collection(col);
    if (opts.orderBy) q = q.orderBy(opts.orderBy.field, opts.orderBy.dir || 'desc');
    if (opts.limit)   q = q.limit(opts.limit);
    if (opts.where)   opts.where.forEach(w => { q = q.where(w[0], w[1], w[2]); });
    const snap = await q.get();
    const list = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    NC.data[col] = list;
    NC.emit('data:loaded', { col, list });
    return list;
  } catch (e) {
    console.error('[NC.load] ' + col, e);
    NC.data[col] = [];
    return [];
  }
};
NC.invalidate = function (col) {
  if (col) delete NC.data[col];
  else NC.data = {};
  NC.emit('data:invalidated', { col });
};
NC.save = async function (col, doc) {
  const id = doc.id;
  const payload = Object.assign({}, doc);
  delete payload.id;
  if (!id) {
    payload.createdAt = NC.ts();
    payload.createdBy = NC.state.user ? NC.state.user.email : 'system';
  }
  payload.updatedAt = NC.ts();
  if (id) { await db.collection(col).doc(id).set(payload, { merge: true }); }
  else    { const ref = await db.collection(col).add(payload); doc.id = ref.id; }
  NC.invalidate(col);
  return doc.id;
};
NC.remove = async function (col, id) {
  await db.collection(col).doc(id).delete();
  NC.invalidate(col);
};

/* ══════════════════════════════════════════════════════════
   9 · VIEW REGISTRY + MODULE REGISTRY
   ══════════════════════════════════════════════════════════ */
NC.registerView = function (id, cfg) {
  if (NC.views[id]) return NC.views[id];
  NC.views[id] = Object.assign({ id, tab: cfg.tab || 'cheques' }, cfg);
  return NC.views[id];
};

NC.registerModule = function (name, cfg) {
  if (NC.modules[name]) return;
  NC.modules[name] = cfg;
  // register views
  if (cfg.views) {
    Object.keys(cfg.views).forEach(vid => NC.registerView(vid, cfg.views[vid]));
  }
  // if user already logged in, init now
  if (NC.state.user && typeof cfg.init === 'function' && !cfg.__inited) {
    try { cfg.init(); cfg.__inited = true; }
    catch (e) { console.error('[NC] init failed: ' + name, e); }
  }
  NC._rebuildNav();
  NC.emit('module:registered', { name });
};

/* ══════════════════════════════════════════════════════════
   10 · TAB BAR + NAV PANES
   ══════════════════════════════════════════════════════════ */
const TABS = [
  { id: 'cheques',  label: 'Cheques',  icon: 'money-check-alt', color: '#6366f1' },
  { id: 'finance',  label: 'Finance',  icon: 'chart-line',      color: '#0ea5e9' },
  { id: 'payments', label: 'Payments', icon: 'exchange-alt',    color: '#10b981' }
];

NC._buildTabBar = function () {
  const host = NC.$('ncNavTabs');
  if (!host) return;
  host.innerHTML = TABS.map(t =>
    '<button class="nc-nav-tab" data-tab="' + t.id + '" style="color:' + t.color + '">' +
      '<i class="fas fa-' + t.icon + '" style="font-size:15px"></i>' +
      '<span>' + t.label + '</span>' +
    '</button>'
  ).join('');
  host.querySelectorAll('.nc-nav-tab').forEach(btn => {
    btn.onclick = () => NC.showTab(btn.dataset.tab);
  });
};

NC._ensureNavPane = function (tabId) {
  const panes = NC.$('ncNavPanes');
  if (!panes) return null;
  let pane = NC.$('ncNavPane_' + tabId);
  if (pane) return pane;
  const meta = TABS.find(t => t.id === tabId) || TABS[0];
  pane = document.createElement('div');
  pane.id = 'ncNavPane_' + tabId;
  pane.className = 'nc-nav-pane';
  pane.dataset.tab = tabId;
  pane.innerHTML = '<div class="nc-nav-title" style="display:flex;align-items:center;gap:6px">' +
    '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + meta.color + '"></span>' +
    meta.label + '</div>' +
    '<div class="nc-nav-items"></div>';
  panes.appendChild(pane);
  return pane;
};

NC._rebuildNav = function () {
  // Ensure 3 panes exist
  TABS.forEach(t => NC._ensureNavPane(t.id));

  // Clear items lists
  TABS.forEach(t => {
    const list = NC.$('ncNavPane_' + t.id).querySelector('.nc-nav-items');
    list.innerHTML = '';
  });

  // Sort views by tab, then order
  const views = Object.values(NC.views).filter(v => v.showInNav !== false);
  views.sort((a, b) => (a.order || 999) - (b.order || 999));

  views.forEach(v => {
    const pane = NC.$('ncNavPane_' + v.tab);
    if (!pane) return;
    const list = pane.querySelector('.nc-nav-items');
    const el = document.createElement('div');
    el.className = 'nc-nav-item';
    el.dataset.view = v.id;
    el.innerHTML = '<i class="fas fa-' + (v.icon || 'circle') + '"></i><span>' + NC.E(v.title) + '</span>';
    el.onclick = () => NC.navigate(v.id);
    list.appendChild(el);
  });
};

NC.showTab = function (tabId) {
  document.querySelectorAll('.nc-nav-tab').forEach(b => {
    const active = b.dataset.tab === tabId;
    b.classList.toggle('active', active);
    if (active) b.style.background = 'white';
    else b.style.background = 'transparent';
  });
  document.querySelectorAll('.nc-nav-pane').forEach(p => {
    p.classList.toggle('active', p.dataset.tab === tabId);
  });
  try { localStorage.setItem('ncActiveTab', tabId); } catch (e) {}
  NC.state.activeTab = tabId;
};

/* ══════════════════════════════════════════════════════════
   11 · ROUTER — NC.navigate(viewId)
   ══════════════════════════════════════════════════════════ */
NC.navigate = function (viewId) {
  const v = NC.views[viewId];
  if (!v) {
    console.warn('[NC.navigate] Unknown view: ' + viewId);
    return;
  }

  // Switch tab if needed
  if (v.tab && v.tab !== NC.state.activeTab) NC.showTab(v.tab);

  // Highlight nav item
  document.querySelectorAll('.nc-nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.view === viewId);
  });

  // Hide all views, show target
  document.querySelectorAll('.nc-view').forEach(el => el.classList.remove('active'));

  // Ensure view element exists in main content
  const main = NC.$('ncMainContent');
  if (!main) return;
  let el = NC.$(viewId);
  if (!el) {
    el = document.createElement('div');
    el.id = viewId;
    el.className = 'nc-view';
    el.innerHTML = '<div class="empty-state"><i class="fas fa-circle-notch" style="animation:rotate 1.2s linear infinite;color:var(--primary)"></i><h3>Loading…</h3></div>';
    main.appendChild(el);
  }
  el.classList.add('active');

  // Update page title
  const title = NC.$('ncPageTitle');
  if (title) title.textContent = v.title || 'View';

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    NC.$('ncSidebar').classList.remove('active');
    NC.$('ncSidebarOverlay').classList.remove('active');
  }

  // Render
  if (typeof v.render === 'function') {
    try {
      const r = v.render(el, NC.state);
      if (r && r.then) r.catch(e => {
        console.error('[NC.navigate] render async failed ' + viewId, e);
        el.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Render error</h3><p>' + NC.E(e.message) + '</p></div></div>';
      });
    } catch (e) {
      console.error('[NC.navigate] render failed ' + viewId, e);
      el.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Render error</h3><p>' + NC.E(e.message) + '</p></div></div>';
    }
  }

  try { localStorage.setItem('ncActiveView', viewId); } catch (e) {}
  NC.state.activeView = viewId;
  NC.emit('route:changed', { viewId, meta: v });
};

/* ══════════════════════════════════════════════════════════
   12 · SIDEBAR TOGGLE + AUTH
   ══════════════════════════════════════════════════════════ */
NC.toggleSidebar = function () {
  NC.$('ncSidebar').classList.toggle('active');
  NC.$('ncSidebarOverlay').classList.toggle('active');
};

NC.showSignup = function () {
  NC.$('ncLoginScreen').classList.add('hidden');
  NC.$('ncSignupScreen').classList.remove('hidden');
};
NC.showLogin = function () {
  NC.$('ncSignupScreen').classList.add('hidden');
  NC.$('ncLoginScreen').classList.remove('hidden');
};

NC.signInWithGoogle = function () {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => NC.toast('Google sign-in failed: ' + e.message, 'error'));
};

NC.logout = function () {
  auth.signOut();
  NC.invalidate();
  NC.state.user = null;
};

/* ══════════════════════════════════════════════════════════
   13 · BOOT — AUTH + SIDEBAR + MODULE INIT
   ══════════════════════════════════════════════════════════ */
NC._initAuth = function () {
  // Login form
  NC.$('ncLoginForm').addEventListener('submit', e => {
    e.preventDefault();
    auth.signInWithEmailAndPassword(
      NC.$('ncLoginEmail').value,
      NC.$('ncLoginPassword').value
    ).catch(err => NC.toast('Login failed: ' + err.message, 'error'));
  });

  // Signup form
  NC.$('ncSignupForm').addEventListener('submit', e => {
    e.preventDefault();
    auth.createUserWithEmailAndPassword(
      NC.$('ncSignupEmail').value,
      NC.$('ncSignupPassword').value
    ).then(cred => cred.user.updateProfile({ displayName: NC.$('ncSignupName').value }))
     .catch(err => NC.toast('Signup failed: ' + err.message, 'error'));
  });

  // Auth state
  auth.onAuthStateChanged(user => {
    if (user) {
      NC.state.user = user;
      NC.$('ncUserName').textContent = user.displayName || user.email.split('@')[0];
      NC.$('ncUserAvatar').textContent = (user.displayName || user.email).charAt(0).toUpperCase();
      NC.$('ncLoginScreen').classList.add('hidden');
      NC.$('ncSignupScreen').classList.add('hidden');
      NC.$('ncApp').classList.add('active');

      // Init all registered modules
      Object.keys(NC.modules).forEach(name => {
        const m = NC.modules[name];
        if (typeof m.init === 'function' && !m.__inited) {
          try { m.init(); m.__inited = true; }
          catch (e) { console.error('[NC] init failed: ' + name, e); }
        }
      });

      NC.emit('auth:ready', { user });
      NC.toast('Welcome back!', 'success');

      // Restore last tab + view
      let tab = 'cheques', viewId = null;
      try {
        tab = localStorage.getItem('ncActiveTab') || 'cheques';
        viewId = localStorage.getItem('ncActiveView');
      } catch (e) {}

      NC.showTab(tab);
      // Navigate to saved view if it exists and belongs to that tab
      if (viewId && NC.views[viewId] && NC.views[viewId].tab === tab) {
        setTimeout(() => NC.navigate(viewId), 100);
      } else {
        // Navigate to first view of tab
        const first = Object.values(NC.views).find(v => v.tab === tab && v.showInNav !== false);
        if (first) setTimeout(() => NC.navigate(first.id), 100);
      }
    } else {
      NC.state.user = null;
      NC.$('ncApp').classList.remove('active');
      NC.$('ncLoginScreen').classList.remove('hidden');
    }
  });
};

NC.boot = function () {
  NC._buildTabBar();
  NC._initAuth();
  console.log('%c[NeonCheque Core v6.0] ✅ Ready — register modules with NC.registerModule()', 'color:#10b981;font-weight:bold');
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', NC.boot);
} else {
  NC.boot();
}
})();
</script>
<!-- ══════════════════════════════════════════════════════
     PART 2 — CHEQUE CORE (all cheque features + categories)
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modCheques) return;
window.__modCheques = true;

/* ══════════════════════════════════════════════════════
   LOCAL STATE
   ══════════════════════════════════════════════════════ */
const S = {
  sel: new Set(),            // all-cheques selections
  inHandSel: new Set(),      // in-hand selections
  filtered: [],              // currently filtered cheques
  bulkCtx: 'all',
  catFilter: 'ALL',
  sortBy: 'chequeDate-desc',
  payeeSort: 'total-desc',
  issuerSort: 'total-desc'
};

const STATUS_FIELDS = {
  'in-hand': [
    {id:'receivedDate',label:'Received Date',type:'date',required:true},
    {id:'receivedFrom',label:'Received From',type:'text',required:true}
  ],
  'issued': [
    {id:'issuedDate',label:'Issue Date',type:'date',required:true},
    {id:'issuedTo',label:'Issued To',type:'text',required:true},
    {id:'deliveryMode',label:'Delivery Mode',type:'select',options:['Hand Delivered','Courier','Registered Post','Email/Scan'],required:true},
    {id:'trackingNo',label:'Tracking No.',type:'text',required:false}
  ],
  'deposited': [
    {id:'depositDate',label:'Deposit Date',type:'date',required:true},
    {id:'depositBranch',label:'Bank Branch',type:'text',required:true},
    {id:'slipNumber',label:'Slip/Challan No.',type:'text',required:true}
  ],
  'cleared': [
    {id:'clearDate',label:'Clearance Date',type:'date',required:true},
    {id:'utrNumber',label:'UTR/Reference No.',type:'text',required:true},
    {id:'clearedAmount',label:'Cleared Amount',type:'number',required:false}
  ],
  'returned': [
    {id:'returnDate',label:'Return Date',type:'date',required:true},
    {id:'returnReason',label:'Bank Reason Code',type:'select',options:['Insufficient Funds (NSF)','Signature Mismatch','Account Closed','Stop Payment','Stale Dated','Other'],required:true},
    {id:'bankCharges',label:'Bank Charges (Rs.)',type:'number',required:false}
  ],
  'stopped': [
    {id:'stopDate',label:'Stop Date',type:'date',required:true},
    {id:'stopReason',label:'Reason',type:'select',options:['Lost','Stolen','Dispute','Duplicate','Other'],required:true},
    {id:'complaintRef',label:'FIR Reference',type:'text',required:false}
  ]
};

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
const allCheques  = () => NC.state.allCheques || [];
const categories  = () => NC.state.categories || [];
const activeCheques = () => allCheques().filter(c => !c.deletedAt);
const findCheque = id => allCheques().find(c => c.id === id);
const catColor = name => (categories().find(c => c.name === name) || {}).color || '#6366f1';

function chequeBalance(c) {
  const paid = (c.payments || []).reduce((s, p) => s + N(p.amount), 0);
  return Math.max(0, N(c.amount) - paid);
}
function chequeTotalPaid(c) {
  return (c.payments || []).reduce((s, p) => s + N(p.amount), 0);
}
function paymentBadge(c) {
  if (c.status !== 'returned') return '';
  const paid = chequeTotalPaid(c);
  const total = N(c.amount);
  if (total <= 0) return '';
  const pct = (paid / total) * 100;
  if (pct >= 100) return '<span class="payment-badge paid" style="background:#d1fae5;color:#065f46;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;margin-left:4px">Fully Paid</span>';
  if (pct > 0)   return '<span class="payment-badge partial" style="background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;margin-left:4px">' + pct.toFixed(0) + '%</span>';
  return '<span class="payment-badge unpaid" style="background:#fee2e2;color:#b91c1c;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;margin-left:4px">Unpaid</span>';
}
function catBadge(name) {
  if (!name) return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#f1f5f9;color:#94a3b8">UNCAT</span>';
  const c = catColor(name);
  return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:' + c + '22;color:' + c + '">' + E(name) + '</span>';
}

function sortCheques(list, sortBy) {
  const arr = list.slice();
  const [field, dir] = sortBy.split('-');
  arr.sort((a, b) => {
    let va, vb;
    if (field === 'chequeDate')      { va = new Date(a.date || 0);          vb = new Date(b.date || 0); }
    else if (field === 'createdAt')  {
      va = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)) : new Date(0);
      vb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)) : new Date(0);
    }
    else if (field === 'amount')     { va = N(a.amount);                    vb = N(b.amount); }
    else if (field === 'number')     { va = String(a.number || '');         vb = String(b.number || ''); }
    else if (field === 'payee')      { va = String(a.payee || '').toLowerCase(); vb = String(b.payee || '').toLowerCase(); }
    else                             { va = 0; vb = 0; }
    return dir === 'asc' ? (va > vb ? 1 : va < vb ? -1 : 0) : (va < vb ? 1 : va > vb ? -1 : 0);
  });
  return arr;
}

/* ══════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════ */
async function reloadCheques() {
  const list = await NC.load('cheques', { orderBy: { field:'createdAt', dir:'desc' }, fresh:true });
  NC.state.allCheques = list;
  await autoClearFullyPaid();
  NC.emit('cheques:changed', { count: list.length });
  // Refresh current view
  if (NC.state.activeView && NC.views[NC.state.activeView]) {
    const v = NC.views[NC.state.activeView];
    if (v.tab === 'cheques' && typeof v.render === 'function') {
      const el = $(NC.state.activeView);
      if (el) try { v.render(el); } catch(e){ console.error(e); }
    }
  }
}

async function reloadCategories() {
  const list = await NC.load('chequeCategories', { fresh:true });
  NC.state.categories = list;
  NC.emit('categories:changed', { count: list.length });
}

async function autoClearFullyPaid() {
  const candidates = allCheques().filter(c => c.status === 'returned' && !c.deletedAt);
  let changed = 0;
  for (const c of candidates) {
    const total = N(c.amount);
    const paid  = chequeTotalPaid(c);
    if (total > 0 && total - paid <= 0.01) {
      try {
        await db.collection('cheques').doc(c.id).update({
          status:'cleared',
          paymentStatus:'fully-paid',
          clearedAmount: total,
          clearDate: c.clearDate || T(),
          history: NC.au({
            action:'Auto-Cleared (Full Payment Detected)',
            details:'Cheque #' + c.number + ' fully paid. Auto RETURNED → CLEARED.',
            timestamp: NC.nowISO(),
            user:'system'
          }),
          updatedAt: NC.ts()
        });
        c.status = 'cleared';
        c.paymentStatus = 'fully-paid';
        changed++;
      } catch (e) { console.warn('[auto-clear] failed', c.id, e); }
    }
  }
  if (changed > 0) {
    NC.toast('Auto-cleared ' + changed + ' fully paid cheque(s)', 'success');
    NC.invalidate('cheques');
    NC.state.allCheques = await NC.load('cheques', { orderBy:{field:'createdAt',dir:'desc'}, fresh:true });
  }
  return changed;
}

function renderDashboard(el) {
  const active = activeCheques();

  const returned = active.filter(c => c.status === 'returned');
  const totalValue = active.reduce((s,c) => s + N(c.amount), 0);
  const inHandValue = active.filter(c => c.status === 'in-hand').reduce((s,c) => s + N(c.amount), 0);
  const returnedValue = returned.reduce((s,c) => s + N(c.amount), 0);
  const recovered = returned.reduce((s,c) => s + chequeTotalPaid(c), 0);
  const recoveryRate = returnedValue > 0 ? (recovered / returnedValue * 100).toFixed(1) : '0.0';
  const outstanding = returnedValue - recovered;

  // Category stats
  const catStats = {};
  active.forEach(c => {
    const k = c.category || '(Uncategorized)';
    if (!catStats[k]) catStats[k] = { count:0, total:0 };
    catStats[k].count++;
    catStats[k].total += N(c.amount);

    widget('In Hand', inHand, 'hand-holding', 'success', F(inHandValue)) +
    widget('Returned', returned.length, 'undo', 'danger', F(outstanding) + ' outstanding') +

      (topCats.length === 0
        ? '<div class="empty-state" style="grid-column:1/-1;padding:24px"><i class="fas fa-tags"></i><p>No categories yet</p></div>'
        : topCats.map(([name, stat]) => {

  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title">Recent Activity</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="CHEQ.openAdd()"><i class="fas fa-plus"></i> Add Cheque</button>' +
    '</div>' +
    (recent.length === 0

  function widget(title, value, icon, colorClass, sub) {
    return '<div class="widget"><div class="widget-header"><div>' +

    html += chip(cat.name, cat.name, cat.color || '#6366f1', n);

function refreshTable() {
  const tbody = $('chqTableBody');
  const empty = $('chqEmpty');
  const bulkBar = $('chqBulkBar');
  if (!tbody) return;

  let list = activeCheques();

  // Category filter
  if (S.catFilter === 'UNC')        list = list.filter(c => !c.category);
  else if (S.catFilter !== 'ALL')   list = list.filter(c => c.category === S.catFilter);

  // Search filters
  const bulkNums = ($('chqBulkNums') || {}).value || '';
  const payeeQ   = (($('chqPayeeFilter') || {}).value || '').toLowerCase();
  const statusQ  = ($('chqFilterStatus') || {}).value || '';
  const bankQ    = ($('chqFilterBank') || {}).value || '';
  const issuedQ  = (($('chqFilterIssuedTo') || {}).value || '').toLowerCase();
  const delivQ   = ($('chqFilterDeliveryMode') || {}).value || '';
  const fromQ    = ($('chqFilterFrom') || {}).value || '';
  const toQ      = ($('chqFilterTo') || {}).value || '';
  const minQ     = N(($('chqFilterMin') || {}).value);
  const maxQ     = N(($('chqFilterMax') || {}).value);

  if (bulkNums) {
    const nums = bulkNums.split(/[\n,]+/).map(n => n.trim()).filter(Boolean);
    if (nums.length) list = list.filter(c => nums.includes(String(c.number)));
  }
  if (payeeQ)  list = list.filter(c => String(c.payee || '').toLowerCase().includes(payeeQ));
  if (statusQ) list = list.filter(c => c.status === statusQ);
  if (bankQ)   list = list.filter(c => c.bank === bankQ);
  if (issuedQ) list = list.filter(c => String(c.issuedTo || '').toLowerCase().includes(issuedQ));
  if (delivQ)  list = list.filter(c => c.deliveryMode === delivQ);
  if (fromQ)   list = list.filter(c => c.date >= fromQ);
  if (toQ)     list = list.filter(c => c.date <= toQ);
  if (minQ)    list = list.filter(c => N(c.amount) >= minQ);
  if (maxQ)    list = list.filter(c => N(c.amount) <= maxQ);

  list = sortCheques(list, S.sortBy);
  S.filtered = list;

  if (!list.length) {
    tbody.innerHTML = '';
    if (empty) empty.classList.remove('hidden');
    if (bulkBar) bulkBar.style.display = 'none';
    return;
  }
  if (empty) empty.classList.add('hidden');
  if (bulkBar) bulkBar.style.display = S.sel.size ? 'flex' : 'none';

  tbody.innerHTML = list.map(c => {
    const isSel = S.sel.has(c.id);
    const paymentInfo = c.status === 'returned' ? returnedPayBar(c) : '—';
    return '<tr>' +
      '<td><input type="checkbox" class="chq-cb" data-id="' + c.id + '"' + (isSel?' checked':'') + ' onchange="CHEQ.toggleSel(\'' + c.id + '\',this.checked)"></td>' +
      '<td><strong>' + E(c.number) + '</strong></td>' +
      '<td>' + E(c.payee) + '</td>' +
      '<td>' + catBadge(c.category) + '</td>' +
      '<td>' + E(c.issuedTo || '-') + '</td>' +
      '<td style="font-weight:700">' + F(c.amount) + '</td>' +
      '<td>' + E(c.bank) + '</td>' +
      '<td>' + dfmt(c.date) + '</td>' +
      '<td><span class="status-badge status-' + c.status + '">' + c.status + '</span>' + paymentBadge(c) + '</td>' +
      '<td>' + paymentInfo + '</td>' +
      '<td><button class="btn btn-xs btn-secondary" onclick="CHEQ.openRowMenu(event,\'' + c.id + '\')" title="Actions"><i class="fas fa-ellipsis-v"></i></button></td>' +
    '</tr>';
  }).join('');

  updateBulkBar();
}

function returnedPayBar(c) {
  const paid = chequeTotalPaid(c);

  const pct = total > 0 ? Math.min((paid/total)*100, 100) : 0;
  return '<div style="min-width:100px">' +

    '</div></div>';

function refreshInHand() {
  const tbody = $('inHandTbody');
  const empty = $('inHandEmpty');
  const bar = $('inHandBulkBar');
  if (!tbody) return;

  let list = activeCheques().filter(c => c.status === 'in-hand');
  const numQ   = (($('inHandNum') || {}).value || '').toLowerCase();
  const payeeQ = (($('inHandPayee') || {}).value || '').toLowerCase();
  const bankQ  = ($('inHandBank') || {}).value || '';
  const sortQ  = ($('inHandSort') || {}).value || 'chequeDate-desc';

  if (numQ)   list = list.filter(c => String(c.number).toLowerCase().includes(numQ));
  if (payeeQ) list = list.filter(c => String(c.payee).toLowerCase().includes(payeeQ));
  if (bankQ)  list = list.filter(c => c.bank === bankQ);
  list = sortCheques(list, sortQ);

  if (!list.length) {
    tbody.innerHTML = '';
    if (empty) empty.classList.remove('hidden');
    if (bar) bar.style.display = 'none';
    return;
  }
  if (empty) empty.classList.add('hidden');
  if (bar) bar.style.display = S.inHandSel.size ? 'flex' : 'none';

  tbody.innerHTML = list.map(c => {
    const isSel = S.inHandSel.has(c.id);
    return '<tr>' +
      '<td><input type="checkbox" class="inhand-cb" data-id="' + c.id + '"' + (isSel?' checked':'') + ' onchange="CHEQ.toggleInHandSel(\'' + c.id + '\',this.checked)"></td>' +
      '<td><strong>' + E(c.number) + '</strong></td>' +
      '<td>' + E(c.payee) + '</td>' +
      '<td>' + catBadge(c.category) + '</td>' +
      '<td style="font-weight:700">' + F(c.amount) + '</td>' +
      '<td>' + E(c.bank) + '</td>' +
      '<td>' + dfmt(c.date) + '</td>' +
      '<td><button class="btn btn-xs btn-primary" onclick="CHEQ.openStatus(\'' + c.id + '\')"><i class="fas fa-paper-plane"></i> Issue</button></td>' +
    '</tr>';
  }).join('');

  const cnt = $('inHandSelCount');
  if (cnt) cnt.textContent = S.inHandSel.size + ' selected';
}

  '</div>';

function refreshPayees() {
  const tbody = $('payeeTbody');
  const empty = $('payeeEmpty');
  if (!tbody) return;

  const q = (($('payeeSearch') || {}).value || '').toLowerCase();
  const sortBy = ($('payeeSort') || {}).value || 'total-desc';

  const map = {};
  activeCheques().forEach(c => {
    const k = String(c.payee || '').toLowerCase();
    if (!k) return;
    if (!map[k]) map[k] = { name:c.payee, count:0, total:0, paid:0, pending:0, cleared:0, returned:0 };
    const m = map[k];
    const amt = N(c.amount);
    m.count++;
    m.total += amt;
    m.paid  += chequeTotalPaid(c);
    if (c.status === 'cleared')  m.cleared  += amt;
    if (c.status === 'returned') m.returned += amt;
    if (c.status !== 'cleared' && c.status !== 'stopped') m.pending += amt;
  });

  let arr = Object.values(map);
  if (q) arr = arr.filter(p => p.name.toLowerCase().includes(q));
  const [field, dir] = sortBy.split('-');
  arr.sort((a,b) => {
    let va, vb;
    if (field === 'total')      { va = a.total; vb = b.total; }
    else if (field === 'count') { va = a.count; vb = b.count; }
    else                        { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    return dir === 'asc' ? (va > vb ? 1 : va < vb ? -1 : 0) : (va < vb ? 1 : va > vb ? -1 : 0);
  });

  if (!arr.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  tbody.innerHTML = arr.map(p =>
    '<tr>' +
      '<td><strong>' + E(p.name) + '</strong></td>' +
      '<td>' + p.count + '</td>' +
      '<td>' + F(p.total) + '</td>' +
      '<td style="color:var(--success)">' + F(p.paid) + '</td>' +
      '<td style="color:var(--warning)">' + F(p.pending) + '</td>' +
      '<td>' + F(p.cleared) + '</td>' +
      '<td style="color:var(--danger)">' + F(p.returned) + '</td>' +
      '<td><button class="btn btn-xs btn-primary" onclick="CHEQ.partyDetails(\'' + E(p.name).replace(/'/g,"\\'") + '\',\'payee\')"><i class="fas fa-eye"></i> View</button></td>' +
    '</tr>'
  ).join('');
}

/* ══════════════════════════════════════════════════════
   VIEW 9 — TIMELINE
   ══════════════════════════════════════════════════════ */
function renderTimelineView(el) {
  const events = [];
  activeCheques().forEach(c => {
    if (c.createdAt) {
      const dt = c.createdAt.toDate ? c.createdAt.toDate() : new Date(c.createdAt);
      events.push({ date:dt, icon:'plus-circle', color:'#10b981',
        title:'Cheque #' + c.number + ' Created',
        desc:'For ' + c.payee + ' — ' + F(c.amount),
        cheque:c });
    }
    (c.history || []).forEach(h => {
      const dt = h.timestamp ? new Date(h.timestamp) : new Date();
      let icon = 'history', color = '#6366f1';
      if (/creat/i.test(h.action))   { icon='plus-circle'; color='#10b981'; }
      else if (/updat/i.test(h.action))  { icon='edit'; color='#3b82f6'; }
      else if (/issu/i.test(h.action))   { icon='paper-plane'; color='#f59e0b'; }
      else if (/depos/i.test(h.action))  { icon='university'; color='#3b82f6'; }
      else if (/clear/i.test(h.action))  { icon='check-circle'; color='#10b981'; }
      else if (/return/i.test(h.action)) { icon='undo'; color='#ef4444'; }
      else if (/stop/i.test(h.action))   { icon='ban'; color='#ef4444'; }
      else if (/pay/i.test(h.action))    { icon='money-bill-wave'; color='#10b981'; }
      events.push({ date:dt, icon, color,
        title:h.action + ' — Cheque #' + c.number,
        desc:h.details || '',
        user:h.user || 'System',
        cheque:c });
    });
  });

  events.sort((a,b) => b.date - a.date);

  if (!events.length) {
    el.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-stream"></i><h3>No timeline data</h3></div></div>';
    return;
  }

  const html = events.slice(0, 200).map(ev =>
    '<div style="position:relative;padding-left:36px;margin-bottom:20px;padding-bottom:16px;border-left:2px solid var(--border)">' +
      '<div style="position:absolute;left:-9px;top:0;width:16px;height:16px;border-radius:50%;background:' + ev.color + ';border:3px solid white;box-shadow:0 0 0 2px ' + ev.color + '"></div>' +
      '<div style="background:white;padding:14px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-left:3px solid ' + ev.color + '">' +
        '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px">' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<i class="fas fa-' + ev.icon + '" style="color:' + ev.color + '"></i>' +
            '<strong style="font-size:13px">' + E(ev.title) + '</strong>' +
          '</div>' +
          '<span style="font-size:11px;color:var(--gray)">' + ev.date.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) + '</span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--gray)">' + E(ev.desc) + '</div>' +

/* ══════════════════════════════════════════════════════
   VIEW 10 — AGING
   ══════════════════════════════════════════════════════ */
function renderAgingView(el) {
  const today = new Date(); today.setHours(0,0,0,0);
  const inHand = activeCheques().filter(c => c.status === 'in-hand');
  const buckets = { current:{n:0,amt:0,list:[]}, d30:{n:0,amt:0,list:[]}, d60:{n:0,amt:0,list:[]}, d90:{n:0,amt:0,list:[]} };

  inHand.forEach(c => {
    const cd = new Date(c.date); cd.setHours(0,0,0,0);
    const days = Math.floor((cd - today) / 86400000);
    let key;
    if (days <= 30)      key = 'current';
    else if (days <= 60) key = 'd30';
    else if (days <= 90) key = 'd60';
    else                 key = 'd90';
    buckets[key].n++;
    buckets[key].amt += N(c.amount);
    buckets[key].list.push(Object.assign({}, c, { __days: days }));
  });

  const cards = [
    { key:'current', label:'Current (0-30)', color:'var(--success)' },
    { key:'d30',     label:'31-60 Days',     color:'var(--warning)' },
    { key:'d60',     label:'61-90 Days',     color:'var(--danger)' },
    { key:'d90',     label:'90+ Days',       color:'#7c3aed' }
  ].map(b =>
    '<div style="background:white;border-radius:14px;padding:20px;border-top:4px solid ' + b.color + '">' +
      '<div style="font-size:13px;color:var(--gray);font-weight:600;margin-bottom:8px">' + b.label + '</div>' +
      '<div style="font-size:26px;font-weight:800">' + F(buckets[b.key].amt) + '</div>' +
      '<div style="font-size:12px;color:var(--gray);margin-top:4px">' + buckets[b.key].n + ' cheque(s)</div>' +
    '</div>'
  ).join('');

  const all = [...buckets.current.list, ...buckets.d30.list, ...buckets.d60.list, ...buckets.d90.list];

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-clock" style="color:var(--info);margin-right:8px"></i>In-Hand Cheques Aging</h2>' +
      '<button class="btn btn-secondary btn-sm" onclick="NC.navigate(\'aging\')"><i class="fas fa-sync"></i> Refresh</button>' +
    '</div>' +
    '<div style="background:linear-gradient(135deg,var(--info),#2563eb);color:white;padding:14px 18px;border-radius:12px;margin-bottom:20px;font-size:13px">' +
      '<i class="fas fa-info-circle"></i> Tracks only <strong>In-Hand</strong> cheques. Days = Today → Cheque Date.' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:22px">' + cards + '</div>' +
    (all.length === 0
      ? '<div class="empty-state"><i class="fas fa-hand-holding"></i><h3>No in-hand cheques</h3></div>'
      : '<div class="table-container"><table><thead><tr><th>#</th><th>Payee</th><th>Amount</th><th>Bank</th><th>Date</th><th>Days</th><th>Bucket</th></tr></thead><tbody>' +
        all.map(c => {
          const days = c.__days;
          let label, color;
          if (days <= 30)      { label = '0-30';   color = '#10b981'; }
          else if (days <= 60) { label = '31-60';  color = '#f59e0b'; }
          else if (days <= 90) { label = '61-90';  color = '#ef4444'; }
          else                 { label = '90+';    color = '#7c3aed'; }
          return '<tr>' +
            '<td><strong>' + E(c.number) + '</strong></td>' +
            '<td>' + E(c.payee) + '</td>' +
            '<td>' + F(c.amount) + '</td>' +
            '<td>' + E(c.bank) + '</td>' +
            '<td>' + dfmt(c.date) + '</td>' +
            '<td><strong style="color:' + color + '">' + days + ' days</strong></td>' +
            '<td><span style="background:' + color + '22;color:' + color + ';padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700">' + label + '</span></td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';
}

/* ══════════════════════════════════════════════════════
   VIEW 11 — ANALYTICS
   ══════════════════════════════════════════════════════ */
function renderAnalyticsView(el) {
  const active = activeCheques();
  const totalValue = active.reduce((s,c) => s + N(c.amount), 0);
  const statuses = {};
  active.forEach(c => { statuses[c.status] = (statuses[c.status] || 0) + 1; });
  const inHandValue = active.filter(c => c.status === 'in-hand').reduce((s,c) => s + N(c.amount), 0);
  const issuedValue = active.filter(c => c.status === 'issued').reduce((s,c) => s + N(c.amount), 0);

  const statusColors = { draft:'#64748b','in-hand':'#3b82f6',issued:'#f59e0b',deposited:'#4338ca',returned:'#ef4444',cleared:'#10b981',stopped:'#991b1b' };

  el.innerHTML =
  '<div class="widgets-grid">' +
    '<div class="widget"><div class="widget-title">Total Value</div><div class="widget-value">' + F(totalValue) + '</div></div>' +
    '<div class="widget"><div class="widget-title">In Hand Value</div><div class="widget-value">' + F(inHandValue) + '</div></div>' +
    '<div class="widget"><div class="widget-title">Issued Value</div><div class="widget-value">' + F(issuedValue) + '</div></div>' +
    '<div class="widget"><div class="widget-title">Avg Cheque</div><div class="widget-value">' + (active.length ? F(totalValue/active.length) : '—') + '</div></div>' +
  '</div>' +
  '<div class="card">' +
    '<div class="card-header"><h2 class="card-title">Status Distribution</h2></div>' +
    (Object.keys(statuses).length === 0
      ? '<div class="empty-state"><i class="fas fa-chart-line"></i><h3>No data</h3></div>'
      : '<div style="display:flex;flex-direction:column;gap:14px">' + Object.keys(statuses).map(st => {
          const count = statuses[st];
          const pct = (count / active.length) * 100;
          const color = statusColors[st] || '#6366f1';
          return '<div>' +
            '<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px">' +
              '<span style="font-weight:600;text-transform:capitalize">' + st.replace('-',' ') + '</span>' +
              '<span style="color:var(--gray)">' + count + '</span>' +
            '</div>' +
            '<div style="background:var(--border);height:8px;border-radius:4px;overflow:hidden">' +
              '<div style="background:' + color + ';height:100%;width:' + pct + '%"></div>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>'
    ) +
  '</div>';
}

    }).join('') + '</tbody></table></div>';

  updateBulkBar();
};

};
CHEQ.toggleInHandSelectAll = function (cb) {

  else S.inHandSel.clear();

};

/* ══════════════════════════════════════════════════════
   STATUS CHANGE MODAL
   ══════════════════════════════════════════════════════ */
CHEQ.openStatus = function (id) {
  const c = findCheque(id); if (!c) return;
  // Build modal with status selector + dynamic fields container
  const host = NC.modal({
    id:'chqStatusModal',
    title:'Change Status — Cheque #' + c.number,
    width:600,
    hideSave:true,
    bodyHTML:
      '<div class="form-group"><label>New Status *</label>' +
        '<select id="chqNewStatus" onchange="CHEQ.renderStatusFields()">' +
          '<option value="">-- Select --</option>' +
          ['in-hand','issued','deposited','cleared','returned','stopped','draft'].map(s => '<option value="' + s + '">' + s.replace('-',' ') + '</option>').join('') +
        '</select></div>' +
      '<div id="chqStatusFields"></div>' +
      '<div class="form-group"><label>Remarks</label><textarea id="chqStatusRemarks" rows="2"></textarea></div>'
  });

  // Replace footer with custom actions
  const footer = host.querySelector('.modal-footer');
  footer.innerHTML =
    '<button class="btn btn-secondary" onclick="NC.closeModal(\'chqStatusModal\')">Cancel</button>' +
    '<button class="btn btn-primary" id="chqStatusSave"><i class="fas fa-check"></i> Confirm</button>';

  $('chqStatusSave').onclick = async () => {
    const newStatus = $('chqNewStatus').value;
    if (!newStatus) { NC.toast('Select a status', 'error'); return; }
    const cfg = STATUS_FIELDS[newStatus] || [];
    const data = {};
    for (const f of cfg) {
      const el = $('chqfld_' + f.id);
      if (!el) continue;
      if (f.required && !el.value) { NC.toast('Required: ' + f.label, 'error'); return; }
      data[f.id] = el.value;
    }
    const remarks = $('chqStatusRemarks').value.trim();
    const update = { status:newStatus, updatedAt: NC.ts() };
    Object.assign(update, data);
    if (newStatus === 'returned') {
      update.returnDetails = { status:'returned', reason:data.returnReason, date:data.returnDate, charges:N(data.bankCharges), notes:remarks };
    }
    update.history = NC.au({
      action: newStatus.charAt(0).toUpperCase() + newStatus.slice(1).replace('-',' '),
      details: 'Changed status to ' + newStatus + '. ' + Object.keys(data).map(k => k + ': ' + data[k]).join(', ') + (remarks ? ' | ' + remarks : ''),
      timestamp: NC.nowISO(),
      user: NC.state.user ? NC.state.user.email : 'system',
      previousStatus: c.status
    });
    try {
      await db.collection('cheques').doc(id).update(update);
      await db.collection('auditLog').add({
        action:'status_change',
        chequeNumber: c.number,
        details: update.history[0].details,
        timestamp: NC.ts(),
        user: NC.state.user ? NC.state.user.email : 'system'
      });
      NC.toast('Status changed to ' + newStatus, 'success');
      NC.closeModal('chqStatusModal');
      S.inHandSel.delete(id);
      await reloadCheques();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  };
};

CHEQ.renderStatusFields = function () {
  const st = $('chqNewStatus').value;
  const host = $('chqStatusFields');
  if (!host) return;
  const cfg = STATUS_FIELDS[st] || [];
  host.innerHTML = cfg.map(f => {
    let input;
    if (f.type === 'select') {
      input = '<select id="chqfld_' + f.id + '"' + (f.required ? ' required' : '') + '>' +
        '<option value="">Select…</option>' +
        f.options.map(o => '<option value="' + E(o) + '">' + E(o) + '</option>').join('') + '</select>';
    } else if (f.type === 'textarea') {
      input = '<textarea id="chqfld_' + f.id + '" rows="2"' + (f.required ? ' required' : '') + '></textarea>';
    } else {
      input = '<input type="' + f.type + '" id="chqfld_' + f.id + '"' + (f.required ? ' required' : '') + '>';
    }
    return '<div class="form-group"><label>' + E(f.label) + (f.required ? ' *' : '') + '</label>' + input + '</div>';
  }).join('');
};

/* ══════════════════════════════════════════════════════
   ROW MENU (dropdown actions)

CHEQ.openRowMenu = function (ev, id) {
  ev.stopPropagation();
  document.querySelectorAll('.cheq-row-menu').forEach(m => m.remove());
  const c = findCheque(id); if (!c) return;
  const menu = document.createElement('div');
  menu.className = 'cheq-row-menu';
  menu.style.cssText = 'position:fixed;background:white;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:210px;z-index:2500;overflow:hidden';
  const rect = ev.target.getBoundingClientRect();
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = Math.max(8, rect.right - 210) + 'px';

  const actions = [
    { icon:'edit', label:'Edit', fn: () => CHEQ.openEdit(id) },
    { icon:'exchange-alt', label:'Change Status', fn: () => CHEQ.openStatus(id) },
    { icon:'tag', label:'Change Category', fn: () => CHEQ.pickCategory(id) },
    { icon:'history', label:'View History', fn: () => CHEQ.viewHistory(id) }
  ];
  if (c.status === 'returned') {
    actions.push({ icon:'money-bill-wave', label:'Add Payment', fn: () => CHEQ.openPayment(id) });
    actions.push({ icon:'receipt', label:'View Payments', fn: () => CHEQ.viewPayments(id) });
  }
  actions.push({ icon:'trash', label:'Delete', color:'var(--danger)', fn: () => CHEQ.deleteCheque(id) });

  menu.innerHTML = actions.map((a, i) =>
    '<div data-i="' + i + '" style="padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px' + (a.color ? ';color:' + a.color : '') + '">' +
      '<i class="fas fa-' + a.icon + '" style="width:16px;text-align:center"></i><span>' + a.label + '</span>' +
    '</div>'
  ).join('');
  document.body.appendChild(menu);

  menu.querySelectorAll('[data-i]').forEach(el => {
    el.onmouseover = () => el.style.background = 'var(--light)';
    el.onmouseout = () => el.style.background = '';
    el.onclick = () => {
      const a = actions[parseInt(el.dataset.i)];
      menu.remove();
      if (a && a.fn) a.fn();
    };
  });

  setTimeout(() => {
    const closer = e => {
      if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', closer); }
    };
    document.addEventListener('click', closer);
  }, 50);
};

/* ══════════════════════════════════════════════════════
   PAYMENTS
   ══════════════════════════════════════════════════════ */
CHEQ.openPayment = function (id) {
  const c = findCheque(id); if (!c) return;
  const total = N(c.amount);
  const paid = chequeTotalPaid(c);
  const rem = total - paid;

  NC.modal({
    id:'chqPayModal',
    title:'Record Payment — Cheque #' + c.number,
    width:560,
    bodyHTML:
      '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:16px;font-size:13px">' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<div><strong>Total:</strong> ' + F(total) + '</div>' +
          '<div><strong>Paid:</strong> <span style="color:var(--success)">' + F(paid) + '</span></div>' +
          '<div style="grid-column:1/-1"><strong>Remaining:</strong> <span style="color:var(--danger);font-weight:700">' + F(rem) + '</span></div>' +
        '</div>' +
      '</div>',
    fields: [
      { id:'amount', label:'Amount (Rs.)', type:'number', required:true, step:'0.01', max:rem, hint:'Max: ' + F(rem) },
      { id:'date',   label:'Payment Date', type:'date',   required:true, value:T() },
      { id:'method', label:'Method',       type:'select', required:true,
        options:[
          {value:'cash', label:'Cash'},
          {value:'bank-transfer', label:'Bank Transfer'},
          {value:'upi', label:'UPI'},
          {value:'cheque', label:'Cheque'},
          {value:'card', label:'Card'},
          {value:'other', label:'Other'}
        ], value:'cash' },
      { id:'reference', label:'Reference', type:'text' },
      { id:'notes',     label:'Notes',     type:'textarea' }
    ],
    onSave: async d => {
      const amt = N(d.amount);
      if (amt <= 0) throw new Error('Amount must be positive');
      if (amt > rem + 0.01) throw new Error('Exceeds remaining ' + F(rem));

      const payment = {
        id: NC.uid('pay'),
        amount: amt,
        date: d.date,
        method: d.method,
        reference: d.reference,
        notes: d.notes,
        timestamp: NC.nowISO(),
        user: NC.state.user ? NC.state.user.email : 'system'
      };
      const newTotalPaid = paid + amt;
      const newRem = total - newTotalPaid;
      const pct = total > 0 ? (newTotalPaid / total) * 100 : 0;

      const entries = [{
        action:'Payment Received',
        details:'Received ' + F(amt) + ' via ' + d.method + '. Remaining: ' + F(newRem) + ' (' + pct.toFixed(1) + '% paid)',
        timestamp: NC.nowISO(),
        user: NC.state.user ? NC.state.user.email : 'system',
        paymentId: payment.id
      }];

      const update = {
        payments: NC.au(payment),
        updatedAt: NC.ts()
      };

      if (newRem <= 0.01) {
        update.paymentStatus = 'fully-paid';
        if (c.status === 'returned') {
          update.status = 'cleared';
          update.clearDate = T();
          update.autoCleared = true;
          entries.push({
            action:'Auto-Cleared',
            details:'Cheque #' + c.number + ' auto-moved to Cleared after full recovery.',
            timestamp: NC.nowISO(),
            user:'system',
            previousStatus:'returned'
          });
        }
        entries.push({
          action:'Fully Recovered',
          details:'Cheque #' + c.number + ' fully recovered. Total: ' + F(total),
          timestamp: NC.nowISO(),
          user: NC.state.user ? NC.state.user.email : 'system'
        });
      } else {
        update.paymentStatus = 'partially-paid';
      }

      update.history = NC.au(entries[0]);
      for (let i = 1; i < entries.length; i++) {
        update.history = NC.au(entries[i]); // will be merged by Firestore
      }
      // Simpler: apply all in one call
      update.history = firebase.firestore.FieldValue.arrayUnion(...entries);

      await db.collection('cheques').doc(id).update(update);
      await db.collection('auditLog').add({
        action:'payment_recorded',
        chequeNumber: c.number,
        details:'Payment of ' + F(amt) + ' recorded via ' + d.method,
        timestamp: NC.ts(),
        user: NC.state.user ? NC.state.user.email : 'system'
      });
      NC.toast('Payment ' + F(amt) + ' recorded', 'success');
      await reloadCheques();
    }
  });
};

CHEQ.deletePayment = async function (chequeId, paymentId) {
  if (!await NC.confirm('Delete this payment?', { danger:true, confirmLabel:'Delete' })) return;
  const c = findCheque(chequeId); if (!c) return;
  const payments = c.payments || [];
  const target = payments.find(p => p.id === paymentId);
  if (!target) return;
  const updated = payments.filter(p => p.id !== paymentId);
  const paid = updated.reduce((s, p) => s + N(p.amount), 0);
  const rem = N(c.amount) - paid;

  const update = {
    payments: updated,
    updatedAt: NC.ts(),
    history: NC.au({
      action:'Payment Deleted',
      details:'Deleted payment of ' + F(target.amount) + ' dated ' + dfmt(target.date),
      timestamp: NC.nowISO(),
      user: NC.state.user ? NC.state.user.email : 'system'
    })
  };
  if (rem <= 0.01 && updated.length > 0) update.paymentStatus = 'fully-paid';
  else if (updated.length > 0)           update.paymentStatus = 'partially-paid';
  else                                    update.paymentStatus = 'unpaid';

  if (c.status === 'cleared' && c.autoCleared && rem > 0.01) {
    update.status = 'returned';
    update.autoCleared = false;
    update.history = NC.au({
      action:'Reverted to Returned',
      details:'Cheque #' + c.number + ' reverted after payment deletion. Outstanding: ' + F(rem),
      timestamp: NC.nowISO(),
      user:'system'
    });
  }

  await db.collection('cheques').doc(chequeId).update(update);
  NC.toast('Payment deleted', 'success');
  NC.closeModal('chqPayHistoryModal');
  await reloadCheques();
};
