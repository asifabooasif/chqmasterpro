function renderBankCategoryWidget() {
  const host = $('bankCatWidget');
  if (!host) return;
  const list = banks();
  if (list.length === 0) { host.innerHTML = ''; return; }

  const byBankCat = {};
  bankTxns().forEach(t => {
    if (!t.bankAccountId) return;
    const cat = t.category || '(Uncategorized)';
    if (!byBankCat[t.bankAccountId]) byBankCat[t.bankAccountId] = {};
    if (!byBankCat[t.bankAccountId][cat]) byBankCat[t.bankAccountId][cat] = 0;
    const delta = t.type === 'credit' ? N(t.amount) : -N(t.amount);
    byBankCat[t.bankAccountId][cat] += delta;
  });

  let html = '<div style="margin-top:22px">' +
    '<h3 style="font-size:16px;font-weight:700;margin-bottom:14px"><i class="fas fa-layer-group" style="color:var(--primary);margin-right:8px"></i>Balance by Category — per bank</h3>';

  list.forEach(b => {
    const splits = byBankCat[b.id] || {};
    const keys = Object.keys(splits).filter(k => Math.abs(splits[k]) > 0.01);
    const total = keys.reduce((s,k) => s + splits[k], 0);

    html += '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:12px">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
      '<div><strong style="font-size:14px">' + E(b.bankName || b.name) + '</strong>' +
      '<div style="font-size:11px;color:var(--gray)">' + E(b.accountNumber || '') + '</div></div>' +
      '<div style="font-weight:700;font-size:15px;color:' + (N(b.currentBalance) >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + F(b.currentBalance) + '</div>' +
    '</div>';

    if (keys.length === 0) {
      html += '<div style="font-size:12px;color:var(--gray);text-align:center;padding:8px">No categorized transactions — click Auto-Tag All</div>';
    } else {
      const sorted = keys.sort((a, b2) => Math.abs(splits[b2]) - Math.abs(splits[a]));
      sorted.forEach(k => {
        const amt = splits[k];
        const share = total !== 0 ? Math.abs(amt / total) * 100 : 0;
        const color = k === '(Uncategorized)' ? '#94a3b8' : catColor(k);
        html += '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">' +
          '<span style="width:10px;height:10px;border-radius:50%;background:' + color + ';flex-shrink:0"></span>' +
          '<span style="font-size:12px;min-width:120px;font-weight:600">' + E(k) + '</span>' +
          '<div style="flex:1;background:var(--border);height:5px;border-radius:3px;overflow:hidden">' +
            '<div style="height:100%;width:' + share + '%;background:' + color + '"></div>' +
          '</div>' +
          '<span style="font-size:12px;font-weight:700;min-width:110px;text-align:right;color:' + (amt >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + F(amt) + '</span>' +
        '</div>';
      });
      const diff = N(b.currentBalance) - total;
      if (Math.abs(diff) > 1) {
        html += '<div style="display:flex;justify-content:space-between;padding-top:8px;margin-top:8px;border-top:2px dashed var(--border);font-size:11px;color:var(--gray)">' +
          '<span>Opening balance / adjustments</span>' +
          '<span style="font-weight:700">' + F(diff) + '</span>' +
        '</div>';
      }
    }
    html += '</div>';
  });

  html += '</div>';
  host.innerHTML = html;
}

function renderBankTxnsChips() {

MF.openNewShopPayment = function () {
  const projList = projects();
  if (projList.length === 0) return NC.toast('Add a project first (in Business Ledger)', 'error');
  const catOpts = categories().map(c => ({ value:c.name, label:c.name }));
  const bankOpts = banks().map(b => ({ value:b.id, label: b.bankName || b.name || 'Bank' }));

  NC.modal({
    id:'mfShopPayModal',
    title:'Record Shop Payment',
    width:640,
    fields: [
      { id:'projectId', label:'Project *', type:'select', required:true,
        options: projList.map(p => ({ value:p.id, label: p.name })),
        placeholder:'-- Select project --' },
      { id:'amount', label:'Amount (Rs.) *', type:'number', required:true, step:'0.01' },
      { id:'date', label:'Date *', type:'date', required:true, value: T() },
      { id:'method', label:'Method *', type:'select', required:true,
        options: [
          { value:'cash', label:'Cash' },
          { value:'cheque', label:'Cheque' },
          { value:'bank', label:'Bank transfer' },
          { value:'mixed', label:'Mixed' }
        ], value:'cash' },
      { id:'bankAccountId', label:'Bank (if applicable)', type:'select',
        options: [{ value:'', label:'-- None --' }].concat(bankOpts), value:'' },
      { id:'category', label:'Category', type:'select',
        options: [{ value:'', label:'-- None --' }].concat(catOpts), value:'' },
      { id:'notes', label:'Notes', type:'textarea' }
    ],
    onSave: async d => {
      const amount = N(d.amount);
      if (amount <= 0) throw new Error('Amount must be positive');

      const ref = await db.collection('ncShopPayments').add(Object.assign({}, d, {
        amount,
        reinvestedAmount: 0,
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      }));

      // Cash ledger entry
      if (d.method === 'cash' || d.method === 'mixed') {
        await db.collection('ncCashLedger').add({
          type:'in', amount, date: d.date,
          source:'shop-payment', projectId: d.projectId,
          shopPaymentId: ref.id, notes:'Shop payment',
          createdAt: NC.ts()
        });
      }
      // Bank entry
      if ((d.method === 'bank' || d.method === 'mixed') && d.bankAccountId) {
        await db.collection('bankTransactions').add({
          bankAccountId: d.bankAccountId, date: d.date, type:'credit',
          amount, description:'Shop payment', category: d.category || 'Shop Payment',
          reference:'shoppayment:' + ref.id,
          sourceType:'shoppayment', sourceId: ref.id,
          createdAt: NC.ts()
        });
        await db.collection('bankAccounts').doc(d.bankAccountId).update({
          currentBalance: NC.inc(amount), updatedAt: NC.ts()
        });
      }

      NC.toast('Shop payment recorded', 'success');
      await loadMoneyFlow(true);
      renderShopPayments($('biz-shop'));
    }
  });
};

MF.bulkPreview = function () {
  const txt = ($('mfBulkText') || {}).value || '';
  const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
  const host = $('mfBulkPreview');
  if (!host) return;
  if (lines.length === 0) { host.innerHTML = 'No rows'; return; }
  const parsed = lines.map(l => {
    const [no, amt, bank, date] = l.split(',').map(x => (x || '').trim());
    return { no, amt: N(amt), bank, date };
  }).filter(r => r.no && r.amt > 0);
  const total = parsed.reduce((s, r) => s + r.amt, 0);
  host.innerHTML =
    '<div style="display:flex;justify-content:space-between"><span>Parsed rows:</span><strong>' + parsed.length + '</strong></div>' +
    '<div style="display:flex;justify-content:space-between"><span>Total:</span><strong>' + F(total) + '</strong></div>';
};

MF.bulkCommit = async function () {
  const projId = $('mfBulkProj').value;
  const cat = $('mfBulkCat').value;
  if (!projId) return NC.toast('Select a project', 'error');
  const txt = $('mfBulkText').value || '';
  const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return NC.toast('Nothing to import', 'error');

  const rows = lines.map(l => {
    const [no, amt, bank, date] = l.split(',').map(x => (x || '').trim());
    return { no, amt: N(amt), bank, date: date || T() };
  }).filter(r => r.no && r.amt > 0);

  if (!rows.length) return NC.toast('No valid rows', 'error');
  if (!await NC.confirm('Import ' + rows.length + ' cheque(s) totalling ' + F(rows.reduce((s,r) => s + r.amt, 0)) + '?', { confirmLabel:'Import' })) return;

  try {
    for (const r of rows) {
      await db.collection('ncShopPayments').add({
        projectId: projId, amount: r.amt, date: r.date,
        method: 'cheque', bank: r.bank, chequeNo: r.no,
        category: cat || null,
        notes: 'Bulk import · Cheque #' + r.no,
        reinvestedAmount: 0,
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      });
    }
    NC.toast('Imported ' + rows.length + ' cheque(s)', 'success');
    NC.closeModal('mfBulkModal');
    await loadMoneyFlow(true);
    renderShopPayments($('biz-shop'));
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

MF.removeShopPayment = async function (id) {
  const p = shopPayments().find(x => x.id === id);
  if (!p) return;
  if (!await NC.confirm('Delete this shop payment? Linked cash/bank entries will also be removed.', { danger:true, confirmLabel:'Delete' })) return;
  try {
    // Reverse linked entries
    const cashEntries = cashLedger().filter(c => c.shopPaymentId === id);
    for (const c of cashEntries) await db.collection('ncCashLedger').doc(c.id).delete();
    const bankEntries = bankTxns().filter(t => t.sourceId === id && t.sourceType === 'shoppayment');
    for (const t of bankEntries) {
      await db.collection('bankTransactions').doc(t.id).delete();
      if (t.bankAccountId) {
        await db.collection('bankAccounts').doc(t.bankAccountId).update({
          currentBalance: NC.inc(t.type === 'credit' ? -N(t.amount) : N(t.amount))
        });
      }
    }
    await db.collection('ncShopPayments').doc(id).delete();
    NC.toast('Shop payment deleted', 'success');
    await loadMoneyFlow(true);
    renderShopPayments($('biz-shop'));
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

MF.openCashTransfer = function () {
  if (banks().length === 0) return NC.toast('Add a bank first', 'error');
  const bal = cashBalance();
  const bankOpts = banks().map(b => ({ value:b.id, label: b.bankName || b.name || 'Bank' }));

  NC.modal({
    id:'mfCashTransModal',
    title:'Cash ↔ Bank Transfer',
    width:560,
    fields: [
      { id:'direction', label:'Direction *', type:'select', required:true, options:[
        { value:'c2b', label:'Cash → Bank' },
        { value:'b2c', label:'Bank → Cash' }
      ], value:'c2b' },
      { id:'bankAccountId', label:'Bank *', type:'select', required:true, options:bankOpts, placeholder:'-- Select --' },
      { id:'amount', label:'Amount (cash on hand: ' + F(bal) + ') *', type:'number', required:true, step:'0.01' },
      { id:'date', label:'Date *', type:'date', required:true, value: T() },
      { id:'notes', label:'Notes', type:'textarea' }
    ],
    onSave: async d => {
      const amt = N(d.amount);
      if (amt <= 0) throw new Error('Amount must be positive');
      if (d.direction === 'c2b' && amt > bal + 0.01) throw new Error('Not enough cash. Only ' + F(bal) + ' available');

      const ref = await db.collection('ncCashTransfers').add(Object.assign({}, d, {
        amount: amt,
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      }));

      if (d.direction === 'c2b') {
        await db.collection('ncCashLedger').add({
          type:'out', amount: amt, date: d.date,
          source:'transfer-to-bank', notes: d.notes || 'Transferred to bank',
          transferId: ref.id, createdAt: NC.ts()
        });
        await db.collection('bankAccounts').doc(d.bankAccountId).update({
          currentBalance: NC.inc(amt), updatedAt: NC.ts()
        });
        await db.collection('bankTransactions').add({
          bankAccountId: d.bankAccountId, date: d.date, type:'credit',
          amount: amt, description:'Cash → Bank transfer', category:'Transfer',
          reference:'cashtransfer:' + ref.id,
          sourceType:'cashtransfer', sourceId: ref.id,
          createdAt: NC.ts()
        });
      } else {
        await db.collection('bankAccounts').doc(d.bankAccountId).update({
          currentBalance: NC.inc(-amt), updatedAt: NC.ts()
        });
        await db.collection('ncCashLedger').add({
          type:'in', amount: amt, date: d.date,
          source:'transfer-from-bank', notes: d.notes || 'Withdrawn from bank',
          transferId: ref.id, createdAt: NC.ts()
        });
        await db.collection('bankTransactions').add({
          bankAccountId: d.bankAccountId, date: d.date, type:'debit',
          amount: amt, description:'Bank → Cash transfer', category:'Transfer',
          reference:'cashtransfer:' + ref.id,
          sourceType:'cashtransfer', sourceId: ref.id,
          createdAt: NC.ts()
        });
      }
      NC.toast('Transfer completed', 'success');
      await loadMoneyFlow(true);
      renderCash($('biz-cash'));
    }
  });
};

MF.autoTagAll = async function () {
  const btn = event && event.target;
  if (btn) { btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Tagging…'; }

  let done = 0, skipped = 0;
  const txns = bankTxns();
  for (const t of txns) {
    if (t.category) { skipped++; continue; }
    const cat = await resolveCategoryFromRef(t);
    if (cat) {
      const src = parseSource(t.reference);
      try {
        await db.collection('bankTransactions').doc(t.id).update({
          category: cat,
          sourceType: src.type,
          sourceId: src.id,
          autoTaggedAt: NC.nowISO()
        });
        done++;
      } catch (e) {}
    }
  }
  await loadMoneyFlow(true);
  if (btn) { btn.disabled = false; btn.innerHTML = orig; }
  if (done === 0) NC.toast('Nothing to tag (' + skipped + ' already tagged)', 'info');
  else NC.toast('Auto-tagged ' + done + ' transaction(s)', 'success');
  MF.refreshBankTxns();
  renderBankTxnsChips();
};

function parseSource(ref) {
  if (!ref) return { type: null, id: null };
  const m = String(ref).match(/^(cheque|inpayment|outpayment|loan|shoppayment|repayment|cashtransfer)[:_](.+)$/i);
  if (!m) return { type: null, id: null };
  return { type: m[1].toLowerCase(), id: m[2] };
}

async function resolveCategoryFromRef(txn) {
  const src = parseSource(txn.reference);
  if (!src.type || !src.id) return null;
  try {
    if (src.type === 'cheque') {
      const d = await db.collection('cheques').doc(src.id).get();
      return d.exists ? (d.data().category || null) : null;
    }
    if (src.type === 'inpayment') {
      const d = await db.collection('inPayments').doc(src.id).get();
      return d.exists ? (d.data().category || null) : null;
    }
    if (src.type === 'outpayment') {
      const d = await db.collection('outPayments').doc(src.id).get();
      return d.exists ? (d.data().category || null) : null;
    }
    if (src.type === 'shoppayment') {
      const d = await db.collection('ncShopPayments').doc(src.id).get();
      return d.exists ? (d.data().category || 'Shop Payment') : null;
    }
    if (src.type === 'loan') {
      const d = await db.collection('loans').doc(src.id).get();
      if (d.exists) {
        const allocs = d.data().allocations || [];
        return allocs.length > 0 ? (allocs[0].category || null) : null;
      }
    }
    if (src.type === 'repayment') return 'Finance';
    if (src.type === 'cashtransfer') return 'Transfer';
  } catch (e) {}
  return null;
}

<!-- ══════════════════════════════════════════════════════
     PART 8 — CHEQUE → FINANCE BRIDGE
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modBridge) return;
window.__modBridge = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function allCheques() {
  return (NC.state.allCheques || []).filter(c => !c.deletedAt);
}
function eligibleCheques() {
  // In-hand or deposited — the ones you'd hand over to a finance company
  return allCheques().filter(c => c.status === 'in-hand' || c.status === 'deposited');
}
function financePlans() {
  return (window.FIN && window.FIN.plans) || [];
}
function planById(id) {
  return financePlans().find(p => p.id === id);
}
function planLabel(p) {
  if (!p) return '';
  return (p.vehicle || '') + (p.company ? ' — ' + p.company : '');
}

/* Selection state */
const S = { selected: new Set() };

/* Refresh cheques + finance data */
async function reloadAll() {
  const [cheques] = await Promise.all([
    NC.load('cheques', { orderBy:{ field:'createdAt', dir:'desc' }, fresh:true }),
    (window.FIN && typeof FIN.openPlanDetail === 'function')
      ? Promise.resolve()
      : (window.FIN ? NC.load('finance_plans', { fresh:true }) : Promise.resolve())
  ]);
  NC.state.allCheques = cheques;

  // Refresh FIN state if part 5 is loaded
  if (window.FIN && typeof FIN.loadFinance === 'function') {
    // Part 5 exposes loadFinance indirectly; trigger via reload
    // We just re-read the collections here for safety
  }
  // Ensure FIN.plans is fresh
  if (window.FIN) {
    try {
      const plans = await NC.load('finance_plans', { fresh:false });
      if (Array.isArray(plans)) window.FIN.plans = plans;
    } catch (e) {}
  }
}

/* ══════════════════════════════════════════════════════
   BRIDGE VIEW
   ══════════════════════════════════════════════════════ */
function renderBridge(el) {
  const cheques = eligibleCheques();
  const plans = financePlans();

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-link" style="color:var(--primary);margin-right:8px"></i>Cheque → Finance Bridge</h2>' +
      '<button class="btn btn-secondary btn-sm" onclick="BRIDGE.refresh()"><i class="fas fa-sync"></i> Refresh</button>' +
    '</div>' +

    '<div style="background:#dbeafe;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin-bottom:20px;font-size:13px;color:#1e40af">' +
      '<i class="fas fa-info-circle"></i> Select in-hand cheques and issue them to a Finance plan. Status will change to <strong>Issued</strong> and matching <strong>pending</strong> finance payments will be created automatically.' +
    '</div>' +

    /* Empty states */
    (plans.length === 0
      ? '<div class="empty-state">' +
          '<i class="fas fa-exclamation-triangle" style="color:var(--warning)"></i>' +
          '<h3>No Finance plans found</h3>' +
          '<p style="margin-top:8px">Open <strong>Finance Manager</strong> and create a plan first.</p>' +
          '<button class="btn btn-primary" style="margin-top:16px" onclick="NC.navigate(\'finance-dashboard\')"><i class="fas fa-coins"></i> Go to Finance Manager</button>' +
        '</div>'
      : cheques.length === 0
        ? '<div class="empty-state">' +
            '<i class="fas fa-hand-holding"></i>' +
            '<h3>No in-hand or deposited cheques</h3>' +
            '<p style="margin-top:8px">Add cheques with status <strong>In Hand</strong> or <strong>Deposited</strong> to see them here.</p>' +
            '<button class="btn btn-primary" style="margin-top:16px" onclick="NC.navigate(\'all-cheques\')"><i class="fas fa-list"></i> Go to All Cheques</button>' +
          '</div>'
        : /* Form + table */
          '<div style="background:var(--light);padding:16px;border-radius:10px;margin-bottom:20px">' +
            '<div class="form-group" style="margin-bottom:0">' +
              '<label style="font-weight:700">Target Finance Plan *</label>' +
              '<select id="bridgePlanSel" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:14px">' +
                '<option value="">-- Select a plan --</option>' +
                plans.map(p => {
                  const outstanding = N(p.capitalCurrent);
                  const status = p.status || 'active';
                  return '<option value="' + E(p.id) + '">' +
                    E(planLabel(p)) +
                    ' · Outstanding ' + F(outstanding) +
                    ' · ' + E(status) +
                  '</option>';
                }).join('') +
              '</select>' +
            '</div>' +
          '</div>' +

          /* Selection summary */
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">' +
            '<div style="font-size:13px;color:var(--gray)">' +
              '<strong id="bridgeSelCount" style="color:var(--dark)">0</strong> cheque(s) selected' +
              ' · Total: <strong id="bridgeSelTotal" style="color:var(--primary)">' + F(0) + '</strong>' +
            '</div>' +
            '<div>' +
              '<button class="btn btn-secondary btn-sm" onclick="BRIDGE.selectAll()" style="margin-right:6px"><i class="fas fa-check-square"></i> Select All</button>' +
              '<button class="btn btn-secondary btn-sm" onclick="BRIDGE.clear()"><i class="fas fa-times"></i> Clear</button>' +
            '</div>' +
          '</div>' +

          '<div class="table-container"><table><thead><tr>' +
            '<th style="width:40px"><input type="checkbox" id="bridgeSelAll" onchange="BRIDGE.toggleAll(this)"></th>' +
            '<th>#</th><th>Payee</th><th>Amount</th><th>Bank</th><th>Date</th><th>Category</th><th>Status</th>' +
          '</tr></thead><tbody>' +
          cheques.slice().sort((a, b) => String(b.date||'').localeCompare(String(a.date||''))).map(c => {
            const checked = S.selected.has(c.id) ? ' checked' : '';
            const catBadge = c.category
              ? '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:' + catColor(c.category) + '22;color:' + catColor(c.category) + '">' + E(c.category) + '</span>'
              : '<span style="color:var(--gray);font-size:11px">-</span>';
            return '<tr>' +
              '<td><input type="checkbox" class="bridge-cb" data-id="' + E(c.id) + '"' + checked + ' onchange="BRIDGE.toggle(\'' + c.id + '\', this.checked)"></td>' +
              '<td><strong>' + E(c.number || '-') + '</strong></td>' +
              '<td>' + E(c.payee || '-') + '</td>' +
              '<td style="font-weight:700">' + F(c.amount) + '</td>' +
              '<td>' + E(c.bank || '-') + '</td>' +
              '<td>' + dfmt(c.date) + '</td>' +
              '<td>' + catBadge + '</td>' +
              '<td><span class="status-badge status-' + c.status + '">' + c.status + '</span></td>' +
            '</tr>';
          }).join('') +
          '</tbody></table></div>' +

          '<div style="margin-top:20px;display:flex;gap:12px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)">' +
            '<button class="btn btn-secondary" onclick="BRIDGE.clear()">Clear</button>' +
            '<button class="btn btn-primary" id="bridgeIssueBtn" onclick="BRIDGE.issue()" disabled style="opacity:.5">' +
              '<i class="fas fa-paper-plane"></i> Issue to Finance' +
            '</button>' +
          '</div>'
    ) +
  '</div>';

  BRIDGE.updateSummary();
}

function catColor(name) {
  const c = (NC.state.categories || []).find(x => x.name === name);
  return (c && c.color) || '#6366f1';
}

/* ══════════════════════════════════════════════════════
   PUBLIC API — BRIDGE.*
   ══════════════════════════════════════════════════════ */
const BRIDGE = window.BRIDGE = {};

BRIDGE.refresh = async function () {
  await reloadAll();
  // Re-render current view
  const el = $('bridge');
  if (el) renderBridge(el);
  NC.toast('Refreshed', 'success');
};

BRIDGE.toggle = function (id, checked) {
  if (checked) S.selected.add(id);
  else S.selected.delete(id);
  this.updateSummary();
};

BRIDGE.toggleAll = function (cb) {
  const list = eligibleCheques();
  if (cb.checked) list.forEach(c => S.selected.add(c.id));
  else S.selected.clear();
  document.querySelectorAll('.bridge-cb').forEach(el => el.checked = cb.checked);
  this.updateSummary();
};

BRIDGE.selectAll = function () {
  eligibleCheques().forEach(c => S.selected.add(c.id));
  document.querySelectorAll('.bridge-cb').forEach(el => el.checked = true);
  const all = $('bridgeSelAll');
  if (all) all.checked = true;
  this.updateSummary();
};

BRIDGE.clear = function () {
  S.selected.clear();
  document.querySelectorAll('.bridge-cb').forEach(el => el.checked = false);
  const all = $('bridgeSelAll');
  if (all) all.checked = false;
  this.updateSummary();
};

BRIDGE.updateSummary = function () {
  const cnt = $('bridgeSelCount');
  const tot = $('bridgeSelTotal');
  const btn = $('bridgeIssueBtn');
  const list = eligibleCheques().filter(c => S.selected.has(c.id));
  const total = list.reduce((s, c) => s + N(c.amount), 0);

  if (cnt) cnt.textContent = S.selected.size;
  if (tot) tot.textContent = F(total);
  if (btn) {
    btn.disabled = S.selected.size === 0;
    btn.style.opacity = S.selected.size === 0 ? '0.5' : '1';
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Issue ' + S.selected.size + ' to Finance';
  }
};

/* Preselect a cheque (used by the Issuance Prompt) */
BRIDGE.preselect = function (chequeId) {
  S.selected.clear();
  S.selected.add(chequeId);
};

/* ══════════════════════════════════════════════════════
   ISSUE ACTION
   ══════════════════════════════════════════════════════ */
BRIDGE.issue = async function () {
  const planId = ($('bridgePlanSel') || {}).value;
  if (!planId) return NC.toast('Select a Finance plan first', 'error');
  const plan = planById(planId);
  if (!plan) return NC.toast('Plan not found', 'error');
  if (S.selected.size === 0) return NC.toast('Select at least one cheque', 'error');

  const cheques = eligibleCheques().filter(c => S.selected.has(c.id));
  const total = cheques.reduce((s, c) => s + N(c.amount), 0);

  const ok = await NC.confirm(
    'Issue ' + cheques.length + ' cheque(s) totalling ' + F(total) + '\n' +
    'to Finance Plan:\n\n"' + planLabel(plan) + '"\n\n' +
    'This will:\n' +
    '  • Change their status to "Issued"\n' +
    '  • Link them to the plan\n' +
    '  • Create ' + cheques.length + ' matching finance payment(s) as PENDING\n\n' +
    'Proceed?',
    { confirmLabel: 'Issue to Finance' }
  );
  if (!ok) return;

  const btn = $('bridgeIssueBtn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…';
  }

  const userEmail = NC.state.user ? NC.state.user.email : 'system';
  let done = 0, failed = 0;

  for (const c of cheques) {
    try {
      /* ── 1. Update cheque ── */
      const hist = {
        action: 'Issued to Finance',
        details: 'Issued to Finance plan "' + planLabel(plan) + '" (' + F(c.amount) + ')',
        timestamp: NC.nowISO(),
        user: userEmail
      };
      await db.collection('cheques').doc(c.id).update({
        status: 'issued',
        issuedTo: planLabel(plan),
        issuedDate: T(),
        financePlanId: planId,
        financePlanName: planLabel(plan),
        issuedToFinance: true,
        history: NC.au(hist),
        updatedAt: NC.ts()
      });

      /* ── 2. Create finance_payments entry (pending) ── */
      await db.collection('finance_payments').add({
        planId,
        planName: planLabel(plan),
        chequeId: c.id,
        chequeNo: c.number,
        chequeNumber: c.number,
        chequeBank: c.bank,
        amount: N(c.amount),
        method: 'cheque',
        effectiveDate: c.date || T(),
        date: T(),
        source: 'cheque-bridge',
        category: c.category || 'Finance',
        reference: 'Cheque #' + c.number + (c.bank ? ' · ' + c.bank : ''),
        status: 'pending',           /* user marks Cleared in Finance Manager */
        notes: 'Auto-created from Cheque → Finance Bridge',
        createdAt: NC.ts(),
        createdBy: userEmail
      });

      done++;
      if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + done + '/' + cheques.length;
    } catch (e) {
      console.error('[Bridge] issue failed for cheque ' + c.number, e);
      failed++;
    }
  }

  if (btn) {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Issue to Finance';
  }

  S.selected.clear();

  NC.toast(
    'Issued ' + done + ' cheque(s) to ' + planLabel(plan) + (failed ? ' (' + failed + ' failed)' : ''),
    done > 0 ? 'success' : 'error'
  );

  /* ── 3. Reload everything ── */
  await reloadAll();
  // Refresh FIN state so plan balances update in Finance Manager
  if (window.FIN && window.FIN.loaded !== undefined) {
    try {
      const plans = await NC.load('finance_plans', { fresh:true });
      const payments = await NC.load('finance_payments', { fresh:true });
      const deductions = await NC.load('finance_deductions', { fresh:true });
      if (Array.isArray(plans)) window.FIN.plans = plans;
      if (Array.isArray(payments)) window.FIN.payments = payments;
      if (Array.isArray(deductions)) window.FIN.deductions = deductions;
    } catch (e) {}
  }
  // Refresh the bridge view in place
  const el = $('bridge');
  if (el) renderBridge(el);
};

/* ══════════════════════════════════════════════════════
   ISSUANCE PROMPT — "Is this a Finance payment?"
   Wraps CHEQ.openStatus from Part 2
   ══════════════════════════════════════════════════════ */
function installIssuancePrompt() {
  if (!window.CHEQ || typeof CHEQ.openStatus !== 'function') {
    return setTimeout(installIssuancePrompt, 500);
  }
  if (CHEQ.openStatus.__bridgeWrapped) return;

  const orig = CHEQ.openStatus;
  CHEQ.openStatus = function (chequeId) {
    // Call original to render the modal
    const result = orig.apply(this, arguments);

    // After modal opens, intercept the save button
    setTimeout(() => {
      const saveBtn = $('chqStatusSave');
      const statusSel = $('chqNewStatus');
      if (!saveBtn || !statusSel) return;

      const originalClick = saveBtn.onclick;
      saveBtn.onclick = async () => {
        const newStatus = statusSel.value;
        // Only intercept when issuing AND cheque isn't already a bridge cheque
        if (newStatus === 'issued') {
          const cheque = (NC.state.allCheques || []).find(c => c.id === chequeId);
          if (cheque && !cheque.issuedToFinance) {
            const goToBridge = await NC.confirm(
              'Is this a cheque payment to a Finance Plan?\n\n' +
              'If YES, you\'ll be taken to the Cheque → Finance Bridge to pick a plan.\n' +
              'If NO, the cheque will be issued as a normal business payment.',
              {
                title: 'Finance Payment?',
                confirmLabel: 'Yes — Open Bridge',
                cancelLabel: 'No — Issue Normally'
              }
            );

            if (goToBridge) {
              // Ensure bridge data is fresh, preselect, navigate
              BRIDGE.preselect(chequeId);
              NC.closeModal('chqStatusModal');
              // Refresh FIRST so the cheque shows in the bridge table
              reloadAll().then(() => {
                NC.navigate('bridge');
                NC.toast('Cheque pre-selected — choose a plan to finish', 'info');
              });
              return;
            }
          }
        }
        // Otherwise, proceed with normal save
        return originalClick.call(saveBtn);
      };
    }, 80);

    return result;
  };
  CHEQ.openStatus.__bridgeWrapped = true;
  console.log('[Bridge] ✅ Issuance prompt installed on CHEQ.openStatus');
}

/* ══════════════════════════════════════════════════════
   MODULE REGISTRATION
   ══════════════════════════════════════════════════════ */
NC.registerModule('bridge', {
  init() {
    reloadAll().then(() => {
      installIssuancePrompt();
      console.log('[Bridge module] ✅ Ready — ' + eligibleCheques().length + ' eligible cheque(s), ' + financePlans().length + ' plan(s)');
    });
  },
  views: {
    'bridge': {
      title: 'Cheque → Finance',
      tab: 'finance',
      icon: 'link',
      order: 3,     /* right after Finance Manager + Plan Details */
      render: renderBridge
    }
  }
});

console.log('%c[Part 8 — CHEQUE → FINANCE BRIDGE] ✅ Registered', 'color:#10b981;font-weight:bold');

})();
</script>
<!-- ══════════════════════════════════════════════════════
     PART 9 — USERS & PERMISSIONS
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modUsers) return;
window.__modUsers = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   ROLE + PERMISSION MODEL
   ══════════════════════════════════════════════════════ */
const ROLES = ['admin', 'maker', 'checker', 'viewer'];

const ROLE_META = {
  admin:   { label:'Admin',   color:'#dc2626', icon:'crown',         desc:'Full access — can delete, purge, manage users' },

};

/* Permission groups + actions */

  {
    group: 'Cheques',
    perms: [
      { key:'cheques.view',     label:'View cheques' },
      { key:'cheques.create',   label:'Create cheques' },

      { key:'finance.payments', label:'Record payments' },
      { key:'finance.deduct',   label:'Manage deductions' },
      { key:'finance.purge',    label:'Purge finance data' }
    ]
  },
  {
    group: 'Ledger',
    perms: [
      { key:'ledger.view',      label:'View ledger' },
      { key:'ledger.sources',   label:'Manage money sources' },
      { key:'ledger.deploy',    label:'Deploy money' },

  },

    ]

    perms: [
      { key:'admin.users',      label:'Manage users' },

      { key:'admin.audit',      label:'View audit log' },
      { key:'admin.purge',      label:'Global purge' }
    ]
  }
];

/* Default permissions per role */
const ROLE_PRESETS = {
  admin: (() => {
    const o = {};
    PERM_GROUPS.forEach(g => g.perms.forEach(p => { o[p.key] = true; }));
    return o;
  })(),
  maker: {
    'cheques.view': true, 'cheques.create': true, 'cheques.edit': true, 'cheques.export': true,
    'finance.view': true, 'finance.payments': true,
    'ledger.view': true, 'ledger.sources': true, 'ledger.deploy': true, 'ledger.projects': true,
    'payments.view': true, 'payments.record': true, 'payments.cash': true, 'payments.parties': true
  },
  checker: {
    'cheques.view': true, 'cheques.status': true, 'cheques.export': true,
    'finance.view': true, 'finance.payments': true, 'finance.deduct': true,
    'ledger.view': true,
    'payments.view': true, 'payments.record': true, 'payments.banks': true,
    'admin.audit': true
  },
  viewer: (() => {
    const o = {};
    PERM_GROUPS.forEach(g => g.perms.forEach(p => {
      if (p.key.endsWith('.view') || p.key === 'cheques.export') o[p.key] = true;
    }));
    return o;
  })()
};

function presetForRole(role) {
  return Object.assign({}, ROLE_PRESETS[role] || {});
}

/* ══════════════════════════════════════════════════════
   CURRENT USER PERMISSIONS
   ══════════════════════════════════════════════════════ */
const PERMS = window.PERMS = {
  current: null,        /* user doc from Firestore */
  role: 'viewer',
  permissions: {},

  /* Can the current user perform this action? */
  can(action) {
    // Before auth is ready — assume deny (safe default)
    if (!PERMS.current) return false;
    // Admin bypasses everything
    if (PERMS.role === 'admin') return true;
    return PERMS.permissions[action] === true;
  },

  /* Load the current user's doc */
  async loadCurrent() {
    const user = NC.state.user;
    if (!user) { PERMS.current = null; return; }

    try {
      const docRef = db.collection('users').doc(user.uid);
      let snap = await docRef.get();

      if (!snap.exists) {
        // Bootstrap new user doc — first-time sign-in
        // If they're the first user, make them Admin
        const countSnap = await db.collection('users').limit(1).get();
        const isFirst = countSnap.empty;
        const role = isFirst ? 'admin' : 'maker';
        const nowISO = NC.nowISO();
        const docData = {
          email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          photoURL: user.photoURL || null,
          role,
          permissions: presetForRole(role),
          status: 'active',
          createdAt: NC.ts(),
          createdBy: 'system-bootstrap',
          lastSeenAt: NC.ts()
        };
        await docRef.set(docData);
        snap = await docRef.get();
        if (isFirst) NC.toast('You are the first user — granted Admin', 'success');
      } else {
        // update lastSeen
        docRef.update({ lastSeenAt: NC.ts() }).catch(() => {});
      }

      const data = snap.data();
      PERMS.current = Object.assign({ id: snap.id, uid: user.uid }, data);
      PERMS.role = data.role || 'viewer';
      PERMS.permissions = data.permissions || presetForRole(PERMS.role);
      NC.emit('perms:ready', { role: PERMS.role });
      console.log('[Users] Current user: ' + data.email + ' · role: ' + PERMS.role);
    } catch (e) {
      console.warn('[Users] Could not load current user doc', e);
      PERMS.current = null;
    }
  },

  /* Reload (after admin updates self or via other user changes) */
  async refresh() {
    await PERMS.loadCurrent();
  }
};

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function users() {
  return (NC.data.users || []);
}
function userById(id) {
  return users().find(u => u.id === id);
}

async function loadUsers(force) {
  try {
    const list = await NC.load('users', { fresh: !!force });
    NC.data.users = list;
  } catch (e) { console.warn('[Users] load failed', e); }
}

/* Count how many admins exist — guard against last admin demotion/deletion */
function adminCount() {
  return users().filter(u => u.role === 'admin' && u.status !== 'removed').length;
}

/* ── INVITE USER ── */
USERS.openInvite = function () {
  const roleOpts = ROLES.map(r => ({ value:r, label: ROLE_META[r].label + ' — ' + ROLE_META[r].desc }));

  NC.modal({
    id:'usersInviteModal',
    title:'Invite User',
    width:600,
    bodyHTML:
      '<div style="background:#dbeafe;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;color:#1e40af">' +
        '<i class="fas fa-info-circle"></i> The user will be added as <strong>Pending</strong>. When they sign in with this email for the first time, their account will activate automatically with the role you choose here.' +
      '</div>',
    fields: [
      { id:'email', label:'Email *', type:'email', required:true, hint:'Must match their Firebase login email' },
      { id:'displayName', label:'Display Name', type:'text', hint:'Optional — defaults to email prefix' },
      { id:'role', label:'Role *', type:'select', required:true, options: roleOpts, value:'maker' }
    ],
    onSave: async d => {
      const email = String(d.email || '').trim().toLowerCase();
      if (!email) throw new Error('Email required');
      if (users().some(u => String(u.email || '').toLowerCase() === email && u.status !== 'removed')) {
        throw new Error('A user with this email already exists');
      }
      const permPreset = presetForRole(d.role);
      await db.collection('users').add({
        email,
        displayName: d.displayName || email.split('@')[0],
        role: d.role,
        permissions: permPreset,
        status: 'pending',
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'admin',
        invitedAt: NC.ts()
      });
      NC.toast('Invite recorded — user will activate on first sign-in', 'success');
      await loadUsers(true);
      // Re-render
      const el = $('users');
      if (el) renderUsersView(el);
    }
  });
};

/* ── EDIT USER (name + role) ── */
USERS.openEdit = function (id) {
  if (!PERMS.can('admin.users')) return NC.toast('Admin only', 'error');
  const u = userById(id);
  if (!u) return;
  const roleOpts = ROLES.map(r => ({ value:r, label: ROLE_META[r].label + ' — ' + ROLE_META[r].desc }));

  NC.modal({
    id:'usersEditModal',
    title:'Edit User',
    width:600,
    bodyHTML:
      '<div style="background:#fef3c7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12.5px;color:#92400e">' +
        '<i class="fas fa-exclamation-triangle"></i> Changing the role will <strong>reset the permissions</strong> to that role\'s defaults. Use "Edit Permissions" for fine-grained control.' +
      '</div>',
    fields: [
      { id:'displayName', label:'Display Name', type:'text', value: u.displayName || '' },
      { id:'email', label:'Email', type:'text', value: u.email || '', hint:'Cannot be changed here — tied to Firebase auth' },
      { id:'role', label:'Role *', type:'select', required:true, options: roleOpts, value: u.role || 'maker' },
      { id:'status', label:'Status', type:'select', options: [
        { value:'active', label:'Active' },
        { value:'pending', label:'Pending' },
        { value:'removed', label:'Removed' }
      ], value: u.status || 'active' }
    ],
    onSave: async d => {
      // Guard: cannot demote last admin
      if (u.role === 'admin' && d.role !== 'admin' && adminCount() <= 1) {
        throw new Error('Cannot demote the only remaining admin');
      }
      const update = {
        displayName: d.displayName || u.displayName,
        role: d.role,
        status: d.status,
        updatedAt: NC.ts()
      };
      // If role changed, reset permissions to preset
      if (d.role !== u.role) {
        update.permissions = presetForRole(d.role);
      }
      await db.collection('users').doc(id).update(update);
      NC.toast('User updated', 'success');
      // If editing self, refresh PERMS
      if (PERMS.current && PERMS.current.uid === u.uid) {
        await PERMS.refresh();
        NC.emit('perms:ready', { role: PERMS.role });
      }
      await loadUsers(true);
      const el = $('users');
      if (el) renderUsersView(el);
    }
  });
};

/* ── EDIT PERMISSIONS MATRIX ── */
USERS.openPerms = function (id) {
  if (!PERMS.can('admin.users')) return NC.toast('Admin only', 'error');
  const u = userById(id);
  if (!u) return;

  const currentPerms = Object.assign({}, u.permissions || {});

  const groupsHTML = PERM_GROUPS.map(g => {
    const rows = g.perms.map(p => {
      const checked = currentPerms[p.key] ? ' checked' : '';
      return '<label style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:white;border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px;border:1px solid var(--border)">' +
        '<input type="checkbox" class="perm-cb" data-perm="' + E(p.key) + '"' + checked + ' style="width:16px;height:16px;cursor:pointer">' +
        '<div style="flex:1">' +
          '<div style="font-weight:600">' + E(p.label) + '</div>' +
          '<div style="font-size:11px;color:var(--gray)">' + E(p.key) + '</div>' +
        '</div>' +
      '</label>';
    }).join('');
    return '<div style="margin-bottom:18px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<h4 style="font-size:12px;text-transform:uppercase;color:var(--gray);letter-spacing:.5px">' + E(g.group) + '</h4>' +
        '<button type="button" onclick="USERS.setGroup(\'' + E(g.group) + '\',true)" style="background:none;border:none;color:var(--primary);font-size:11px;cursor:pointer;font-weight:600">Select all</button>' +
      '</div>' +
      rows +
    '</div>';
  }).join('');

  NC.modal({
    id:'usersPermsModal',
    title:'Edit Permissions — ' + E(u.displayName || u.email),
    width:680,
    bodyHTML:
      '<div style="background:#dbeafe;border-left:4px solid #3b82f6;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12.5px;color:#1e40af">' +
        '<i class="fas fa-shield-alt"></i> Fine-tune access for this user. Admin role always grants full access regardless of these settings.' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-secondary btn-xs" onclick="USERS.applyPreset(\'admin\')"><i class="fas fa-crown"></i> Reset to Admin</button>' +
        '<button type="button" class="btn btn-secondary btn-xs" onclick="USERS.applyPreset(\'maker\')"><i class="fas fa-pen"></i> Reset to Maker</button>' +
        '<button type="button" class="btn btn-secondary btn-xs" onclick="USERS.applyPreset(\'checker\')"><i class="fas fa-check-double"></i> Reset to Checker</button>' +
        '<button type="button" class="btn btn-secondary btn-xs" onclick="USERS.applyPreset(\'viewer\')"><i class="fas fa-eye"></i> Reset to Viewer</button>' +
      '</div>' +
      groupsHTML,
    hideSave:true
  });

  const footer = $('usersPermsModal').querySelector('.modal-footer');
  footer.innerHTML =
    '<button class="btn btn-secondary" onclick="NC.closeModal(\'usersPermsModal\')">Cancel</button>' +
    '<button class="btn btn-primary" id="usersPermsSave"><i class="fas fa-save"></i> Save Permissions</button>';

  $('usersPermsSave').onclick = async () => {
    const newPerms = {};
    document.querySelectorAll('.perm-cb').forEach(cb => {
      newPerms[cb.dataset.perm] = cb.checked;
    });
    try {
      await db.collection('users').doc(id).update({
        permissions: newPerms,
        updatedAt: NC.ts()
      });
      NC.toast('Permissions updated', 'success');
      if (PERMS.current && PERMS.current.uid === u.uid) {
        await PERMS.refresh();
        NC.emit('perms:ready', { role: PERMS.role });
      }
      NC.closeModal('usersPermsModal');
      await loadUsers(true);
      const el = $('users');
      if (el) renderUsersView(el);
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  };
};

/* Bulk toggle helpers used by the perms modal */
USERS.setGroup = function (groupName, value) {
  const group = PERM_GROUPS.find(g => g.group === groupName);
  if (!group) return;
  document.querySelectorAll('.perm-cb').forEach(cb => {
    if (group.perms.some(p => p.key === cb.dataset.perm)) cb.checked = value;
  });
};

USERS.applyPreset = function (role) {
  const preset = presetForRole(role);
  document.querySelectorAll('.perm-cb').forEach(cb => {
    cb.checked = preset[cb.dataset.perm] === true;
  });
  NC.toast('Preset applied: ' + role + ' (unsaved)', 'info');
};

/* ── REMOVE USER ── */
USERS.remove = async function (id) {
  if (!PERMS.can('admin.users')) return NC.toast('Admin only', 'error');
  const u = userById(id);
  if (!u) return;

  if (PERMS.current && PERMS.current.uid === u.uid && adminCount() <= 1) {
    return NC.toast('Cannot remove the only admin account', 'error');
  }
  if (u.role === 'admin' && adminCount() <= 1) {
    return NC.toast('Cannot remove the only remaining admin', 'error');
  }

  if (!await NC.confirm(
    'Remove user "' + (u.displayName || u.email) + '"?\n\n' +
    'This will mark them as Removed. Their Firebase login still exists — you must disable it separately in Firebase Console if needed.\n\n' +
    'The user will no longer be able to use the app.',
    { danger:true, confirmLabel:'Remove User' }
  )) return;

  try {
    await db.collection('users').doc(id).update({
      status: 'removed',
      permissions: {},
      removedAt: NC.ts(),
      removedBy: NC.state.user ? NC.state.user.email : 'admin'
    });
    NC.toast('User removed', 'success');
    await loadUsers(true);
    const el = $('users');
    if (el) renderUsersView(el);
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

/* ══════════════════════════════════════════════════════
   ENFORCEMENT — Hook into other modules (soft, opt-in)
   Example: block non-admins from Purge All
   ══════════════════════════════════════════════════════ */
function installEnforcement() {
  /* Guard Finance purge */
  if (window.FIN && typeof FIN.purgeAll === 'function' && !FIN.purgeAll.__permWrapped) {
    const orig = FIN.purgeAll;
    FIN.purgeAll = async function () {
      if (!PERMS.can('finance.purge') && !PERMS.can('admin.purge')) {
        NC.toast('You don\'t have permission to purge finance data', 'error');
        return;
      }
      return orig.apply(this, arguments);
    };
    FIN.purgeAll.__permWrapped = true;
  }

  /* Guard cheque deletion */
  if (window.CHEQ && typeof CHEQ.deleteCheque === 'function' && !CHEQ.deleteCheque.__permWrapped) {
    const orig = CHEQ.deleteCheque;
    CHEQ.deleteCheque = async function (id) {
      if (!PERMS.can('cheques.delete')) {
        NC.toast('You don\'t have permission to delete cheques', 'error');
        return;
      }
      return orig.apply(this, arguments);
    };
    CHEQ.deleteCheque.__permWrapped = true;
  }

  /* Guard user-management UI (grey out buttons if no perms) */
  // Buttons check perms in the click handlers already.
}

/* ══════════════════════════════════════════════════════
   MODULE REGISTRATION
   ══════════════════════════════════════════════════════ */
NC.registerModule('users', {
  init() {
    // Load current user's perms + full users list
    PERMS.loadCurrent()
      .then(() => loadUsers(false))
      .then(() => {
        installEnforcement();
        console.log('[Users module] ✅ Ready — ' + users().length + ' user(s) · you are: ' + PERMS.role);
        NC.emit('users:ready', { role: PERMS.role });
      });
  },
  views: {
    'users': {
      title: 'Users & Permissions',
      tab: 'cheques',
      icon: 'users-cog',
      order: 20,     /* after settings */
      render: renderUsersView
    }
  }
});

/* Re-run enforcement once Parts 5, 2 finish loading (in case of order issues) */
setTimeout(installEnforcement, 3000);
setTimeout(installEnforcement, 6000);

console.log('%c[Part 9 — USERS & PERMISSIONS] ✅ Registered', 'color:#10b981;font-weight:bold');

})();
</script>
<!-- ══════════════════════════════════════════════════════
     PART 10 — NOTIFICATIONS BELL
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modBell) return;
window.__modBell = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const dfmt = NC.dateFmt;
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ══════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════ */
const BELL = window.BELL = {
  notifications: [],
  open: false,
  refreshMs: 60 * 1000,
  _timer: null
};

/* ══════════════════════════════════════════════════════
   BUILD BELL UI
   ══════════════════════════════════════════════════════ */
function injectBell() {
  const host = document.querySelector('.nc-topbar-right');
  if (!host) return setTimeout(injectBell, 400);
  if ($('ncBellWrap')) return;

  const wrap = document.createElement('div');
  wrap.id = 'ncBellWrap';
  wrap.style.cssText = 'position:relative';
  wrap.innerHTML =
    '<button id="ncBellBtn" style="width:42px;height:42px;border:none;background:var(--light);border-radius:12px;cursor:pointer;font-size:16px;transition:all .2s;color:var(--dark);position:relative;display:flex;align-items:center;justify-content:center">' +
      '<i class="fas fa-bell"></i>' +
      '<span id="ncBellDot" style="position:absolute;top:5px;right:5px;min-width:16px;height:16px;background:var(--danger);color:white;border-radius:8px;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid white">0</span>' +
    '</button>';

  // Insert as the first child of topbar-right (before username)
  host.insertBefore(wrap, host.firstChild);

  $('ncBellBtn').onclick = e => { e.stopPropagation(); togglePanel(); };

  // Panel goes on body (fixed positioned)
  if (!$('ncBellPanel')) {
    const panel = document.createElement('div');
    panel.id = 'ncBellPanel';
    panel.style.cssText =
      'display:none;position:fixed;top:80px;right:24px;width:420px;max-height:70vh;overflow-y:auto;' +
      'background:white;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.22);z-index:2500;padding:8px;' +
      'font-family:Inter,sans-serif';
    panel.innerHTML =
      '<div style="padding:14px 16px;font-weight:800;font-size:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;border-radius:16px 16px 0 0;z-index:2">' +
        '<span id="ncBellPanelTitle">Notifications</span>' +
        '<button id="ncBellPanelClose" style="background:var(--light);border:none;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:12px"><i class="fas fa-times"></i></button>' +
      '</div>' +
      '<div id="ncBellList" style="padding:6px"></div>';
    document.body.appendChild(panel);

    $('ncBellPanelClose').onclick = () => closePanel();
    document.addEventListener('click', e => {
      if (!BELL.open) return;
      const panel = $('ncBellPanel');
      const wrap = $('ncBellWrap');
      if (panel && panel.contains(e.target)) return;
      if (wrap && wrap.contains(e.target)) return;
      closePanel();
    });
  }
}

function togglePanel() {
  const panel = $('ncBellPanel');
  if (!panel) return;
  if (BELL.open) closePanel();
  else openPanel();
}
function openPanel() {
  const panel = $('ncBellPanel');
  if (!panel) return;
  BELL.open = true;
  panel.style.display = 'block';
  panel.style.animation = 'fadeIn .2s ease';
  $('ncBellBtn').style.background = 'var(--primary)';
  $('ncBellBtn').style.color = 'white';
  refreshBell();
}
function closePanel() {
  const panel = $('ncBellPanel');
  if (!panel) return;
  BELL.open = false;
  panel.style.display = 'none';
  const btn = $('ncBellBtn');
  if (btn) { btn.style.background = 'var(--light)'; btn.style.color = 'var(--dark)'; }
}

/* ══════════════════════════════════════════════════════
   COMPUTE NOTIFICATIONS
   ══════════════════════════════════════════════════════ */
function computeNotifications() {
  const list = [];

  /* ── 1. Cheques ── */
  const cheques = (NC.state.allCheques || []).filter(c => !c.deletedAt);

  // Returned cheques with outstanding balance
  cheques.filter(c => c.status === 'returned').forEach(c => {
    const paid = (c.payments || []).reduce((s,p) => s + N(p.amount), 0);
    const rem = N(c.amount) - paid;
    if (rem > 0.01) {
      list.push({
        source: 'cheque', id: 'chq_ret_' + c.id,
        type: 'danger', icon: 'undo',
        title: 'Returned cheque unpaid',
        desc: 'Cheque #' + c.number + ' (' + (c.payee || '-') + ') — ' + F(rem),
        target: 'returned'
      });
    }
  });

  // In-hand for > 30 days
  cheques.filter(c => c.status === 'in-hand').forEach(c => {
    const days = Math.abs(daysBetween(c.date, T()));
    if (days > 30) {
      list.push({
        source: 'cheque', id: 'chq_inh_' + c.id,
        type: 'warning', icon: 'clock',
        title: 'In-hand ' + days + ' days',
        desc: 'Cheque #' + c.number + ' (' + (c.payee || '-') + ') — ' + F(c.amount),
        target: 'in-hand'
      });
    }
  });

  /* ── 2. Finance plans ── */
  const FIN = window.FIN || {};
  const plans = FIN.plans || [];
  const payments = FIN.payments || [];
  const deductions = FIN.deductions || [];

  plans.filter(p => p.status === 'active').forEach(p => {
    // Overdue for cleared payment
    const cleared = payments
      .filter(x => x.planId === p.id && x.status !== 'bounced' && x.status !== 'pending')
      .sort((a,b) => new Date(b.effectiveDate || b.date) - new Date(a.effectiveDate || a.date));
    const last = cleared[0];
    const lastDate = last ? new Date(last.effectiveDate || last.date) : new Date(p.startDate);
    const days = daysBetween(lastDate, T());
    const expected = N(p.expectedInterval) || 30;

    if (days > expected) {
      list.push({
        source: 'finance', id: 'fin_over_' + p.id,
        type: 'danger', icon: 'exclamation-triangle',
        title: 'Payment overdue',
        desc: 'No cleared payment on "' + p.vehicle + '" for ' + days + ' days',
        planId: p.id,
        target: 'finance-plan-detail'
      });
    }

    // Pending commission
    if (N(p.pendingCommission) > 0.001) {
      list.push({
        source: 'finance', id: 'fin_pend_' + p.id,
        type: 'warning', icon: 'exclamation-circle',
        title: 'Pending commission',
        desc: F(p.pendingCommission) + ' on "' + p.vehicle + '"',
        planId: p.id,
        target: 'finance-plan-detail'
      });
    }

    // Nearly complete (90-99%)
    const pct = N(p.capitalStart) > 0 ? ((N(p.capitalStart) - N(p.capitalCurrent)) / N(p.capitalStart) * 100) : 0;
    if (pct >= 90 && pct < 100) {
      list.push({
        source: 'finance', id: 'fin_near_' + p.id,
        type: 'success', icon: 'flag-checkered',
        title: 'Plan nearly complete',
        desc: '"' + p.vehicle + '" is ' + pct.toFixed(1) + '% paid',
        planId: p.id,
        target: 'finance-plan-detail'
      });
    }
  });

  // Pending cheques with date approaching
  payments.filter(c => c.method === 'cheque' && c.status === 'pending').forEach(c => {
    const pl = plans.find(x => x.id === c.planId);
    const days = daysBetween(T(), c.effectiveDate || c.date);
    if (days <= 1 && days >= 0) {
      list.push({
        source: 'finance', id: 'fin_chq_' + c.id,
        type: 'warning', icon: 'money-check',
        title: 'Cheque date approaching',
        desc: '#' + c.chequeNo + ' on "' + (pl ? pl.vehicle : '—') + '"',
        planId: c.planId,
        target: 'finance-plan-detail'
      });
    } else if (days < 0) {
      list.push({
        source: 'finance', id: 'fin_chqo_' + c.id,
        type: 'danger', icon: 'exclamation-triangle',
        title: 'Cheque date passed',
        desc: '#' + c.chequeNo + ' on "' + (pl ? pl.vehicle : '—') + '" — mark cleared or bounced',
        planId: c.planId,
        target: 'finance-plan-detail'
      });
    }
  });

  // Deductions overdue or due soon
  deductions.forEach(d => {
    const paid = (d.directPayments || []).reduce((s,p) => s + N(p.amount), 0)
               + (d.mainDeductions || []).reduce((s,m) => s + N(m.amount), 0);
    const rem = Math.max(0, N(d.amount) - paid);
    if (rem <= 0.001) return;

    const pl = plans.find(x => x.id === d.planId);
    const days = daysBetween(T(), d.dueDate);

    if (days < 0) {
      list.push({
        source: 'finance', id: 'fin_ded_' + d.id,
        type: 'danger', icon: 'exclamation-triangle',
        title: 'Deduction ' + Math.abs(days) + 'd overdue',
        desc: d.label + ' (' + F(rem) + ') on "' + (pl ? pl.vehicle : '—') + '"',
        planId: d.planId,
        target: 'finance-plan-detail'
      });
    } else if (days <= 3) {
      list.push({
        source: 'finance', id: 'fin_dedsoon_' + d.id,
        type: 'warning', icon: 'clock',
        title: days === 0 ? 'Deduction due TODAY' : 'Deduction due in ' + days + 'd',
        desc: d.label + ' (' + F(rem) + ')',
        planId: d.planId,
        target: 'finance-plan-detail'
      });
    }
  });

  /* ── 3. Banks ── */
  const banks = NC.data.bankAccounts || [];
  banks.forEach(b => {
    if (N(b.currentBalance) < 0) {
      list.push({
        source: 'finance', id: 'bank_neg_' + b.id,
        type: 'warning', icon: 'university',
        title: 'Negative bank balance',
        desc: (b.bankName || b.name || 'Bank') + ' — ' + F(b.currentBalance),
        target: 'biz-banks'
      });
    }
  });

  /* ── 4. Sources ── */
  const sources = NC.data.ncMoneySources || [];
  sources.filter(s => s.type === 'loan').forEach(s => {
    const o = N(s.amount) - N(s.repaidTotal);
    if (o > 0 && s.endDate && new Date(s.endDate) < new Date()) {
      list.push({
        source: 'finance', id: 'src_over_' + s.id,
        type: 'danger', icon: 'hand-holding-usd',
        title: 'Overdue loan — ' + (s.party || ''),
        desc: 'Outstanding ' + F(o) + ' · Due ' + dfmt(s.endDate),
        target: 'biz-sources'
      });
    }
  });

  return list;
}

/* ══════════════════════════════════════════════════════
   RENDER PANEL
   ══════════════════════════════════════════════════════ */
function refreshBell() {
  BELL.notifications = computeNotifications();
  updateBadge();
  renderPanel();
}

function updateBadge() {
  const dot = $('ncBellDot');
  if (!dot) return;
  const count = BELL.notifications.length;
  if (count > 0) {
    dot.style.display = 'flex';
    dot.textContent = count > 99 ? '99+' : count;
  } else {
    dot.style.display = 'none';
  }
}

function renderPanel() {
  const host = $('ncBellList');
  if (!host) return;
  const list = BELL.notifications;
  const title = $('ncBellPanelTitle');
  if (title) title.textContent = list.length > 0
    ? 'Notifications (' + list.length + ')'
    : 'Notifications';

  if (list.length === 0) {
    host.innerHTML =
      '<div style="text-align:center;padding:40px 20px;color:var(--gray)">' +
        '<i class="fas fa-bell-slash" style="font-size:44px;opacity:.3;display:block;margin-bottom:12px"></i>' +
        '<h3 style="color:var(--dark);font-size:15px;margin-bottom:6px">All clear</h3>' +
        '<p style="font-size:12px">No alerts at the moment</p>' +
      '</div>';
    return;
  }

  // Sort by severity: danger > warning > success
  const order = { danger: 0, warning: 1, success: 2 };
  list.sort((a,b) => (order[a.type] ?? 9) - (order[b.type] ?? 9));

  host.innerHTML = list.map((n, i) => {
    const colors = {
      danger:  { bg:'#fee2e2', fg:'#b91c1c', border:'#ef4444' },
      warning: { bg:'#fef3c7', fg:'#b45309', border:'#f59e0b' },
      success: { bg:'#d1fae5', fg:'#065f46', border:'#10b981' }
    };
    const c = colors[n.type] || colors.warning;
    const srcLabel = n.source === 'finance' ? 'Finance' : 'Cheque';
    const srcColor = n.source === 'finance' ? '#4338ca' : '#0e7490';
    const srcBg    = n.source === 'finance' ? '#e0e7ff' : '#cffafe';

    return '<div class="nc-bell-item" data-i="' + i + '" style="padding:14px;border-radius:10px;margin-bottom:4px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:.2s;border-left:4px solid ' + c.border + ';background:linear-gradient(90deg,' + c.bg + '55,transparent)">' +
      '<div style="width:36px;height:36px;border-radius:10px;background:' + c.bg + ';color:' + c.fg + ';display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">' +
        '<i class="fas fa-' + n.icon + '"></i>' +
      '</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-size:9px;padding:2px 7px;border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:' + srcBg + ';color:' + srcColor + '">' + srcLabel + '</span>' +
          E(n.title) +
        '</div>' +
        '<div style="font-size:12px;color:var(--gray);line-height:1.5">' + E(n.desc) + '</div>' +
      '</div>' +
      '<i class="fas fa-chevron-right" style="color:var(--gray);font-size:11px;margin-top:11px"></i>' +
    '</div>';
  }).join('');

  // Wire clicks
  host.querySelectorAll('.nc-bell-item').forEach(el => {
    el.onmouseover = () => el.style.background = 'var(--light)';
    el.onmouseout = () => el.style.background = '';
    el.onclick = () => {
      const n = list[parseInt(el.dataset.i)];
      closePanel();
      handleNotificationClick(n);
    };
  });
}

/* ══════════════════════════════════════════════════════
   HANDLE CLICK — navigate to target view
   ══════════════════════════════════════════════════════ */
function handleNotificationClick(n) {
  if (!n) return;
  if (n.target === 'finance-plan-detail' && n.planId) {
    if (window.FIN && typeof FIN.openPlanDetail === 'function') {
      FIN.openPlanDetail(n.planId);
      return;
    }
  }
  if (n.target) {
    NC.navigate(n.target);
  }
}

/* ══════════════════════════════════════════════════════

function shadeColor(hex, percent) {
  hex = String(hex || '#6366f1').replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const num = parseInt(hex, 16);
  const amt = Math.round(2.55 * percent);
  let r = (num >> 16) + amt;
  let g = ((num >> 8) & 0x00FF) + amt;
  let b = (num & 0x0000FF) + amt;
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

ST.debounce = function (key, scope, value, isNum) {
  const k = scope + '_' + key;
  clearTimeout(ST.saveTimers[k]);
  ST.saveTimers[k] = setTimeout(() => {
    const v = isNum ? N(value) : value;
    if (scope === 'main') setMain(key, v);
    else setUser(key, v);
  }, 400);
};

ST.onChange = function (key, scope, value, isNum) {
  const v = isNum ? N(value) : value;
  if (scope === 'main') setMain(key, v);
  else setUser(key, v);
};

ST.onToggle = function (key, scope, checked) {
  if (scope === 'main') setMain(key, checked, { showToast:true });
  else setUser(key, checked);
};

ST.onColor = function (key, scope, value) {
  if (scope === 'main') setMain(key, value);
  else setUser(key, value);

  if (key === 'primaryColor' || key === 'accentOverride') applyTheme();
};

/* Alias used internally so we don't collide with Part 9's renderUsersView */
function renderUsersView2() {
  const root = $('stRoot');
  if (!root) return;

  const q = ST.searchQuery;

  /* Sidebar nav HTML */
  let navHTML = '<input type="text" class="st-nav-search" id="stNavSearch" placeholder="🔍  Search settings…" value="' + E(q) + '" oninput="SETTINGS.search(this.value)">';
  SECTIONS.forEach(g => {
    const filteredItems = g.items.filter(it => !q || it.label.toLowerCase().includes(q));
    if (filteredItems.length === 0) return;
    navHTML += '<div class="st-nav-group-title">' + E(g.group) + '</div>';
    filteredItems.forEach(it => {
      const active = ST.activeSection === it.id && !q;
      navHTML += '<div class="st-nav-item ' + (active ? 'active' : '') + '" onclick="SETTINGS.setSection(\'' + it.id + '\')">' +
        '<i class="fas fa-' + it.icon + '"></i><span>' + E(it.label) + '</span>' +
      '</div>';
    });
  });

  /* Active section content */
  let sectionHTML = '';
  let sectionTitle = '';
  let sectionDesc = '';

  const current = SECTIONS.flatMap(g => g.items).find(it => it.id === ST.activeSection);

  if (q) {
    sectionTitle = 'Search results';
    sectionDesc = 'Showing settings matching "' + E(q) + '"';
    // Just show the current section anyway (simplified)
  } else if (current) {
    sectionTitle = current.label;
    sectionDesc = SECTION_DESCRIPTIONS[current.id] || '';
  }

  switch (ST.activeSection) {
    case 'profile':       sectionHTML = sectionProfile(); break;
    case 'security':      sectionHTML = sectionSecurity(); break;
    case 'company':       sectionHTML = sectionCompany(); break;
    case 'appearance':    sectionHTML = sectionAppearance(); break;
    case 'categories':    sectionHTML = sectionCategories(); break;
    case 'banks':         sectionHTML = sectionBanks(); break;
    case 'customFields':  sectionHTML = sectionCustomFields(); break;
    case 'escalation':    sectionHTML = sectionEscalation(); break;
    case 'notifications': sectionHTML = sectionNotifications(); break;
    case 'integrations':  sectionHTML = sectionIntegrations(); break;
    case 'data':          sectionHTML = sectionDataBackup(); break;
    case 'shortcuts':     sectionHTML = sectionShortcuts(); break;
    case 'about':         sectionHTML = sectionAbout(); break;
    case 'danger':        sectionHTML = sectionDanger(); break;
    default:              sectionHTML = sectionProfile();
  }

  root.innerHTML =
    '<div class="st-layout">' +
      '<div class="st-nav">' + navHTML + '</div>' +
      '<div class="st-content">' +

ST.recalcBanks = async function () {
  if (!await NC.confirm('Recalculate all bank balances from their transactions?', { confirmLabel:'Recalculate' })) return;
  const banks = NC.data.bankAccounts || [];
  const txns = NC.data.bankTransactions || [];
  for (const b of banks) {
    const opening = N(b.openingBalance) || N(b.currentBalance) || 0;
    let bal = 0;
    txns.filter(t => t.bankAccountId === b.id).forEach(t => {
      bal += t.type === 'credit' ? N(t.amount) : -N(t.amount);
    });
    // Store whatever was there as opening, then add txn net
    const newBal = (N(b.openingBalance) || 0) + bal;
    await db.collection('bankAccounts').doc(b.id).update({ currentBalance: newBal, updatedAt: NC.ts() });
  }
  NC.invalidate('bankAccounts');
  NC.data.bankAccounts = await NC.load('bankAccounts', { fresh:true });
  NC.toast('Bank balances recalculated', 'success');
  renderUsersView2();
};

/* ── Data / Backup ── */
ST.exportAll = async function () {
  NC.toast('Preparing backup…', 'info');
  const cols = ['cheques','chequeCategories','chequeBooks','loans','projects','parties','ncMoneySources','ncDeployments','ncShopPayments','ncCashLedger','ncCashTransfers','bankAccounts','bankTransactions','inPayments','outPayments','finance_plans','finance_payments','finance_deductions','users','ncSettings'];
  const backup = { _meta: { version: '6.0', exportedAt: NC.nowISO(), exportedBy: (NC.state.user||{}).email || 'system' } };
  let total = 0;
  for (const col of cols) {
    try {
      const snap = await db.collection(col).get();
      backup[col] = snap.docs.map(d => Object.assign({ _id: d.id }, d.data()));
      total += snap.size;
    } catch (e) { backup[col] = []; }
  }
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'neoncheque-backup-' + T() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  NC.toast('Backup exported (' + total + ' docs)', 'success');
};

ST.importFile = async function (ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  if (!await NC.confirm('Import data from "' + file.name + '"?\n\nExisting documents with the same IDs will be overwritten.', { confirmLabel:'Import' })) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    let imported = 0;
    for (const col of Object.keys(data)) {
      if (col.startsWith('_')) continue;
      const arr = data[col];
      if (!Array.isArray(arr)) continue;
      for (const doc of arr) {
        const id = doc._id;
        const payload = Object.assign({}, doc);
        delete payload._id;
        if (id) await db.collection(col).doc(id).set(payload, { merge:true });
        else await db.collection(col).add(payload);
        imported++;
      }
    }
    NC.toast('Imported ' + imported + ' documents', 'success');
    NC.invalidate();
    // Reload UI
    if (window.CHEQ && CHEQ.refreshIn) { NC.state.allCheques = await NC.load('cheques', { fresh:true }); }
    await loadSettings();
    renderUsersView2();
  } catch (e) { NC.toast('Import failed: ' + e.message, 'error'); }
};

async function updateStorageInfo() {
  const host = $('stStorageInfo');
  if (!host) return;
  const cols = ['cheques','finance_plans','finance_payments','bankTransactions','ncShopPayments','inPayments','outPayments','ncCashLedger','ncMoneySources','ncDeployments','projects','loans','parties','users'];
  const rows = [];
  let grand = 0;
  for (const c of cols) {
    try {
      const countSnap = await db.collection(c).get();
      const n = countSnap.size;
      grand += n;
      rows.push('<div style="display:flex;justify-content:space-between"><span style="color:var(--gray)">' + E(c) + '</span><strong>' + n + '</strong></div>');
    } catch (e) {}
  }
  host.innerHTML = rows.join('') + '<div style="display:flex;justify-content:space-between;padding-top:8px;margin-top:8px;border-top:2px solid var(--border)"><span><strong>Total Documents</strong></span><strong>' + grand + '</strong></div>';
  const badge = $('stCollCount');
  if (badge) badge.textContent = grand + ' docs';
}

  if (!await NC.confirm('Permanently delete ' + deleted.length + ' cheque(s)?\n\nThis cannot be undone.', { danger:true, confirmLabel:'Permanently Delete' })) return;

  NC.state.allCheques = await NC.load('cheques', { orderBy:{field:'createdAt',dir:'desc'}, fresh:true });

  renderUsersView2();
};

    return FIN.purgeAll();
