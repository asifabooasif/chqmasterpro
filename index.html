   ══════════════════════════════════════════════════════ */
CHEQ.openBulkStatus = function (ctx) {
  ctx = ctx || 'all';
  let list = [];
  if (ctx === 'all') {
    if (S.sel.size === 0) return NC.toast('Select cheques first', 'error');
    list = S.filtered.filter(c => S.sel.has(c.id));
  } else if (ctx === 'in-hand') {
    if (S.inHandSel.size === 0) return NC.toast('Select cheques first', 'error');
    list = activeCheques().filter(c => c.status === 'in-hand' && S.inHandSel.has(c.id));
  }
  S.bulkCtx = ctx;

  NC.modal({
    id:'chqBulkStatusModal',
    title:'Bulk Change Status',
    width:640,
    bodyHTML:
      '<div style="background:var(--light);padding:12px;border-radius:8px;margin-bottom:14px">' +
        '<div style="font-weight:700;font-size:13px;margin-bottom:6px">' + list.length + ' cheque(s) selected</div>' +
        '<div style="font-size:12px;color:var(--gray);max-height:100px;overflow-y:auto">' +
          list.map(c => '#' + E(c.number) + ' — ' + E(c.payee) + ' (' + F(c.amount) + ')').join('<br>') +
        '</div>' +
      '</div>' +
      '<div class="form-group"><label>New Status *</label>' +
        '<select id="chqBulkNewStatus" onchange="CHEQ.renderBulkStatusFields()">' +
          '<option value="">-- Select --</option>' +
          ['in-hand','issued','deposited','cleared','returned','stopped','draft'].map(s => '<option value="' + s + '">' + s.replace('-',' ') + '</option>').join('') +
        '</select></div>' +
      '<div id="chqBulkStatusFields"></div>' +
      '<div class="form-group"><label>Remarks</label><textarea id="chqBulkRemarks" rows="2"></textarea></div>',
    hideSave:true
  });

  const footer = $('chqBulkStatusModal').querySelector('.modal-footer');
  footer.innerHTML =
    '<button class="btn btn-secondary" onclick="NC.closeModal(\'chqBulkStatusModal\')">Cancel</button>' +
    '<button class="btn btn-primary" id="chqBulkStatusSave"><i class="fas fa-check"></i> Apply to All</button>';

  $('chqBulkStatusSave').onclick = async () => {
    const newStatus = $('chqBulkNewStatus').value;
    if (!newStatus) return NC.toast('Select a status', 'error');
    const cfg = STATUS_FIELDS[newStatus] || [];
    const fieldData = {};
    for (const f of cfg) {
      const el = $('chqbfld_' + f.id);
      if (f.required && (!el || !el.value)) return NC.toast('Required: ' + f.label, 'error');
      if (el && el.value) fieldData[f.id] = el.value;
    }
    const remarks = $('chqBulkRemarks').value.trim();

    try {
      for (const c of list) {
        const update = { status:newStatus, updatedAt: NC.ts() };
        Object.assign(update, fieldData);
        if (newStatus === 'returned') {
          update.returnDetails = { status:'returned', reason:fieldData.returnReason, date:fieldData.returnDate, charges:N(fieldData.bankCharges), notes:remarks };
        }
        update.history = NC.au({
          action:'Bulk ' + newStatus.replace('-',' '),
          details:'Bulk status → ' + newStatus + '. ' + Object.keys(fieldData).map(k => k + ':' + fieldData[k]).join(', ') + (remarks ? ' | ' + remarks : ''),
          timestamp: NC.nowISO(),
          user: NC.state.user ? NC.state.user.email : 'system',
          previousStatus: c.status
        });
        await db.collection('cheques').doc(c.id).update(update);
      }
      NC.toast(list.length + ' cheque(s) updated', 'success');
      if (ctx === 'all') S.sel.clear();
      else S.inHandSel.clear();
      NC.closeModal('chqBulkStatusModal');
      await reloadCheques();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  };
};

CHEQ.renderBulkStatusFields = function () {
  const st = $('chqBulkNewStatus').value;
  const cfg = STATUS_FIELDS[st] || [];
  $('chqBulkStatusFields').innerHTML = cfg.map(f => {
    let input;
    if (f.type === 'select') {
      input = '<select id="chqbfld_' + f.id + '"><option value="">Select…</option>' +
        f.options.map(o => '<option value="' + E(o) + '">' + E(o) + '</option>').join('') + '</select>';
    } else if (f.type === 'textarea') {
      input = '<textarea id="chqbfld_' + f.id + '" rows="2"></textarea>';
    } else {
      input = '<input type="' + f.type + '" id="chqbfld_' + f.id + '">';
    }
    return '<div class="form-group"><label>' + E(f.label) + (f.required ? ' *' : '') + '</label>' + input + '</div>';
  }).join('');
};

CHEQ.bulkExport = function () {
  if (S.sel.size === 0) return NC.toast('Select cheques first', 'error');
  const list = activeCheques().filter(c => S.sel.has(c.id));
  let csv = 'Number,Payee,Category,Amount,Bank,Date,Status\n';
  list.forEach(c => {
    csv += [c.number, '"' + (c.payee || '') + '"', '"' + (c.category || '') + '"', c.amount, '"' + (c.bank || '') + '"', c.date, c.status].join(',') + '\n';
  });
  downloadBlob(csv, 'cheques_' + T() + '.csv', 'text/csv');
  NC.toast('Exported ' + list.length + ' cheque(s)', 'success');
};

CHEQ.bulkDelete = async function () {
  if (S.sel.size === 0) return NC.toast('Select cheques first', 'error');
  if (!await NC.confirm('Delete ' + S.sel.size + ' cheque(s)?', { danger:true })) return;
  for (const id of S.sel) {
    await db.collection('cheques').doc(id).update({ deletedAt: NC.ts() });
  }
  NC.toast(S.sel.size + ' moved to Recycle Bin', 'info');
  S.sel.clear();
  await reloadCheques();

          categories().map(c => '<option value="' + E(c.name) + '">' + E(c.name) + '</option>').join('') +
        '</select></div>' +
      '<div class="form-group"><label>Apply To</label>' +
        '<select id="chqBulkCatScope" onchange="CHEQ.updateBulkCatPreview()">' +
          '<option value="uncat">Only Uncategorized</option>' +
          '<option value="all">All Cheques (overwrite)</option>' +
          '<option value="in-hand">Only In-Hand</option>' +
          '<option value="issued">Only Issued</option>' +
          '<option value="returned">Only Returned</option>' +
          '<option value="cleared">Only Cleared</option>' +
        '</select></div>' +
      '<div id="chqBulkCatPreview" style="background:var(--light);padding:14px;border-radius:10px"></div>',
    hideSave:true
  });
  const footer = $('chqBulkCatModal').querySelector('.modal-footer');
  footer.innerHTML =
    '<button class="btn btn-secondary" onclick="NC.closeModal(\'chqBulkCatModal\')">Cancel</button>' +
    '<button class="btn btn-primary" id="chqBulkCatSave"><i class="fas fa-tags"></i> Apply</button>';

  CHEQ.updateBulkCatPreview();

  $('chqBulkCatSave').onclick = async () => {
    const cat = $('chqBulkCatName').value;
    if (!cat) return NC.toast('Select a category', 'error');
    const scope = $('chqBulkCatScope').value;
    let list = activeCheques();
    if (scope === 'uncat')    list = list.filter(c => !c.category);
    else if (scope !== 'all') list = list.filter(c => c.status === scope);
    if (!list.length) return NC.toast('No matching cheques', 'info');
    if (!await NC.confirm('Assign "' + cat + '" to ' + list.length + ' cheque(s)?')) return;
    for (const c of list) {
      await db.collection('cheques').doc(c.id).update({ category: cat });
    }
    NC.toast('Categorized ' + list.length + ' cheque(s)', 'success');
    NC.closeModal('chqBulkCatModal');
    await reloadCheques();
  };
};

CHEQ.updateBulkCatPreview = function () {
  const scope = $('chqBulkCatScope').value;
  let list = activeCheques();
  if (scope === 'uncat')    list = list.filter(c => !c.category);
  else if (scope !== 'all') list = list.filter(c => c.status === scope);
  const total = list.reduce((s,c) => s + N(c.amount), 0);
  $('chqBulkCatPreview').innerHTML =
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Cheques matched:</span><strong>' + list.length + '</strong></div>' +
    '<div style="display:flex;justify-content:space-between"><span>Total value:</span><strong>' + F(total) + '</strong></div>';
};

/* ══════════════════════════════════════════════════════
   REPORT RUN + EXPORT
   ══════════════════════════════════════════════════════ */
CHEQ.runReport = function () {
  const from = ($('rptFrom') || {}).value || '';
  const to   = ($('rptTo') || {}).value || '';
  const st   = ($('rptStatus') || {}).value || '';
  const bk   = ($('rptBank') || {}).value || '';
  let list = activeCheques();
  if (from) list = list.filter(c => c.date >= from);
  if (to)   list = list.filter(c => c.date <= to);
  if (st)   list = list.filter(c => c.status === st);
  if (bk)   list = list.filter(c => c.bank === bk);

  const tbody = $('rptTbody');
  if (!tbody) return;
  tbody.innerHTML = list.map(c => {
    const days = Math.floor((Date.now() - new Date(c.date).getTime()) / 86400000);
    return '<tr>' +
      '<td><strong>' + E(c.number) + '</strong></td>' +
      '<td>' + E(c.payee) + '</td>' +
      '<td>' + E(c.issuedTo || '-') + '</td>' +
      '<td>' + F(c.amount) + '</td>' +
      '<td>' + E(c.bank) + '</td>' +
      '<td>' + dfmt(c.date) + '</td>' +
      '<td><span class="status-badge status-' + c.status + '">' + c.status + '</span></td>' +
      '<td>' + days + ' days</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--gray);padding:20px">No matches</td></tr>';
  NC.toast('Report: ' + list.length + ' cheques', 'success');
};

CHEQ.exportReport = function (fmt) {
  const from = ($('rptFrom') || {}).value || '';
  const to   = ($('rptTo') || {}).value || '';
  const st   = ($('rptStatus') || {}).value || '';
  const bk   = ($('rptBank') || {}).value || '';
  let list = activeCheques();
  if (from) list = list.filter(c => c.date >= from);
  if (to)   list = list.filter(c => c.date <= to);
  if (st)   list = list.filter(c => c.status === st);
  if (bk)   list = list.filter(c => c.bank === bk);
  if (!list.length) return NC.toast('No data to export', 'warning');

  if (fmt === 'csv') {
    let csv = 'Number,Payee,IssuedTo,Amount,Bank,Date,Status\n';
    list.forEach(c => { csv += [c.number, '"' + (c.payee||'') + '"', '"' + (c.issuedTo||'') + '"', c.amount, '"' + (c.bank||'') + '"', c.date, c.status].join(',') + '\n'; });
    downloadBlob(csv, 'report_' + T() + '.csv', 'text/csv');
    NC.toast('CSV exported', 'success');
  } else if (fmt === 'excel') {
    let html = '<table border="1"><thead><tr><th>Number</th><th>Payee</th><th>IssuedTo</th><th>Amount</th><th>Bank</th><th>Date</th><th>Status</th></tr></thead><tbody>';
    list.forEach(c => { html += '<tr><td>' + E(c.number) + '</td><td>' + E(c.payee) + '</td><td>' + E(c.issuedTo||'') + '</td><td>' + c.amount + '</td><td>' + E(c.bank) + '</td><td>' + c.date + '</td><td>' + c.status + '</td></tr>'; });
    html += '</tbody></table>';
    downloadBlob(html, 'report_' + T() + '.xls', 'application/vnd.ms-excel');
    NC.toast('Excel exported', 'success');
  } else if (fmt === 'pdf') {
    const w = window.open('', '_blank');
    if (!w) return NC.toast('Allow popups to export PDF', 'error');
    let html = '<html><head><title>Report</title><style>body{font-family:Arial;padding:20px}h1{color:#6366f1}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px}th{background:#6366f1;color:white}</style></head><body>';
    html += '<h1>Cheque Report</h1><p>' + new Date().toLocaleString() + ' · ' + list.length + ' records</p>';
    html += '<table><thead><tr><th>#</th><th>Payee</th><th>Issued To</th><th>Amount</th><th>Bank</th><th>Date</th><th>Status</th></tr></thead><tbody>';
    list.forEach(c => { html += '<tr><td>' + E(c.number) + '</td><td>' + E(c.payee) + '</td><td>' + E(c.issuedTo||'') + '</td><td>' + F(c.amount) + '</td><td>' + E(c.bank) + '</td><td>' + dfmt(c.date) + '</td><td>' + c.status + '</td></tr>'; });
    html += '</tbody></table></body></html>';
    w.document.write(html); w.document.close();
    setTimeout(() => w.print(), 500);
    NC.toast('PDF ready for print', 'success');
  }
};

function downloadBlob(content, filename, mime) {
  const blob = new Blob(['\uFEFF' + content], { type: mime + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

<!-- ══════════════════════════════════════════════════════
     PART 3 — CHEQUE CATEGORIES
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modCategories) return;
window.__modCategories = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function cats()  { return NC.state.categories || []; }
function cheques() { return (NC.state.allCheques || []).filter(c => !c.deletedAt); }

function catColor(name) {
  const c = cats().find(x => x.name === name);
  return (c && c.color) || '#6366f1';
}
function isPersonalCat(name) {
  const c = cats().find(x => x.name === name);
  return !!(c && c.personal);
}

/* ══════════════════════════════════════════════════════
   REFRESH HELPERS — notify other views
   ══════════════════════════════════════════════════════ */
async function reloadCategoriesEverywhere() {
  NC.invalidate('chequeCategories');
  const list = await NC.load('chequeCategories', { fresh:true });
  NC.state.categories = list;
  NC.emit('categories:changed', { count: list.length });

  // Auto-refresh currently active view if it uses categories
  const activeId = NC.state.activeView;
  const view = activeId ? NC.views[activeId] : null;
  if (view && typeof view.render === 'function') {
    const el = $(activeId);
    if (el) {
      try { view.render(el); }
      catch (e) { console.error('[categories refresh]', e); }
    }
  }

  // Also refresh sidebar chip counts in All Cheques if that view exists in the DOM
  if (typeof CHEQ !== 'undefined' && CHEQ && typeof CHEQ.refreshInHand === 'function') {
    // no-op — All Cheques render already calls renderCatChips
  }
}

/* ══════════════════════════════════════════════════════
   VIEW: CHEQUE CATEGORIES
   ══════════════════════════════════════════════════════ */
function renderCategoriesView(el) {
  const list = cats();
  const activeChqs = cheques();

  // Precompute stats per category
  const stats = {};
  activeChqs.forEach(c => {
    const key = c.category || '__UNC__';
    if (!stats[key]) stats[key] = { count:0, total:0 };
    stats[key].count++;
    stats[key].total += N(c.amount);
  });
  const uncatCount = stats.__UNC__ ? stats.__UNC__.count : 0;
  const uncatTotal = stats.__UNC__ ? stats.__UNC__.total : 0;

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-tags" style="color:var(--primary);margin-right:8px"></i>Cheque Categories</h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary btn-sm" onclick="CHEQ.bulkCategorize()"><i class="fas fa-layer-group"></i> Bulk Assign</button>' +
        '<button class="btn btn-primary btn-sm" onclick="CATS.openAdd()"><i class="fas fa-plus"></i> New Category</button>' +
      '</div>' +
    '</div>' +

    /* Summary strip */
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px">' +
      '<div style="background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px">Total Categories</div>' +
        '<div style="font-size:28px;font-weight:800;margin-top:6px">' + list.length + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">' + list.filter(c => c.personal).length + ' personal · ' + list.filter(c => !c.personal).length + ' business</div>' +
      '</div>' +
      '<div style="background:linear-gradient(135deg,#06b6d4,#0891b2);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px">Categorized Cheques</div>' +
        '<div style="font-size:28px;font-weight:800;margin-top:6px">' + (activeChqs.length - uncatCount) + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">of ' + activeChqs.length + ' total</div>' +
      '</div>' +
      '<div style="background:linear-gradient(135deg,#94a3b8,#64748b);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px">Uncategorized</div>' +
        '<div style="font-size:28px;font-weight:800;margin-top:6px">' + uncatCount + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">' + F(uncatTotal) + ' total value</div>' +
      '</div>' +
    '</div>' +

    /* Categories table */
    (list.length === 0
      ? '<div class="empty-state"><i class="fas fa-tags"></i><h3>No categories yet</h3>' +
        '<p style="margin-top:8px">Create categories to organize your cheques (e.g. BTC, SHOE, Imported)</p>' +
        '<button class="btn btn-primary" style="margin-top:16px" onclick="CATS.openAdd()"><i class="fas fa-plus"></i> Create First Category</button></div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>Category</th><th>Description</th><th>Type</th><th>Cheques</th><th>Total Value</th><th>Actions</th>' +
        '</tr></thead><tbody>' +
        list.slice().sort((a,b) => {
          const sa = stats[a.name] || {count:0}, sb = stats[b.name] || {count:0};
          return sb.count - sa.count;
        }).map(c => {
          const s = stats[c.name] || { count:0, total:0 };
          const color = c.color || '#6366f1';
          const personal = c.personal === true;
          return '<tr>' +
            '<td>' +
              '<div style="display:flex;align-items:center;gap:10px">' +
                '<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:' + E(color) + ';flex-shrink:0"></span>' +
                '<strong style="font-size:14px">' + E(c.name) + '</strong>' +
              '</div>' +
            '</td>' +
            '<td style="color:var(--gray);font-size:13px">' + E(c.description || '—') + '</td>' +
            '<td>' +
              (personal
                ? '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:800;background:#dc2626;color:white;letter-spacing:.5px">PERSONAL</span>'
                : '<span style="display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:800;background:#e2e8f0;color:#64748b;letter-spacing:.5px">BUSINESS</span>') +
            '</td>' +
            '<td>' +
              '<div style="font-weight:700">' + s.count + '</div>' +
              '<div style="background:var(--border);height:4px;border-radius:2px;margin-top:4px;overflow:hidden;width:80px">' +
                '<div style="height:100%;width:' + Math.min(100, (s.count / Math.max(1, activeChqs.length)) * 100) + '%;background:' + color + '"></div>' +
              '</div>' +
            '</td>' +
            '<td style="font-weight:800;color:' + color + '">' + F(s.total) + '</td>' +
            '<td>' +
              '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
                '<button class="btn btn-xs btn-primary" onclick="CATS.viewCheques(\'' + E(c.name).replace(/'/g, "\\'") + '\')" title="View cheques"><i class="fas fa-eye"></i></button>' +
                '<button class="btn btn-xs btn-secondary" onclick="CATS.openEdit(\'' + c.id + '\')" title="Edit"><i class="fas fa-edit"></i></button>' +
                '<button class="btn btn-xs btn-secondary" onclick="CATS.togglePersonal(\'' + c.id + '\')" title="Toggle personal/business"><i class="fas fa-user-secret"></i></button>' +
                '<button class="btn btn-xs btn-danger" onclick="CATS.remove(\'' + c.id + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +

        }).join('') +
      '</tbody></table></div>'
    ) +

    (uncatCount > 0
      ? '<div style="margin-top:18px;background:#fffbeb;border:1.5px solid #f59e0b;border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
          '<i class="fas fa-exclamation-triangle" style="color:#b45309;font-size:18px"></i>' +
          '<div style="flex:1;font-size:13px;color:#92400e">' +
            '<strong>' + uncatCount + ' cheque(s)</strong> are uncategorized (' + F(uncatTotal) + ' total).' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" onclick="CHEQ.bulkCategorize()"><i class="fas fa-tags"></i> Assign Now</button>' +
        '</div>'
      : '') +
  '</div>';
}

/* ══════════════════════════════════════════════════════
   PUBLIC API
   ══════════════════════════════════════════════════════ */
const CATS = window.CATS = {};

/* ── Add category ── */
CATS.openAdd = function () {
  NC.modal({
    id:'catAddModal',
    title:'New Cheque Category',
    width:520,
    fields: [
      { id:'name',        label:'Name',           type:'text', required:true, hint:'e.g. BTC, SHOE, Imported Received' },
      { id:'description', label:'Description',    type:'text' },
      { id:'color',       label:'Color',          type:'color', value:'#6366f1' },
      { id:'personal',    label:'Personal Use?',  type:'select', options:[
        { value:'', label:'Business (default)' },
        { value:'1', label:'Personal — triggers warning on issuance' }
      ], value:'' }
    ],
    onSave: async d => {
      const name = String(d.name || '').trim();
      if (!name) throw new Error('Name is required');
      if (cats().some(c => String(c.name).toLowerCase() === name.toLowerCase())) {
        throw new Error('Category "' + name + '" already exists');
      }
      await NC.save('chequeCategories', {
        name,
        description: d.description || '',
        color: d.color || '#6366f1',
        personal: d.personal === '1'
      });
      NC.toast('Category created', 'success');
      await reloadCategoriesEverywhere();
    }
  });
};

/* ── Edit category ── */
CATS.openEdit = function (id) {
  const c = cats().find(x => x.id === id);
  if (!c) return;
  NC.modal({
    id:'catEditModal',
    title:'Edit Category — ' + c.name,
    width:520,
    fields: [
      { id:'name',        label:'Name',        type:'text', required:true, value:c.name },
      { id:'description', label:'Description', type:'text', value:c.description || '' },
      { id:'color',       label:'Color',       type:'color', value:c.color || '#6366f1' },
      { id:'personal',    label:'Personal Use?', type:'select', options:[
        { value:'', label:'Business (default)' },
        { value:'1', label:'Personal — triggers warning on issuance' }
      ], value: c.personal ? '1' : '' }
    ],
    onSave: async d => {
      const newName = String(d.name || '').trim();
      if (!newName) throw new Error('Name is required');
      const oldName = c.name;

      // Duplicate name check (excluding self)
      if (cats().some(x => x.id !== id && String(x.name).toLowerCase() === newName.toLowerCase())) {
        throw new Error('Category "' + newName + '" already exists');
      }

      await NC.save('chequeCategories', {
        id,
        name: newName,
        description: d.description || '',
        color: d.color || '#6366f1',
        personal: d.personal === '1'
      });

      // If the name changed, cascade to all cheques using the old name
      if (newName !== oldName) {
        const affected = cheques().filter(x => x.category === oldName);
        if (affected.length > 0) {
          NC.toast('Updating ' + affected.length + ' cheque(s)…', 'info');
          for (const cq of affected) {
            try {
              await db.collection('cheques').doc(cq.id).update({ category: newName });
            } catch (e) { console.warn('[cat rename]', cq.id, e); }
          }
        }
        // Also update any deployments/loans allocations using old name (optional lightweight sweep)
        await renameInOtherCollections(oldName, newName);
        NC.invalidate('cheques');
        NC.state.allCheques = await NC.load('cheques', { orderBy:{field:'createdAt',dir:'desc'}, fresh:true });
      }

      NC.toast('Category updated', 'success');
      await reloadCategoriesEverywhere();
    }
  });
};

/* ── Rename cascades through other collections (best-effort) ── */
async function renameInOtherCollections(oldName, newName) {
  const collections = [
    { col:'ncDeployments',    field:'category' },
    { col:'ncShopPayments',   field:'category' },
    { col:'bankTransactions', field:'category' }
  ];
  for (const { col, field } of collections) {
    try {
      const snap = await db.collection(col).where(field, '==', oldName).get();
      if (snap.empty) continue;
      for (const d of snap.docs) {
        await db.collection(col).doc(d.id).update({ [field]: newName });
      }
    } catch (e) { console.warn('[cat rename] skip ' + col, e.message); }
  }
  // Loans allocations (nested array)
  try {
    const loansSnap = await db.collection('loans').get();
    for (const d of loansSnap.docs) {
      const data = d.data();
      const allocs = data.allocations || [];
      let changed = false;
      const updated = allocs.map(a => {
        if (a.category === oldName) { changed = true; return Object.assign({}, a, { category: newName }); }
        return a;
      });
      if (changed) await db.collection('loans').doc(d.id).update({ allocations: updated });
    }
  } catch (e) { console.warn('[cat rename] loans', e.message); }
}

/* ── Toggle personal ── */
CATS.togglePersonal = async function (id) {
  const c = cats().find(x => x.id === id);
  if (!c) return;
  const next = !c.personal;
  const label = next ? 'PERSONAL' : 'BUSINESS';
  if (!await NC.confirm(
    'Mark "' + c.name + '" as ' + label + '?\n\n' +
    (next
      ? 'Issuing cheques in this category will trigger a harsh confirmation warning.'
      : 'Personal warnings will be removed for this category.'),
    { danger: next, confirmLabel: 'Mark ' + label }
  )) return;

  await NC.save('chequeCategories', { id, personal: next });
  NC.toast('"' + c.name + '" → ' + label, next ? 'warning' : 'success');
  await reloadCategoriesEverywhere();
};

/* ── Delete ── */
CATS.remove = async function (id) {
  const c = cats().find(x => x.id === id);
  if (!c) return;
  const inUse = cheques().filter(x => x.category === c.name).length;
  const msg = 'Delete category "' + c.name + '"?' +
    (inUse > 0
      ? '\n\n⚠ ' + inUse + ' cheque(s) use this category.\nThey will become UNCATEGORIZED (their category field will be cleared).'
      : '');
  if (!await NC.confirm(msg, { danger:true, confirmLabel:'Delete' })) return;

  try {
    // Clear category from affected cheques
    if (inUse > 0) {
      const affected = cheques().filter(x => x.category === c.name);
      NC.toast('Clearing category from ' + affected.length + ' cheque(s)…', 'info');
      for (const cq of affected) {
        try { await db.collection('cheques').doc(cq.id).update({ category: null }); }
        catch (e) { console.warn('[cat delete]', cq.id, e); }
      }
      NC.invalidate('cheques');
      NC.state.allCheques = await NC.load('cheques', { orderBy:{field:'createdAt',dir:'desc'}, fresh:true });
    }
    await NC.remove('chequeCategories', id);
    NC.toast('Category deleted', 'success');
    await reloadCategoriesEverywhere();
  } catch (e) {
    NC.toast('Error: ' + e.message, 'error');
  }
};

/* ── View cheques in category (drill-down) ── */
CATS.viewCheques = function (name) {
  const list = cheques().filter(c => c.category === name);
  const total = list.reduce((s,c) => s + N(c.amount), 0);
  const color = catColor(name);
  const personal = isPersonalCat(name);

  const body =
    '<div style="background:linear-gradient(135deg,' + color + ',' + color + 'dd);color:white;padding:18px;border-radius:12px;margin-bottom:18px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">' +
        '<div>' +
          '<div style="font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px">Category</div>' +
          '<div style="font-size:22px;font-weight:800;margin-top:4px">' + E(name) + '</div>' +
          (personal ? '<div style="display:inline-block;margin-top:6px;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:800;background:rgba(255,255,255,.25);letter-spacing:.5px">PERSONAL</div>' : '') +
        '</div>' +
        '<div style="text-align:right">' +
          '<div style="font-size:11px;opacity:.85">Cheques</div>' +
          '<div style="font-size:28px;font-weight:800">' + list.length + '</div>' +
          '<div style="font-size:12px;opacity:.85;margin-top:2px">' + F(total) + ' total</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    (list.length === 0
      ? '<div class="empty-state"><i class="fas fa-inbox"></i><h3>No cheques in this category</h3></div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>#</th><th>Payee</th><th>Issued To</th><th>Amount</th><th>Bank</th><th>Date</th><th>Status</th>' +
        '</tr></thead><tbody>' +
        list.sort((a,b) => new Date(b.date) - new Date(a.date)).map(c =>
          '<tr>' +
            '<td><strong>' + E(c.number) + '</strong></td>' +
            '<td>' + E(c.payee) + '</td>' +
            '<td>' + E(c.issuedTo || '-') + '</td>' +
            '<td style="font-weight:700">' + F(c.amount) + '</td>' +
            '<td>' + E(c.bank) + '</td>' +
            '<td>' + NC.dateFmt(c.date) + '</td>' +
            '<td><span class="status-badge status-' + c.status + '">' + c.status + '</span></td>' +
          '</tr>'
        ).join('') +
      '</tbody></table></div>');

  NC.modal({
    id:'catDrillModal',
    title:'Cheques in "' + name + '"',
    width:900,
    hideSave:true,
    bodyHTML: body
  });
};

/* ══════════════════════════════════════════════════════
   LISTEN FOR EXTERNAL CATEGORY CHANGES
   ══════════════════════════════════════════════════════ */
NC.on('categories:changed', () => {
  // If categories view is active, re-render
  if (NC.state.activeView === 'cheque-categories') {
    const el = $('cheque-categories');
    if (el) renderCategoriesView(el);
  }
});

/* ══════════════════════════════════════════════════════
   MODULE REGISTRATION
   ══════════════════════════════════════════════════════ */
NC.registerModule('categories', {
  init() {
    // Ensure categories are loaded
    if (NC.state.categories.length === 0) {
      NC.load('chequeCategories', { fresh:true }).then(list => {
        NC.state.categories = list;
        NC.emit('categories:changed', { count: list.length });
      });
    }
    console.log('[Categories module] ✅ Ready — ' + NC.state.categories.length + ' categories');
  },
  views: {
    'cheque-categories': {
      title: 'Cheque Categories',
      tab: 'cheques',
      icon: 'tags',
      order: 5.5,   // between Recycle (5) and Payees (6)
      render: renderCategoriesView
    }

});

console.log('%c[Part 3 — CATEGORIES] ✅ Registered', 'color:#10b981;font-weight:bold');

})();

<!-- ══════════════════════════════════════════════════════
     PART 4 — LOANS (with Multi-Category Allocations)
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modLoans) return;
window.__modLoans = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function loans()    { return NC.state.loans || []; }
function projects() { return (NC.data.projects || NC.state.projects || []); }
function categories() { return NC.state.categories || []; }

function allocTotal(loan) {
  return (loan.allocations || []).reduce((s,a) => s + N(a.amount), 0);
}
function allocUnused(loan) {
  return Math.max(0, N(loan.principal) - allocTotal(loan));
}
function loanPaid(loan) {
  return (loan.payments || []).reduce((s,p) => s + N(p.amount), 0);
}
function loanBalance(loan) {
  return Math.max(0, N(loan.principal) - loanPaid(loan));
}
function catColor(name) {
  const c = categories().find(x => x.name === name);
  return (c && c.color) || '#6366f1';
}

async function reloadLoans() {
  NC.invalidate('loans');
  const list = await NC.load('loans', { fresh:true });
  NC.state.loans = list;
  NC.emit('loans:changed', { count: list.length });

  // Refresh current view if it's the loans view
  if (NC.state.activeView === 'loans') {
    const el = $('loans');
    if (el) renderLoansView(el);
  }
}

async function loadProjectsIfNeeded() {
  if ((NC.data.projects || []).length > 0) return;
  try {
    const list = await NC.load('projects', { fresh:false });
    NC.state.projects = list;
  } catch (e) { console.warn('[loans] projects load skipped', e.message); }
}

/* ══════════════════════════════════════════════════════
   VIEW — LOANS
   ══════════════════════════════════════════════════════ */
function renderLoansView(el) {
  const list = loans();
  const projectsLoaded = (NC.data.projects || NC.state.projects || []).length;
  if (!projectsLoaded) loadProjectsIfNeeded();

  // Summary stats
  const totalPrincipal = list.reduce((s,l) => s + N(l.principal), 0);
  const totalAllocated = list.reduce((s,l) => s + allocTotal(l), 0);
  const totalPaid      = list.reduce((s,l) => s + loanPaid(l), 0);
  const totalBalance   = list.reduce((s,l) => s + loanBalance(l), 0);
  const activeCount    = list.filter(l => l.status !== 'closed').length;

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-file-invoice-dollar" style="color:var(--primary);margin-right:8px"></i>Loans</h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary btn-sm" onclick="LOANS.openAllocSummary()"><i class="fas fa-chart-pie"></i> Allocations Summary</button>' +
        '<button class="btn btn-primary btn-sm" onclick="LOANS.openAdd()"><i class="fas fa-plus"></i> New Loan</button>' +
      '</div>' +
    '</div>' +

    /* Summary strip */
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px">' +
      kpiCard('Active Loans', activeCount, list.length + ' total', '#6366f1', '#4f46e5') +
      kpiCard('Total Principal', F(totalPrincipal), F(totalAllocated) + ' allocated', '#0ea5e9', '#0284c7') +
      kpiCard('Total Paid', F(totalPaid), (list.filter(l => l.status === 'closed').length) + ' closed', '#10b981', '#059669') +
      kpiCard('Outstanding', F(totalBalance), activeCount + ' active', '#f59e0b', '#d97706') +
    '</div>' +

    /* Loans table */
    (list.length === 0
      ? '<div class="empty-state"><i class="fas fa-file-invoice-dollar"></i><h3>No loans yet</h3>' +
        '<p style="margin-top:8px">Track loans from lenders with category allocations</p>' +
        '<button class="btn btn-primary" style="margin-top:16px" onclick="LOANS.openAdd()"><i class="fas fa-plus"></i> Add First Loan</button></div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>Lender</th><th>Borrower</th><th>Principal & Allocations</th><th>Rate</th>' +
          '<th>Start</th><th>Due</th><th>Balance</th><th>Status</th><th>Actions</th>' +
        '</tr></thead><tbody id="loansTbody">' +
        list.map(l => renderLoanRow(l)).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';

  function kpiCard(label, value, sub, c1, c2) {
    return '<div style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');color:white;padding:16px;border-radius:12px">' +
      '<div style="font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px">' + label + '</div>' +
      '<div style="font-size:24px;font-weight:800;margin-top:6px">' + value + '</div>' +
      '<div style="font-size:11px;opacity:.85;margin-top:4px">' + sub + '</div>' +
    '</div>';
  }
}

function renderLoanRow(l) {
  const alloc = allocTotal(l);
  const allocPct = N(l.principal) > 0 ? Math.min(100, (alloc / N(l.principal)) * 100) : 0;
  const paid = loanPaid(l);
  const bal = loanBalance(l);
  const catGroups = {};
  (l.allocations || []).forEach(a => {
    if (!catGroups[a.category]) catGroups[a.category] = 0;
    catGroups[a.category] += N(a.amount);
  });
  const catKeys = Object.keys(catGroups);

  return '<tr>' +
    '<td><strong>' + E(l.lender || '-') + '</strong></td>' +
    '<td>' + E(l.borrower || '-') + '</td>' +
    '<td>' +
      '<div style="font-weight:700">' + F(l.principal) + '</div>' +
      (alloc > 0
        ? '<div style="font-size:11px;color:var(--gray);margin-top:3px">Allocated ' + F(alloc) + ' (' + Math.round(allocPct) + '%)</div>' +
          '<div style="background:var(--border);height:5px;border-radius:3px;margin-top:4px;overflow:hidden;max-width:160px">' +
            '<div style="height:100%;width:' + allocPct + '%;background:linear-gradient(90deg,var(--primary),#8b5cf6)"></div>' +
          '</div>' +
          (catKeys.length > 0
            ? '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">' +
              catKeys.map(k => {
                const c = catColor(k);
                return '<span style="padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;background:' + c + '22;color:' + c + '">' + E(k) + ' ' + F(catGroups[k]) + '</span>';
              }).join('') +
              '</div>'
            : '')
        : '<div style="font-size:11px;color:var(--gray);margin-top:3px">Not allocated</div>'
      ) +
    '</td>' +
    '<td>' + N(l.interestRate) + '%</td>' +
    '<td>' + dfmt(l.startDate) + '</td>' +
    '<td>' + dfmt(l.endDate) + '</td>' +
    '<td style="font-weight:700;color:' + (bal > 0 ? 'var(--danger)' : 'var(--success)') + '">' + F(bal) + '</td>' +
    '<td><span class="status-badge status-' + (l.status === 'closed' ? 'cleared' : 'in-hand') + '">' + (l.status || 'active') + '</span></td>' +
    '<td>' +
      '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
        '<button class="btn btn-xs btn-secondary" onclick="LOANS.openAlloc(\'' + l.id + '\')" title="Allocate across categories"><i class="fas fa-sitemap"></i></button>' +
        (bal > 0
          ? '<button class="btn btn-xs btn-success" onclick="LOANS.openPay(\'' + l.id + '\')" title="Record payment"><i class="fas fa-money-bill"></i></button>'
          : '') +
        '<button class="btn btn-xs btn-primary" onclick="LOANS.openEdit(\'' + l.id + '\')" title="Edit"><i class="fas fa-edit"></i></button>' +
        '<button class="btn btn-xs btn-danger" onclick="LOANS.remove(\'' + l.id + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +
      '</div>' +
    '</td>' +
  '</tr>';
}

/* ══════════════════════════════════════════════════════
   PUBLIC API
   ══════════════════════════════════════════════════════ */
const LOANS = window.LOANS = {};

/* ── Add loan ── */
LOANS.openAdd = function () {
  NC.modal({
    id:'loanAddModal',
    title:'New Loan',
    width:640,
    fields: [
      { id:'lender',       label:'Lender',                type:'text',   required:true, hint:'Who gave the money' },
      { id:'borrower',     label:'Borrower',              type:'text',   hint:'Optional — who received it' },
      { id:'principal',    label:'Principal (Rs.)',       type:'number', required:true, step:'0.01' },
      { id:'interestRate', label:'Interest Rate (% / month)', type:'number', step:'0.01', value:0 },
      { id:'startDate',    label:'Start Date',            type:'date',   required:true, value:T() },
      { id:'endDate',      label:'Due Date',              type:'date' },
      { id:'status',       label:'Status',                type:'select', options:[
        { value:'active', label:'Active' },
        { value:'closed', label:'Closed' }
      ], value:'active' },
      { id:'notes',        label:'Notes',                 type:'textarea' }
    ],
    onSave: async d => {
      await NC.save('loans', Object.assign(d, { payments:[], allocations:[] }));
      NC.toast('Loan added', 'success');
      await reloadLoans();
    }
  });
};

/* ── Edit loan ── */
LOANS.openEdit = function (id) {
  const l = loans().find(x => x.id === id);
  if (!l) return;
  NC.modal({
    id:'loanEditModal',
    title:'Edit Loan — ' + (l.lender || ''),
    width:640,
    fields: [
      { id:'lender',       label:'Lender',                type:'text',   required:true, value:l.lender || '' },
      { id:'borrower',     label:'Borrower',              type:'text',   value:l.borrower || '' },
      { id:'principal',    label:'Principal (Rs.)',       type:'number', required:true, step:'0.01', value:l.principal },
      { id:'interestRate', label:'Interest Rate (% / month)', type:'number', step:'0.01', value:l.interestRate || 0 },
      { id:'startDate',    label:'Start Date',            type:'date',   required:true, value:l.startDate },
      { id:'endDate',      label:'Due Date',              type:'date',   value:l.endDate || '' },
      { id:'status',       label:'Status',                type:'select', options:[
        { value:'active', label:'Active' },
        { value:'closed', label:'Closed' }
      ], value:l.status || 'active' },
      { id:'notes',        label:'Notes',                 type:'textarea', value:l.notes || '' }
    ],
    onSave: async d => {
      // Guard: prevent reducing principal below already-allocated total
      const alloc = allocTotal(l);
      if (N(d.principal) < alloc - 0.01) {
        throw new Error('Principal cannot be less than allocated amount (' + F(alloc) + ')');
      }
      await NC.save('loans', Object.assign({ id }, d));
      NC.toast('Loan updated', 'success');
      await reloadLoans();
    }
  });
};

/* ── Delete loan ── */
LOANS.remove = async function (id) {
  const l = loans().find(x => x.id === id);
  if (!l) return;
  const alloc = allocTotal(l);
  const paid = loanPaid(l);
  const warn = 'Delete loan from "' + (l.lender || '-') + '"?\n\n' +
    'Principal: ' + F(l.principal) + '\n' +
    (alloc > 0 ? '⚠ ' + F(alloc) + ' is allocated across categories.\n' : '') +
    (paid > 0 ? '⚠ ' + F(paid) + ' has been paid.\n' : '') +
    '\nThis cannot be undone.';
  if (!await NC.confirm(warn, { danger:true, confirmLabel:'Delete Loan' })) return;
  try {
    await NC.remove('loans', id);
    NC.toast('Loan deleted', 'success');
    await reloadLoans();
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

/* ══════════════════════════════════════════════════════
   ALLOCATIONS MODAL — split principal across categories
   ══════════════════════════════════════════════════════ */
LOANS.openAlloc = function (loanId) {
  const l = loans().find(x => x.id === loanId);
  if (!l) return;
  loadProjectsIfNeeded();

  const alloc = allocTotal(l);
  const unused = allocUnused(l);
  const principal = N(l.principal);
  const pct = principal > 0 ? Math.min(100, (alloc / principal) * 100) : 0;

  const catOpts = categories().map(c => ({ value:c.name, label:c.name }));
  const projList = NC.data.projects || NC.state.projects || [];
  const projOpts = projList.map(p => ({ value:p.id, label:p.name }));

  // Group allocations by category for the summary
  const byCat = {};
  (l.allocations || []).forEach(a => {
    if (!byCat[a.category]) byCat[a.category] = { amount:0, count:0 };
    byCat[a.category].amount += N(a.amount);
    byCat[a.category].count++;
  });
  const catKeys = Object.keys(byCat);

  let catSplitHTML = '';
  if (catKeys.length > 0) {
    catSplitHTML =
      '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:16px">' +
        '<div style="font-size:11px;font-weight:700;margin-bottom:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px">Category Split</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
        catKeys.map(k => {
          const row = byCat[k];
          const share = alloc > 0 ? (row.amount / alloc) * 100 : 0;
          const color = catColor(k);
          return '<div style="display:flex;align-items:center;gap:10px">' +
            '<span style="width:12px;height:12px;border-radius:50%;background:' + color + ';flex-shrink:0"></span>' +
            '<span style="font-weight:600;font-size:13px;min-width:100px">' + E(k) + '</span>' +
            '<div style="flex:1;background:var(--border);height:6px;border-radius:3px;overflow:hidden">' +
              '<div style="height:100%;width:' + share + '%;background:' + color + '"></div>' +
            '</div>' +
            '<span style="font-weight:700;font-size:12px;min-width:130px;text-align:right">' + F(row.amount) + ' <span style="color:var(--gray);font-weight:400">(' + Math.round(share) + '%)</span></span>' +
          '</div>';
        }).join('') +
        '</div>' +
      '</div>';
  }

  const allocListHTML = (l.allocations && l.allocations.length > 0)
    ? '<div style="margin-top:18px">' +
        '<div style="font-size:11px;font-weight:700;margin-bottom:10px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px">All Allocations (' + l.allocations.length + ')</div>' +
        '<div class="table-container"><table style="font-size:12.5px"><thead><tr>' +
          '<th>Date</th><th>Category</th><th>Amount</th><th>Purpose</th><th>Project</th><th></th>' +
        '</tr></thead><tbody>' +
        l.allocations.slice().sort((a,b) => String(b.date||'').localeCompare(String(a.date||''))).map(a => {
          const proj = projList.find(p => p.id === a.projectId);
          const color = catColor(a.category);
          return '<tr>' +
            '<td>' + (a.date || '-') + '</td>' +
            '<td><span style="display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:700;background:' + color + '22;color:' + color + '">' + E(a.category) + '</span></td>' +
            '<td style="font-weight:700">' + F(a.amount) + '</td>' +
            '<td>' + E(a.purpose || '-') + '</td>' +
            '<td>' + E(proj ? proj.name : '-') + '</td>' +
            '<td><button class="btn btn-xs btn-danger" onclick="LOANS.removeAlloc(\'' + l.id + '\',\'' + a.id + '\')"><i class="fas fa-trash"></i></button></td>' +
          '</tr>';
        }).join('') +
        '</tbody></table></div>' +
      '</div>'
    : '<div style="text-align:center;padding:24px;color:var(--gray);background:var(--light);border-radius:10px;margin-top:18px">' +
        '<i class="fas fa-sitemap" style="font-size:32px;opacity:.3;display:block;margin-bottom:8px"></i>' +
        'No allocations yet — add one above' +
      '</div>';

  const body =
    /* Header summary */
    '<div style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:white;padding:18px;border-radius:12px;margin-bottom:18px">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;text-align:center">' +
        '<div><div style="font-size:11px;opacity:.85">Principal</div><div style="font-size:20px;font-weight:800">' + F(principal) + '</div></div>' +

/* ── Add allocation ── */
LOANS.addAlloc = async function (loanId) {
  const l = loans().find(x => x.id === loanId);
  if (!l) return;

  const cat        = ($('allocCat') || {}).value || '';
  const amount     = N(($('allocAmount') || {}).value);
  const purpose    = ($('allocPurpose') || {}).value || '';
  const projectId  = ($('allocProject') || {}).value || '';
  const date       = ($('allocDate') || {}).value || T();
  const notes      = ($('allocNotes') || {}).value || '';

  if (!cat) { NC.toast('Select a category', 'error'); return; }
  if (amount <= 0) { NC.toast('Amount must be positive', 'error'); return; }
  const unused = allocUnused(l);
  if (amount > unused) { NC.toast('Exceeds unallocated balance (' + F(unused) + ')', 'error'); return; }

  const entry = {
    id: NC.uid('alloc'),
    category: cat,
    amount: amount,
    purpose: purpose,
    projectId: projectId,
    notes: notes,
    date: date,
    at: NC.nowISO(),
    by: NC.state.user ? NC.state.user.email : 'system'
  };

  try {
    await db.collection('loans').doc(loanId).update({
      allocations: NC.au(entry),
      updatedAt: NC.ts()
    });
    NC.toast('Allocated ' + F(amount) + ' → ' + cat, 'success');
    await reloadLoans();
    LOANS.openAlloc(loanId);   // refresh modal in place
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

/* ── Remove allocation ── */
LOANS.removeAlloc = async function (loanId, allocId) {
  const l = loans().find(x => x.id === loanId);
  if (!l) return;
  const alloc = (l.allocations || []).find(a => a.id === allocId);
  if (!alloc) return;
  if (!await NC.confirm(
    'Remove allocation of ' + F(alloc.amount) + ' → ' + alloc.category + '?',
    { danger:true, confirmLabel:'Remove' }
  )) return;

  const updated = (l.allocations || []).filter(a => a.id !== allocId);
  try {
    await db.collection('loans').doc(loanId).update({
      allocations: updated,
      updatedAt: NC.ts()
    });
    NC.toast('Allocation removed', 'success');
    await reloadLoans();
    LOANS.openAlloc(loanId);   // refresh modal
  } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
};

/* ══════════════════════════════════════════════════════
   PAYMENTS
   ══════════════════════════════════════════════════════ */
LOANS.openPay = function (loanId) {
  const l = loans().find(x => x.id === loanId);
  if (!l) return;
  const bal = loanBalance(l);
  if (bal <= 0) return NC.toast('Loan fully paid', 'info');

  NC.modal({
    id:'loanPayModal',
    title:'Record Payment — ' + (l.lender || ''),
    width:520,
    bodyHTML:
      '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:16px;font-size:13px">' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          '<div><strong>Principal:</strong> ' + F(l.principal) + '</div>' +
          '<div><strong>Paid:</strong> <span style="color:var(--success)">' + F(loanPaid(l)) + '</span></div>' +
          '<div style="grid-column:1/-1"><strong>Balance:</strong> <span style="color:var(--danger);font-weight:700">' + F(bal) + '</span></div>' +
        '</div>' +
      '</div>',
    fields: [
      { id:'amount', label:'Amount (Rs.)', type:'number', required:true, step:'0.01', value:bal.toFixed(2), max:bal, hint:'Max: ' + F(bal) },
      { id:'date',   label:'Payment Date', type:'date', required:true, value:T() },
      { id:'method', label:'Method', type:'select', required:true, options:[
        { value:'cash', label:'Cash' },
        { value:'bank', label:'Bank' },
        { value:'cheque', label:'Cheque' },
        { value:'online', label:'Online' }
      ], value:'bank' },
      { id:'notes', label:'Notes', type:'textarea' }
    ],
    onSave: async d => {
      const amt = N(d.amount);
      if (amt <= 0) throw new Error('Amount must be positive');
      if (amt > bal + 0.01) throw new Error('Exceeds balance ' + F(bal));

      const entry = {
        id: NC.uid('lpay'),
        amount: amt,
        date: d.date,
        method: d.method,
        notes: d.notes || '',
        at: NC.nowISO(),
        by: NC.state.user ? NC.state.user.email : 'system'
      };
      const newBal = bal - amt;
      const update = {
        payments: NC.au(entry),
        updatedAt: NC.ts()
      };
      if (newBal <= 0.01) update.status = 'closed';
      await db.collection('loans').doc(loanId).update(update);
      NC.toast('Payment ' + F(amt) + ' recorded', 'success');
      await reloadLoans();
    }
  });
};

/* ══════════════════════════════════════════════════════

          '<span style="font-weight:700;font-size:14px">' + E(k) + '</span>' +

      '</div>';

    // Per-loan breakdown

    body += '<div class="table-container"><table style="font-size:12.5px"><thead><tr>' +

    '</tr></thead><tbody>';
    loans().forEach(l => {
      const a = allocTotal(l);
      const un = allocUnused(l);
      const grp = {};
      (l.allocations || []).forEach(x => { grp[x.category] = (grp[x.category]||0) + N(x.amount); });
      const chips = Object.keys(grp).map(k => {
        const c = catColor(k);

      }).join('') || '<span style="color:var(--gray)">—</span>';

        '<td>' + F(l.principal) + '</td>' +
        '<td style="color:var(--primary);font-weight:700">' + F(a) + '</td>' +

  NC.modal({

<!-- ══════════════════════════════════════════════════════
     PART 5 — FINANCE MANAGER
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modFinance) return;
window.__modFinance = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const FX = NC.fmtExact;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   LOCAL STATE
   ══════════════════════════════════════════════════════ */
const FIN = window.FIN = {
  plans: [], payments: [], deductions: [],
  loaded: false, loading: false,
  activeTab: 'dashboard',
  activePlanId: null,
  bulkRows: []
};

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
const planById  = id => FIN.plans.find(p => p.id === id);
const paymentById = id => FIN.payments.find(p => p.id === id);
const dedById   = id => FIN.deductions.find(d => d.id === id);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ── Deduction math ── */
function paidDirect(d)   { return (d.directPayments || []).reduce((s,p) => s + N(p.amount), 0); }
function paidFromMain(d) { return (d.mainDeductions || []).reduce((s,m) => s + N(m.amount), 0); }
function paidTotal(d)    { return paidDirect(d) + paidFromMain(d); }
function remainingDed(d) { return Math.max(0, N(d.amount) - paidTotal(d)); }
function isOverdueDed(d) { return new Date(d.dueDate) < new Date() && remainingDed(d) > 0.001; }
function daysOverdueDed(d) {
  if (remainingDed(d) <= 0.001) return 0;
  const x = Math.floor((Date.now() - new Date(d.dueDate).getTime()) / 86400000);
  return x > 0 ? x : 0;
}
function statusKeyDed(d) {
  const r = remainingDed(d);
  if (r <= 0.001) return 'settled';
  if (paidTotal(d) > 0) return 'partial';
  return 'pending';
}

/* ══════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════ */
async function loadFinance(force) {
  if (FIN.loading) return;
  FIN.loading = true;
  try {
    const [plans, payments, deductions] = await Promise.all([
      NC.load('finance_plans', { fresh: !!force }),
      NC.load('finance_payments', { fresh: !!force }),
      NC.load('finance_deductions', { fresh: !!force })
    ]);
    FIN.plans = plans;
    FIN.payments = payments;
    FIN.deductions = deductions;
    FIN.loaded = true;
    NC.emit('finance:changed', {
      plans: plans.length,
      payments: payments.length,
      deductions: deductions.length
    });
  } catch (e) {
    console.error('[Finance] load error', e);
    NC.toast('Failed to load finance data: ' + e.message, 'error');
  } finally {
    FIN.loading = false;
  }
}

/* ══════════════════════════════════════════════════════
   CALCULATION ENGINE
   ══════════════════════════════════════════════════════ */

/* Build a fresh dedState tracker for a plan. */
function buildDedStates(planId) {
  const states = {};
  FIN.deductions.filter(d => d.planId === planId).forEach(d => {
    states[d.id] = {
      id: d.id,
      label: d.label,
      originalAmount: N(d.amount),
      directPaid: paidDirect(d),
      replayPaid: 0,
      dueDate: d.dueDate
    };
  });
  return states;
}

/* Deductions due as of a date, using the chronological tracker. */
function dueDedsAt(planId, effDate, dedStates) {
  const eff = new Date(effDate);
  return Object.values(dedStates)
    .filter(s => new Date(s.dueDate) <= eff)
    .map(s => {
      const remaining = Math.max(0, s.originalAmount - s.directPaid - s.replayPaid);
      return { id: s.id, label: s.label, remaining };
    })
    .filter(d => d.remaining > 0.001);
}

/* Deductions due NOW (live state). */
function dueDedsNow(planId, effDate) {
  const eff = new Date(effDate);
  return FIN.deductions
    .filter(d => d.planId === planId && new Date(d.dueDate) <= eff)
    .map(d => {
      const remaining = remainingDed(d);
      return { id: d.id, label: d.label, remaining };
    })
    .filter(d => d.remaining > 0.001);
}

/* Apply a payment: deductions → pending commission → current commission → capital. */
function applyPayment(workingPlan, amount, days, daysChargeable, dueDeds) {
  const grace = N(workingPlan.gracePeriod);
  const daily = (N(workingPlan.capitalCurrent) / 100000) * N(workingPlan.commissionRate);
  let accrued = daily * daysChargeable;
  let penalty = 0;
  const penaltyPct = N(workingPlan.penaltyRate);
  const expectedInterval = N(workingPlan.expectedInterval) || 30;
  if (penaltyPct > 0 && days > expectedInterval) {
    penalty = accrued * (penaltyPct / 100);
    accrued += penalty;
  }

  const pendingBefore = N(workingPlan.pendingCommission);
  const capitalBefore = N(workingPlan.capitalCurrent);

  let rem = N(amount);
  const bd = { deductions:[], commissionPending:0, commissionCurrent:0, penalty, capital:0 };

  for (const d of dueDeds) {
    if (rem <= 0) break;
    const paid = Math.min(rem, d.remaining);
    bd.deductions.push({
      id: d.id, label: d.label, remaining: d.remaining,
      paid, fullyPaid: paid >= d.remaining - 0.001
    });
    rem -= paid;
  }

  if (rem > 0 && pendingBefore > 0) {
    const paid = Math.min(rem, pendingBefore);
    bd.commissionPending = paid;
    rem -= paid;
  }
  if (rem > 0 && accrued > 0) {
    const paid = Math.min(rem, accrued);
    bd.commissionCurrent = paid;
    rem -= paid;
  }
  if (rem > 0) bd.capital = rem;

  const totalCommissionOwed = pendingBefore + accrued;
  const totalCommissionPaid = bd.commissionPending + bd.commissionCurrent;
  const newPending = Math.max(0, totalCommissionOwed - totalCommissionPaid);
  const newCapital = Math.max(0, capitalBefore - bd.capital);

  return {
    days, daysChargeable, grace,
    dailyCommission: daily, accruedCommission: accrued, penalty,
    pendingBefore, capitalBefore,
    dueDeds, breakdown: bd,
    totalCommissionOwed, totalCommissionPaid,
    newPendingCommission: newPending,
    newCapitalCurrent: newCapital,
    effectiveDate: null
  };
}

/* Preview calc for a NEW payment. */
function calcPayment(plan, amount, effectiveDate) {
  const effDate = new Date(effectiveDate);
  const planPmts = FIN.payments
    .filter(p => p.planId === plan.id && p.status !== 'bounced' && p.status !== 'pending' && new Date(p.effectiveDate || p.date) < effDate)
    .sort((a,b) => new Date(a.effectiveDate || a.date) - new Date(b.effectiveDate || b.date));
  const lastPmt = planPmts[planPmts.length - 1];
  const lastDate = lastPmt ? new Date(lastPmt.effectiveDate || lastPmt.date) : new Date(plan.startDate);
  const days = Math.max(0, Math.round((effDate - lastDate) / 86400000));
  const grace = N(plan.gracePeriod);
  let daysChargeable = days;
  if (!lastPmt) {
    const sinceStart = Math.max(0, Math.round((effDate - new Date(plan.startDate)) / 86400000));
    daysChargeable = Math.max(0, sinceStart - grace);
  }
  const due = dueDedsNow(plan.id, effDate);
  const r = applyPayment(plan, amount, days, daysChargeable, due);
  r.effectiveDate = effDate.toISOString().split('T')[0];
  r.deductionsTotal = due.reduce((s,d) => s + d.remaining, 0);
  r.totalDue = r.pendingBefore + r.accruedCommission + r.deductionsTotal;
  return r;
}

/* Replay committed payments chronologically. */
function replayCommitted(plan) {
  const pmts = FIN.payments
    .filter(x => x.planId === plan.id && x.status !== 'bounced' && x.status !== 'pending')
    .sort((a,b) => new Date(a.effectiveDate || a.date) - new Date(b.effectiveDate || b.date));

  const dedStates = buildDedStates(plan.id);
  let capital = N(plan.capitalStart);
  let pending = 0;
  const timeline = [];
  let prevDate = new Date(plan.startDate);

  for (const pmt of pmts) {
    const effDate = new Date(pmt.effectiveDate || pmt.date);
    const days = Math.max(0, Math.round((effDate - prevDate) / 86400000));
    const grace = N(plan.gracePeriod);
    let daysChargeable = days;
    if (timeline.length === 0) {
      const sinceStart = Math.max(0, Math.round((effDate - new Date(plan.startDate)) / 86400000));
      daysChargeable = Math.max(0, sinceStart - grace);
    }
    const due = dueDedsAt(plan.id, effDate, dedStates);
    const workingPlan = Object.assign({}, plan, { capitalCurrent: capital, pendingCommission: pending });
    const calc = applyPayment(workingPlan, pmt.amount, days, daysChargeable, due);
    calc.effectiveDate = effDate.toISOString().split('T')[0];
    for (const dd of calc.breakdown.deductions) {
      if (dd.paid > 0) dedStates[dd.id].replayPaid += dd.paid;
    }
    const expectedInterval = N(plan.expectedInterval) || 30;
    timeline.push({
      payment: pmt,
      startDate: prevDate.toISOString().split('T')[0],
      endDate: pmt.effectiveDate || pmt.date,
      days, daysChargeable, grace,
      penalty: calc.penalty,
      capitalBefore: calc.capitalBefore,
      capitalAfter: calc.newCapitalCurrent,
      commissionPaid: calc.totalCommissionPaid,
      commissionPendingPaid: calc.breakdown.commissionPending,
      commissionCurrentPaid: calc.breakdown.commissionCurrent,
      capitalPaid: calc.breakdown.capital,
      deductions: calc.breakdown.deductions,
      dueDeds: due,
      pendingBefore: calc.pendingBefore,
      pendingAfter: calc.newPendingCommission,
      dailyCommission: calc.dailyCommission,
      accruedCommission: calc.accruedCommission,
      wasLate: days > expectedInterval
    });
    capital = calc.newCapitalCurrent;
    pending = calc.newPendingCommission;
    prevDate = effDate;
  }
  return { timeline, capital, pending, plan, dedStates };
}

/* Project pending cheques on top of committed state. */
function projectPending(plan, committedState) {
  const pendingChqs = FIN.payments
    .filter(x => x.planId === plan.id && x.status === 'pending')
    .sort((a,b) => new Date(a.effectiveDate || a.date) - new Date(b.effectiveDate || b.date));
  if (!pendingChqs.length) return null;

  const committed = FIN.payments.filter(x => x.planId === plan.id && x.status !== 'bounced' && x.status !== 'pending');
  const combined = [
    ...committed.map(p => Object.assign({}, p, { __kind:'committed' })),
    ...pendingChqs.map(p => Object.assign({}, p, { __kind:'pending' }))
  ].sort((a,b) => new Date(a.effectiveDate || a.date) - new Date(b.effectiveDate || b.date));

  const dedStates = buildDedStates(plan.id);
  let capital = N(plan.capitalStart);
  let pending = 0;
  let prevDate = new Date(plan.startDate);
  const projTimeline = [];

  for (const pmt of combined) {
    const effDate = new Date(pmt.effectiveDate || pmt.date);
    const days = Math.max(0, Math.round((effDate - prevDate) / 86400000));
    const grace = N(plan.gracePeriod);
    let daysChargeable = days;
    if (projTimeline.length === 0) {
      const sinceStart = Math.max(0, Math.round((effDate - new Date(plan.startDate)) / 86400000));
      daysChargeable = Math.max(0, sinceStart - grace);
    }
    const due = dueDedsAt(plan.id, effDate, dedStates);
    const workingPlan = Object.assign({}, plan, { capitalCurrent: capital, pendingCommission: pending });
    const calc = applyPayment(workingPlan, pmt.amount, days, daysChargeable, due);
    calc.effectiveDate = effDate.toISOString().split('T')[0];
    for (const dd of calc.breakdown.deductions) {
      if (dd.paid > 0) dedStates[dd.id].replayPaid += dd.paid;
    }
    const expectedInterval = N(plan.expectedInterval) || 30;
    projTimeline.push({
      payment: pmt, kind: pmt.__kind,
      startDate: prevDate.toISOString().split('T')[0],
      endDate: pmt.effectiveDate || pmt.date,
      days, daysChargeable, grace,
      penalty: calc.penalty,
      capitalBefore: calc.capitalBefore,
      capitalAfter: calc.newCapitalCurrent,
      commissionPaid: calc.totalCommissionPaid,
      commissionPendingPaid: calc.breakdown.commissionPending,
      commissionCurrentPaid: calc.breakdown.commissionCurrent,
      capitalPaid: calc.breakdown.capital,
      deductions: calc.breakdown.deductions,
      dueDeds: due,
      pendingBefore: calc.pendingBefore,
      pendingAfter: calc.newPendingCommission,
      dailyCommission: calc.dailyCommission,
      accruedCommission: calc.accruedCommission,
      wasLate: days > expectedInterval
    });
    capital = calc.newCapitalCurrent;
    pending = calc.newPendingCommission;
    prevDate = effDate;
  }
  const pendingOnly = projTimeline.filter(t => t.kind === 'pending');
  return {
    timeline: projTimeline,
    pendingOnly,
    capital,
    pending,
    deltaCapital: (committedState.capital || 0) - capital,
    deltaCommission: pendingOnly.reduce((s,t) => s + t.commissionPaid, 0)
  };
}

/* Full recalc: reset all deduction main-settlements, replay payments, save everything. */
async function recalcPlan(planId) {
  const p = planById(planId);
  if (!p) return;

  for (const d of FIN.deductions.filter(x => x.planId === planId)) {
    if ((d.mainDeductions || []).length > 0) {
      await db.collection('finance_deductions').doc(d.id).set(
        { mainDeductions: [], updatedAt: NC.ts() }, { merge:true }
      );
      d.mainDeductions = [];
    }
  }

  const dedStates = buildDedStates(planId);
  const workingPlan = Object.assign({}, p, { capitalCurrent: N(p.capitalStart), pendingCommission: 0, status:'active' });
  const planPmts = FIN.payments
    .filter(x => x.planId === planId && x.status !== 'pending' && x.status !== 'bounced')
    .sort((a,b) => new Date(a.effectiveDate || a.date) - new Date(b.effectiveDate || b.date));

  let prevDate = new Date(p.startDate);

  for (const pmt of planPmts) {
    const effDate = new Date(pmt.effectiveDate || pmt.date);
    const days = Math.max(0, Math.round((effDate - prevDate) / 86400000));
    const grace = N(p.gracePeriod);
    let daysChargeable = days;
    if (prevDate.getTime() === new Date(p.startDate).getTime()) {
      const sinceStart = Math.max(0, Math.round((effDate - new Date(p.startDate)) / 86400000));
      daysChargeable = Math.max(0, sinceStart - grace);
    }
    const due = dueDedsAt(planId, effDate, dedStates);
    const calc = applyPayment(workingPlan, pmt.amount, days, daysChargeable, due);
    calc.effectiveDate = effDate.toISOString().split('T')[0];

    await db.collection('finance_payments').doc(pmt.id).set({
      breakdown: {
        days: calc.days, daysChargeable: calc.daysChargeable, grace: calc.grace,
        dailyCommission: calc.dailyCommission, accruedCommission: calc.accruedCommission, penalty: calc.penalty,
        pendingBefore: calc.pendingBefore, deductionsTotal: due.reduce((s,d) => s + d.remaining, 0),
        deductions: calc.breakdown.deductions,
        commissionPending: calc.breakdown.commissionPending,
        commissionCurrent: calc.breakdown.commissionCurrent,
        capital: calc.breakdown.capital
      },
      newPendingCommission: calc.newPendingCommission,
      newCapital: calc.newCapitalCurrent,
      updatedAt: NC.ts()
    }, { merge:true });

    for (const dd of calc.breakdown.deductions) {
      if (!dd.paid || dd.paid <= 0) continue;
      dedStates[dd.id].replayPaid += dd.paid;
      await db.collection('finance_deductions').doc(dd.id).update({
        mainDeductions: NC.au({ paymentId: pmt.id, amount: dd.paid, date: pmt.effectiveDate || pmt.date })
      }).catch(e => console.warn('[recalc] ded update', e));
    }
    workingPlan.capitalCurrent = calc.newCapitalCurrent;
    workingPlan.pendingCommission = calc.newPendingCommission;
    prevDate = effDate;
  }

  if (workingPlan.capitalCurrent <= 0.01 && workingPlan.pendingCommission <= 0.01) {
    workingPlan.status = 'completed';
  }
  await db.collection('finance_plans').doc(planId).set({
    capitalCurrent: workingPlan.capitalCurrent,
    pendingCommission: workingPlan.pendingCommission,
    status: workingPlan.status,
    updatedAt: NC.ts()
  }, { merge:true });
}

      '</div>' +
      '<span class="status-badge status-' + (p.status === 'completed' ? 'cleared' : (overdue ? 'returned' : 'in-hand')) + '">' +
        (p.status === 'completed' ? 'Completed' : (overdue ? 'Attention' : 'Active')) +
      '</span>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">' +

      statBlock('Pending Comm.', F(p.pendingCommission), N(p.pendingCommission) > 0 ? 'var(--danger)' : 'var(--success)') +
      statBlock('Last Cleared', lastPmt ? dfmt(lastPmt.effectiveDate || lastPmt.date) : 'None', null, '12px') +
    '</div>' +
