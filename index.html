    footer.innerHTML =
      '<button class="btn btn-secondary" onclick="NC.closeModal(\'finChequeModal\')">Cancel</button>' +
      '<button class="btn btn-primary" id="finChequeCommit"><i class="fas fa-check"></i> Update</button>';
    $('finChequeNewStatus').value = c.status === 'pending' ? 'cleared' : c.status;
    $('finBounceGroup').classList.toggle('hidden', $('finChequeNewStatus').value !== 'bounced');
    $('finChequeCommit').onclick = () => FIN.commitChequeStatus(paymentId);
    this.chequeStatusPreview(paymentId);
  },

  chequeStatusPreview(paymentId) {
    const c = paymentById(paymentId);
    if (!c) return;
    const newStatus = $('finChequeNewStatus').value;
    $('finBounceGroup').classList.toggle('hidden', newStatus !== 'bounced');
    const banner = $('finChequeImpact');
    const p = planById(c.planId);
    if (!p) { banner.style.display = 'none'; return; }
    banner.style.display = 'block';
    if (newStatus === 'cleared' && c.status !== 'cleared') {
      const calc = calcPayment(p, c.amount, c.effectiveDate || c.date);
      const dedPaid = calc.breakdown.deductions.reduce((s,d) => s + d.paid, 0);
      banner.className = 'fin-info-banner';
      banner.style.cssText = 'background:#d1fae5;border:1.5px solid #10b981;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#065f46;margin-bottom:14px';
      banner.innerHTML = '<i class="fas fa-check-circle"></i> <strong>Clearing this cheque will apply:</strong><br>Deductions: <strong>' + F(dedPaid) + '</strong><br>Commission paid: <strong>' + F(calc.totalCommissionPaid) + '</strong>' + (calc.penalty > 0 ? ' (incl. ' + F(calc.penalty) + ' late fee)' : '') + '<br>Capital reduced: <strong>' + F(calc.breakdown.capital) + '</strong> (' + F(p.capitalCurrent) + ' → <strong>' + F(calc.newCapitalCurrent) + '</strong>)<br>New pending: <strong>' + F(calc.newPendingCommission) + '</strong>';
    } else if (newStatus === 'bounced' && c.status !== 'bounced') {
      banner.style.cssText = 'background:#fee2e2;border:1.5px solid #ef4444;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#991b1b;margin-bottom:14px';
      banner.innerHTML = '<i class="fas fa-exclamation-triangle"></i> <strong>Marking as BOUNCED</strong> removes it from the plan. Deduction settlements will be reversed.';
    } else if (newStatus === 'pending') {
      banner.style.cssText = 'background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:14px';
      banner.innerHTML = '<i class="fas fa-hourglass-half"></i> <strong>Pending:</strong> recorded but will NOT affect capital or commission.';
    } else {
      banner.style.cssText = 'background:#dbeafe;border:1.5px solid #3b82f6;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#1e40af;margin-bottom:14px';
      banner.innerHTML = '<i class="fas fa-info-circle"></i> No change in status.';
    }
  },

  async commitChequeStatus(paymentId) {
    const c = paymentById(paymentId);
    if (!c) return;
    const newStatus = $('finChequeNewStatus').value;
    const reason = ($('finChequeBounceReason') || {}).value || '';
    try {
      const prev = c.status;
      const update = { status: newStatus, updatedAt: NC.ts() };
      if (newStatus === 'bounced') update.bounceReason = reason;
      await db.collection('finance_payments').doc(paymentId).set(update, { merge:true });
      if (prev !== newStatus) {
        await loadFinance(true);
        await recalcPlan(c.planId);
        await loadFinance(true);
      }
      NC.toast('Cheque marked as ' + newStatus, newStatus === 'bounced' ? 'error' : 'success');
      NC.closeModal('finChequeModal');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  /* ── Bulk ── */
  openBulkModal(planId) {
    FIN.bulkRows = [];
    NC.modal({
      id:'finBulkModal',
      title:'Bulk Cheque Entry',
      width:900,
      bodyHTML:
        '<div class="form-group"><label>Finance Plan *</label>' +
          '<select id="finBulkPlan">' +
            '<option value="">-- Select --</option>' +
            FIN.plans.map(p => '<option value="' + p.id + '"' + (p.id === planId ? ' selected' : '') + '>' + E(p.vehicle) + ' — ' + E(p.company) + '</option>').join('') +
          '</select></div>' +
        '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:14px">' +
          '<div style="font-weight:700;font-size:12px;color:var(--gray);text-transform:uppercase;margin-bottom:10px">Add Cheque Row</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<input type="date" id="finBulkDate" style="flex:1;min-width:150px;padding:9px 11px;border:2px solid var(--border);border-radius:8px">' +
            '<input type="number" id="finBulkAmount" placeholder="Amount" step="0.01" style="flex:1;min-width:130px;padding:9px 11px;border:2px solid var(--border);border-radius:8px">' +
            '<input type="text" id="finBulkChequeNo" placeholder="Cheque #" style="flex:1;min-width:120px;padding:9px 11px;border:2px solid var(--border);border-radius:8px">' +
            '<input type="text" id="finBulkBank" placeholder="Bank" style="flex:1;min-width:120px;padding:9px 11px;border:2px solid var(--border);border-radius:8px">' +
            '<select id="finBulkStatus" style="padding:9px 11px;border:2px solid var(--border);border-radius:8px">' +
              '<option value="pending">⏳ Pending</option>' +
              '<option value="cleared">✅ Cleared</option>' +
            '</select>' +
            '<button class="btn btn-primary" onclick="FIN.addBulkRow()"><i class="fas fa-plus"></i> Add</button>' +
          '</div>' +
        '</div>' +
        '<div id="finBulkRowsList"></div>',
      hideSave:true
    });
    $('finBulkDate').value = T();
    const footer = $('finBulkModal').querySelector('.modal-footer');
    footer.innerHTML =
      '<button class="btn btn-secondary" onclick="NC.closeModal(\'finBulkModal\')">Cancel</button>' +
      '<button class="btn btn-success" id="finBulkCommit"><i class="fas fa-check-double"></i> Commit All</button>';
    $('finBulkCommit').onclick = () => FIN.commitBulk();
    this.renderBulkRows();
  },

  addBulkRow() {
    const planId = $('finBulkPlan').value;
    if (!planId) return NC.toast('Select a plan first', 'error');
    const date = $('finBulkDate').value;
    const amount = N($('finBulkAmount').value);
    const chequeNo = $('finBulkChequeNo').value.trim();
    const bank = $('finBulkBank').value.trim();
    const status = $('finBulkStatus').value;
    if (!date || !amount || amount <= 0 || !chequeNo) return NC.toast('Fill date, amount, cheque number', 'error');
    FIN.bulkRows.push({ id: NC.uid('bulk'), date, amount, chequeNo, bank, status });
    FIN.bulkRows.sort((a,b) => new Date(a.date) - new Date(b.date));
    ['finBulkAmount','finBulkChequeNo','finBulkBank'].forEach(k => { const el = $(k); if (el) el.value = ''; });
    this.renderBulkRows();
  },

  removeBulkRow(id) {
    FIN.bulkRows = FIN.bulkRows.filter(r => r.id !== id);
    this.renderBulkRows();
  },

  renderBulkRows() {
    const host = $('finBulkRowsList');
    if (!host) return;
    if (!FIN.bulkRows.length) {
      host.innerHTML = '<div style="text-align:center;padding:24px;color:var(--gray);font-size:13px"><i class="fas fa-inbox" style="font-size:32px;opacity:.3;display:block;margin-bottom:8px"></i>No cheques added yet</div>';
      return;
    }
    const planId = $('finBulkPlan').value;
    const orig = planId ? planById(planId) : null;
    let sim = orig ? { capital: N(orig.capitalCurrent), pending: N(orig.pendingCommission) } : null;
    let simDedStates = orig ? buildDedStates(planId) : null;

    host.innerHTML = FIN.bulkRows.map(r => {
      let preview = '';
      if (orig && sim && r.status === 'cleared') {
        const due = dueDedsAt(planId, r.date, simDedStates);
        const calc = applyPayment(Object.assign({}, orig, { capitalCurrent: sim.capital, pendingCommission: sim.pending }), r.amount, 30, 30, due);
        preview = '<div style="font-size:11px;color:var(--gray);margin-top:4px">→ Ded ' + F(calc.breakdown.deductions.reduce((s,d)=>s+d.paid,0)) + ' · Comm ' + F(calc.totalCommissionPaid) + ' · Cap ' + F(calc.breakdown.capital) + '</div>';
        for (const dd of calc.breakdown.deductions) { if (dd.paid > 0) simDedStates[dd.id].replayPaid += dd.paid; }
        sim.capital = calc.newCapitalCurrent;
        sim.pending = calc.newPendingCommission;
      }
      return '<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--light);margin-bottom:8px;font-size:12.5px">' +
        '<div style="font-weight:700;color:var(--primary)">#' + E(r.chequeNo) + '</div>' +
        '<div><div style="font-weight:600">' + r.date + (r.bank ? ' · ' + E(r.bank) : '') + '</div><div style="font-size:11px;color:var(--gray)">' + F(r.amount) + '</div>' + preview + '</div>' +
        '<div><span style="padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;background:' + (r.status === 'pending' ? '#fef3c7;color:#b45309' : '#d1fae5;color:#065f46') + '">' + (r.status === 'pending' ? '⏳ pending' : r.status) + '</span></div>' +
        '<button class="btn btn-xs btn-danger" onclick="FIN.removeBulkRow(\'' + r.id + '\')"><i class="fas fa-times"></i></button>' +
      '</div>';
    }).join('');
  },

  async commitBulk() {
    const planId = $('finBulkPlan').value;
    if (!planId) return NC.toast('Select a plan', 'error');
    if (!FIN.bulkRows.length) return NC.toast('Add at least one cheque', 'error');
    try {
      FIN.bulkRows.sort((a,b) => new Date(a.date) - new Date(b.date));
      for (const r of FIN.bulkRows) {
        await db.collection('finance_payments').add({
          planId, date: T(), effectiveDate: r.date,
          amount: r.amount, method: 'cheque',
          reference: 'Cheque #' + r.chequeNo + (r.bank ? ' · ' + r.bank : ''),
          chequeNo: r.chequeNo, chequeBank: r.bank,
          status: r.status, notes: 'Bulk entry',
          breakdown: {}, newPendingCommission: 0, newCapital: 0,
          createdAt: NC.ts(),
          createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
        });
      }
      await loadFinance(true);
      await recalcPlan(planId);
      await loadFinance(true);
      NC.toast('Committed ' + FIN.bulkRows.length + ' cheques', 'success');
      NC.closeModal('finBulkModal');
      FIN.bulkRows = [];
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  /* ── Deductions ── */
  openDeductionModal(planId) {
    if (!FIN.plans.length) return NC.toast('Create a plan first', 'error');
    NC.modal({
      id:'finDedModal',
      title:'Add Planned Deduction',
      fields: [
        { id:'planId', label:'Finance Plan *', type:'select', required:true,
          options: FIN.plans.map(p => ({ value:p.id, label:p.vehicle + ' — ' + p.company })),
          value: planId || (FIN.plans[0] && FIN.plans[0].id) },
        { id:'label', label:'Label *', type:'text', required:true, hint:'e.g. Insurance Premium' },
        { id:'amount', label:'Amount (Rs.) *', type:'number', required:true, step:'0.01' },
        { id:'dueDate', label:'Due Date *', type:'date', required:true, value:T() },
        { id:'notes', label:'Notes', type:'textarea' }
      ],
      onSave: async d => {
        await db.collection('finance_deductions').add(Object.assign({}, d, {
          status:'pending',
          directPayments:[],
          mainDeductions:[],
          createdAt: NC.ts(),
          createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
        }));
        NC.toast('Deduction scheduled', 'success');
        await loadFinance(true);
        await recalcPlan(d.planId);
        await loadFinance(true);
        if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
        else renderFinanceTab();
      }
    });
  },

  async removeDeduction(id) {
    const d = dedById(id);
    if (!d) return;
    const paidFromMain = paidFromMain(d);
    const paidDir = paidDirect(d);
    const warn = 'Delete deduction "' + d.label + '" (' + F(d.amount) + ')?\n\n' +
      (paidFromMain > 0 || paidDir > 0
        ? 'Already settled:\n' + (paidFromMain > 0 ? '• ' + F(paidFromMain) + ' deducted from cleared payments\n' : '') + (paidDir > 0 ? '• ' + F(paidDir) + ' paid directly\n' : '') + '\nThe plan will be recalculated.\n\n'
        : '') +
      'This cannot be undone.';
    if (!await NC.confirm(warn, { danger:true, confirmLabel:'Delete' })) return;
    try {
      await db.collection('finance_deductions').doc(id).delete();
      FIN.deductions = FIN.deductions.filter(x => x.id !== id);
      await loadFinance(true);
      await recalcPlan(d.planId);
      await loadFinance(true);
      NC.toast('Deduction deleted & plan recalculated', 'success');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  openDedPayModal(dedId) {
    const d = dedById(dedId);
    if (!d) return;
    const rem = remainingDed(d);
    if (rem <= 0.001) return NC.toast('Already settled', 'info');
    const pl = planById(d.planId);

    NC.modal({
      id:'finDedPayModal',
      title:'Pay Deduction Directly',
      width:560,
      bodyHTML:
        '<div style="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:14px"><i class="fas fa-info-circle"></i> <strong>Direct payment</strong> — unpaid portion will still auto-deduct from next cleared payment.</div>' +
        '<div style="background:var(--light);padding:14px;border-radius:10px;margin-bottom:16px;font-size:13px">' +
          '<div style="font-weight:800;font-size:14px;margin-bottom:8px">' + E(d.label) + '</div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
            '<div><strong>Plan:</strong> ' + (pl ? E(pl.vehicle) : '—') + '</div>' +
            '<div><strong>Total:</strong> ' + F(d.amount) + '</div>' +
            '<div><strong>Paid:</strong> ' + F(paidTotal(d)) + '</div>' +
            '<div><strong>Due:</strong> ' + dfmt(d.dueDate) + '</div>' +
          '</div>' +
          '<div style="margin-top:10px;padding:10px 12px;background:#fee2e2;border-radius:8px;color:#991b1b;font-weight:700;font-size:14px">Remaining: ' + F(rem) + '</div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Amount (Rs.) *</label><input type="number" id="finDedPayAmount" step="0.01" value="' + rem.toFixed(2) + '"><small style="color:var(--gray);font-size:11px">Max: ' + F(rem) + '</small></div>' +
          '<div class="form-group"><label>Date *</label><input type="date" id="finDedPayDate" value="' + T() + '"></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label>Method *</label><select id="finDedPayMethod"><option value="cash">Cash</option><option value="bank-transfer">Bank Transfer</option><option value="online">Online</option><option value="cheque">Cheque</option><option value="card">Card</option></select></div>' +
          '<div class="form-group"><label>Reference</label><input type="text" id="finDedPayRef"></div>' +
        '</div>' +
        '<div class="form-group"><label>Notes</label><textarea id="finDedPayNotes" rows="2"></textarea></div>',
      hideSave:true
    });
    const footer = $('finDedPayModal').querySelector('.modal-footer');
    footer.innerHTML =
      '<button class="btn btn-secondary" onclick="NC.closeModal(\'finDedPayModal\')">Cancel</button>' +
      '<button class="btn btn-primary" id="finDedPaySave"><i class="fas fa-check"></i> Record</button>';
    $('finDedPaySave').onclick = async () => {
      const amt = N($('finDedPayAmount').value);
      const date = $('finDedPayDate').value;
      const method = $('finDedPayMethod').value;
      const reference = $('finDedPayRef').value.trim();
      const notes = $('finDedPayNotes').value.trim();
      if (!amt || amt <= 0 || !date) return NC.toast('Fill required fields', 'error');
      if (amt > rem + 0.001) return NC.toast('Exceeds remaining ' + F(rem), 'error');
      try {
        const entry = { id: NC.uid('dpay'), amount: amt, date, method, reference, notes, recordedAt: NC.nowISO(), user: NC.state.user ? NC.state.user.email : 'system' };
        await db.collection('finance_deductions').doc(dedId).update({
          directPayments: NC.au(entry),
          updatedAt: NC.ts()
        });
        NC.toast('Direct payment ' + F(amt) + ' recorded', 'success');
        NC.closeModal('finDedPayModal');
        await loadFinance(true);
        if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
        else renderFinanceTab();
      } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
    };
  },

  async deleteDeductionPayment(dedId, payId) {
    if (!await NC.confirm('Delete this direct payment? Plan will be recalculated.', { danger:true })) return;
    const d = dedById(dedId);
    if (!d) return;
    try {
      const updated = (d.directPayments || []).filter(p => p.id !== payId);
      await db.collection('finance_deductions').doc(dedId).update({ directPayments: updated, updatedAt: NC.ts() });
      await loadFinance(true);
      await recalcPlan(d.planId);
      await loadFinance(true);
      NC.toast('Direct payment removed', 'success');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  showDedDetail(dedId) {
    const d = dedById(dedId);
    if (!d) return;
    const pl = planById(d.planId);
    const rem = remainingDed(d);
    const direct = paidDirect(d);
    const fromMain = paidFromMain(d);
    const total = paidTotal(d);
    const pct = N(d.amount) > 0 ? (total / N(d.amount) * 100) : 0;
    const overdue = isOverdueDed(d);
    const daysOver = daysOverdueDed(d);
    const sk = statusKeyDed(d);
    const directRows = (d.directPayments || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));
    const mainRows = (d.mainDeductions || []).slice().sort((a,b) => new Date(b.date) - new Date(a.date));

    const body =
      '<div style="background:linear-gradient(135deg,#f0f9ff,#e0f2fe);padding:16px;border-radius:12px;margin-bottom:18px">' +
        '<div style="font-weight:800;font-size:17px;margin-bottom:4px">' + E(d.label) + '</div>' +
        '<div style="font-size:12px;color:var(--gray);margin-bottom:14px">' + (pl ? E(pl.vehicle) + ' · ' + E(pl.company) : '—') + '</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px">' +
          '<div><strong style="display:block;font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:3px">Total</strong>' + F(d.amount) + '</div>' +
          '<div><strong style="display:block;font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:3px">Due</strong>' + dfmt(d.dueDate) + (overdue ? ' (' + daysOver + 'd)' : '') + '</div>' +
          '<div><strong style="display:block;font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:3px">Direct</strong><span style="color:var(--info)">' + F(direct) + '</span></div>' +
          '<div><strong style="display:block;font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:3px">From Cleared</strong><span style="color:var(--warning)">' + F(fromMain) + '</span></div>' +
          '<div><strong style="display:block;font-size:10px;color:var(--gray);text-transform:uppercase;margin-bottom:3px">Remaining</strong><span style="color:' + (rem > 0 ? 'var(--danger)' : 'var(--success)') + ';font-weight:800">' + F(rem) + '</span></div>' +
        '</div>' +
        '<div style="background:var(--border);height:10px;border-radius:5px;overflow:hidden;margin-top:14px"><div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,var(--success),var(--primary))"></div></div>' +
        '<div style="font-size:11px;color:var(--gray);text-align:right;margin-top:4px">' + pct.toFixed(1) + '% settled</div>' +
      '</div>' +
      (overdue ? '<div style="background:#fee2e2;border:1.5px solid #ef4444;border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#991b1b"><i class="fas fa-exclamation-triangle"></i> <strong>Overdue by ' + daysOver + ' days.</strong> Remaining ' + F(rem) + ' will auto-deduct from next cleared payment.</div>' : '') +
      '<h4 style="font-size:12px;color:var(--gray);text-transform:uppercase;margin-bottom:10px">Direct Payments (' + directRows.length + ')</h4>' +
      (directRows.length === 0
        ? '<div style="text-align:center;padding:18px;color:var(--gray);font-size:12px;background:var(--light);border-radius:8px">No direct payments yet</div>'
        : directRows.map(p => '<div style="display:flex;gap:12px;padding:12px;background:var(--light);border-radius:10px;margin-bottom:8px;align-items:flex-start">' +
            '<span style="font-size:9px;padding:2px 8px;border-radius:8px;font-weight:800;text-transform:uppercase;background:#d1fae5;color:#065f46;flex-shrink:0">DIRECT</span>' +
            '<div style="flex:1"><div style="font-weight:800;color:var(--info)">' + F(p.amount) + ' · ' + E(p.method) + '</div>' +
            '<div style="font-size:12px;color:var(--gray);margin-top:2px">' + dfmt(p.date) + (p.reference ? ' · ' + E(p.reference) : '') + '</div></div>' +
            '<button class="btn btn-xs btn-danger" onclick="FIN.deleteDeductionPayment(\'' + d.id + '\',\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
          '</div>').join('')
      ) +
      '<h4 style="font-size:12px;color:var(--gray);text-transform:uppercase;margin:20px 0 10px">Deducted From Cleared Payments (' + mainRows.length + ')</h4>' +
      (mainRows.length === 0
        ? '<div style="text-align:center;padding:18px;color:var(--gray);font-size:12px;background:var(--light);border-radius:8px">Not deducted from any cleared payment yet</div>'
        : mainRows.map(m => {
            const pmt = paymentById(m.paymentId);
            return '<div style="display:flex;gap:12px;padding:12px;background:var(--light);border-radius:10px;margin-bottom:8px;align-items:flex-start">' +
              '<span style="font-size:9px;padding:2px 8px;border-radius:8px;font-weight:800;text-transform:uppercase;background:#fef3c7;color:#b45309;flex-shrink:0">FROM CLEARED</span>' +
              '<div style="flex:1"><div style="font-weight:800;color:var(--warning)">' + F(m.amount) + ' deducted</div>' +
              '<div style="font-size:12px;color:var(--gray);margin-top:2px">Payment dated ' + dfmt(m.date) + (pmt ? ' · Ref ' + E(pmt.reference) : '') + '</div></div>' +
            '</div>';
          }).join('')
      );

    NC.modal({
      id:'finDedDetailModal',
      title:'Deduction Audit Trail',
      width:760,
      hideSave:true,
      bodyHTML: body
    });
  },

  /* ── Receipt ── */
  showReceipt(paymentId) {
    const c = paymentById(paymentId);
    if (!c) return;
    const pl = planById(c.planId);
    const b = c.breakdown || {};
    const isPending = c.status === 'pending';
    const isBounced = c.status === 'bounced';

    const body =
      '<div style="background:white;padding:30px;border-radius:12px;font-family:\'Courier New\',monospace;max-width:500px;margin:0 auto;border:1px dashed var(--border)">' +
        '<h2 style="text-align:center;font-size:20px;margin-bottom:20px;border-bottom:2px dashed var(--border);padding-bottom:12px">' +
          (isPending ? 'PAYMENT (PENDING)' : isBounced ? 'PAYMENT (BOUNCED)' : 'PAYMENT RECEIPT') +
        '</h2>' +
        (isPending ? '<div style="background:#fef3c7;color:#92400e;padding:8px;border-radius:6px;text-align:center;font-size:12px;margin-bottom:14px">⏳ Pending — plan not yet affected</div>' : '') +
        (isBounced ? '<div style="background:#fee2e2;color:#991b1b;padding:8px;border-radius:6px;text-align:center;font-size:12px;margin-bottom:14px">❌ Bounced — removed from plan</div>' : '') +
        row('Receipt #', c.id.slice(-8).toUpperCase()) +
        row('Date', dfmt(c.date)) +
        row('Plan', pl ? pl.vehicle : '—') +
        row('Company', pl ? pl.company : '—') +
        row('Method', c.method.toUpperCase()) +
        (c.chequeNo ? row('Cheque #', c.chequeNo) : '') +
        (c.chequeBank ? row('Bank', c.chequeBank) : '') +
        (c.effectiveDate && c.effectiveDate !== c.date ? row('Cheque date', dfmt(c.effectiveDate)) : '') +
        '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-top:2px dashed #ddd;margin-top:8px;padding-top:8px"><span>Days covered</span><strong>' + (b.days || 0) + '</strong></div>' +
        row('Daily commission', FX(b.dailyCommission)) +
        row('Accrued commission', FX(b.accruedCommission)) +
        (b.penalty > 0 ? row('Late fee', FX(b.penalty)) : '') +
        ((b.deductions || []).map(d => row('Deduction: ' + d.label, FX(d.paid))).join('')) +
        row('Commission paid', FX(N(b.commissionPending) + N(b.commissionCurrent))) +
        row('Capital reduced', FX(b.capital)) +
        '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:15px;border-top:2px dashed var(--border);margin-top:12px"><span>TOTAL</span><strong>' + FX(c.amount) + '</strong></div>' +
        row('New capital', FX(c.newCapital)) +
        row('Pending commission', FX(c.newPendingCommission)) +
        '<div style="text-align:center;margin-top:20px;font-size:11px;color:var(--gray);border-top:1px dashed #ddd;padding-top:12px">Generated by NeonCheque · ' + new Date().toLocaleString() + '</div>' +
      '</div>';

    NC.modal({
      id:'finReceiptModal',
      title:'Payment Receipt',
      width:600,
      hideSave:true,
      bodyHTML: body
    });

    function row(l, v) { return '<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px"><span>' + l + '</span><strong>' + v + '</strong></div>'; }
  },

  /* ── What-If ── */
  runWhatIf(planId) {
    const p = planById(planId);
    if (!p) return;
    const amount = N(($('finWiAmount') || {}).value);
    const date = ($('finWiDate') || {}).value;
    const host = $('finWhatIfResult');
    if (!host) return;
    if (!amount || amount <= 0 || !date) { host.innerHTML = ''; return; }
    const calc = calcPayment(p, amount, date);
    host.innerHTML =
      '<div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:14px;padding:18px;border:1px dashed #16a34a">' +
        '<div style="font-weight:800;font-size:13px;margin-bottom:10px;color:#14532d"><i class="fas fa-flask"></i> Simulation (assumes CLEARED, effective ' + dfmt(calc.effectiveDate) + ')</div>' +
        wrow('Days since last cleared', calc.days) +
        wrow('Chargeable days', calc.daysChargeable, true) +
        wrow('Daily commission', FX(calc.dailyCommission), true) +
        wrow('Accrued commission', FX(calc.accruedCommission - calc.penalty), true) +
        (calc.penalty > 0 ? wrow('Late fee', FX(calc.penalty), true, '#b45309') : '') +
        wrow('Pending commission', FX(calc.pendingBefore)) +
        wrow('Deductions due', FX(calc.deductionsTotal)) +
        '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:14.5px;border-top:2px solid var(--info);margin-top:6px;color:var(--primary-dark)"><span>Total Due</span><span>' + FX(calc.totalDue) + '</span></div>' +
        wrow('→ Deductions', FX(calc.breakdown.deductions.reduce((s,d)=>s+d.paid,0)), true) +
        wrow('→ Pending commission', FX(calc.breakdown.commissionPending), true) +
        wrow('→ Current commission', FX(calc.breakdown.commissionCurrent), true) +
        wrow('→ Capital reduction', FX(calc.breakdown.capital), true, 'var(--success)') +
        '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:14.5px;border-top:2px solid var(--info);margin-top:6px;color:var(--primary-dark)"><span>New Pending Commission</span><span style="color:' + (calc.newPendingCommission > 0 ? 'var(--danger)' : 'var(--success)') + '">' + FX(calc.newPendingCommission) + '</span></div>' +
        '<div style="display:flex;justify-content:space-between;padding:12px 0 6px;font-weight:800;font-size:14.5px;color:var(--primary-dark)"><span>New Capital</span><span>' + FX(calc.newCapitalCurrent) + '</span></div>' +
      '</div>';
    function wrow(l, v, sub, color) {
      return '<div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,.08);' + (sub ? 'padding-left:16px;font-size:12px;color:var(--gray)' : '') + '"><span>' + l + '</span><strong style="' + (color ? 'color:' + color : '') + '">' + v + '</strong></div>';
    }
  },

  /* ── Amortization ── */
  runAmortization(planId) {
    const p = planById(planId);
    if (!p) return;
    const monthly = N(($('finAmortMonthly') || {}).value);
    if (!monthly || monthly <= 0) { const h = $('finAmortResult'); if (h) h.innerHTML = ''; return; }
    let capital = N(p.capitalCurrent);
    let pending = N(p.pendingCommission);
    const rows = [];
    let cur = new Date();
    const rate = N(p.commissionRate);
    let safety = 0, totalComm = 0, totalCap = 0;
    while (capital > 0.01 && safety < 240) {
      safety++;
      cur.setDate(cur.getDate() + 30);
      const daily = (capital / 100000) * rate;
      const accrued = daily * 30;
      const owed = pending + accrued;
      const payComm = Math.min(monthly, owed);
      const payCap = Math.max(0, monthly - payComm);
      const newPend = owed - payComm;
      const newCap = Math.max(0, capital - payCap);
      totalComm += payComm; totalCap += payCap;
      rows.push({ n: safety, date: cur.toISOString().split('T')[0], startCap: capital, accrued, payComm, payCap, endCap: newCap, pend: newPend });
      capital = newCap; pending = newPend;
      if (rows.length >= 36) break;
    }
    $('finAmortResult').innerHTML =
      '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px">' +
        '<div style="background:var(--light);padding:10px 14px;border-radius:8px;font-size:12px"><strong>Months:</strong> ' + rows.length + '</div>' +
        '<div style="background:var(--light);padding:10px 14px;border-radius:8px;font-size:12px"><strong>Projected commission:</strong> ' + F(totalComm) + '</div>' +
        '<div style="background:var(--light);padding:10px 14px;border-radius:8px;font-size:12px"><strong>Projected capital:</strong> ' + F(totalCap) + '</div>' +
      '</div>' +
      '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Date</th><th>Start Cap</th><th>Commission Due</th><th>Paid → Comm</th><th>Paid → Cap</th><th>End Cap</th><th>Pending</th></tr></thead><tbody>' +
      rows.map(r => '<tr>' +
        '<td>' + r.n + '</td><td>' + dfmt(r.date) + '</td>' +
        '<td>' + F(r.startCap) + '</td><td style="color:var(--warning)">' + F(r.accrued) + '</td>' +
        '<td style="color:var(--info)">' + F(r.payComm) + '</td><td style="color:var(--success)">' + F(r.payCap) + '</td>' +
        '<td><strong>' + F(r.endCap) + '</strong></td>' +
        '<td style="color:' + (r.pend > 0 ? 'var(--danger)' : 'var(--success)') + '">' + F(r.pend) + '</td>' +
      '</tr>').join('') + '</tbody></table></div>';
  },

  /* ── Delete suite ── */
  async clearPlanTransactions(planId) {
    if (!planId) planId = FIN.activePlanId;
    if (!planId) return;
    const p = planById(planId);
    if (!p) return;
    const pmtCount = FIN.payments.filter(x => x.planId === planId).length;
    if (pmtCount === 0) return NC.toast('No payments on this plan', 'info');
    if (!await NC.confirm(
      'Clear ALL ' + pmtCount + ' payment(s) from "' + p.vehicle + '"?\n\n' +
      '• Capital resets to ' + F(p.capitalStart) + '\n' +
      '• Pending commission → 0\n' +
      '• Deduction settlements reverted\n' +
      '\nCannot be undone.',
      { danger:true, confirmLabel:'Clear Payments' }
    )) return;
    try {
      const deds = FIN.deductions.filter(x => x.planId === planId);
      for (const d of deds) {
        if ((d.mainDeductions || []).length > 0) {
          await db.collection('finance_deductions').doc(d.id).set({ mainDeductions:[], updatedAt: NC.ts() }, { merge:true });
        }
      }
      const pmts = FIN.payments.filter(x => x.planId === planId);
      for (const pmt of pmts) {
        await db.collection('finance_payments').doc(pmt.id).delete();
      }
      await db.collection('finance_plans').doc(planId).set({
        capitalCurrent: N(p.capitalStart),
        pendingCommission: 0,
        status: 'active',
        updatedAt: NC.ts()
      }, { merge:true });
      await loadFinance(true);
      NC.toast('Cleared ' + pmtCount + ' payment(s)', 'success');
      if (NC.state.activeView === 'finance-plan-detail') renderPlanDetail($('finance-plan-detail'));
      else renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  async hardDeletePlan(planId) {
    if (!planId) planId = FIN.activePlanId;
    if (!planId) return;
    const p = planById(planId);
    if (!p) return;
    const pmtCount = FIN.payments.filter(x => x.planId === planId).length;
    const dedCount = FIN.deductions.filter(x => x.planId === planId).length;
    if (!await NC.confirm(
      'DELETE "' + p.vehicle + '" and EVERYTHING related?\n\n' +
      '• Plan (1)\n• Payments (' + pmtCount + ')\n• Deductions (' + dedCount + ')\n\n' +
      'Cannot be undone.',
      { danger:true, confirmLabel:'Delete Everything' }
    )) return;
    try {
      await db.collection('finance_plans').doc(planId).delete();
      for (const pmt of FIN.payments.filter(x => x.planId === planId)) {
        await db.collection('finance_payments').doc(pmt.id).delete();
      }
      for (const d of FIN.deductions.filter(x => x.planId === planId)) {
        await db.collection('finance_deductions').doc(d.id).delete();
      }
      NC.toast('Deleted plan + ' + pmtCount + ' payments + ' + dedCount + ' deductions', 'success');
      FIN.activePlanId = null;
      await loadFinance(true);
      NC.navigate('finance-dashboard');
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  },

  async purgeAll() {
    if (!FIN.plans.length && !FIN.payments.length && !FIN.deductions.length) {
      return NC.toast('Finance module already empty', 'info');
    }
    if (!await NC.confirm(
      'PURGE ALL FINANCE DATA?\n\n' +
      'Plans: ' + FIN.plans.length + '\n' +
      'Payments: ' + FIN.payments.length + '\n' +
      'Deductions: ' + FIN.deductions.length + '\n' +
      '\nNeonCheque cheque data is NOT touched.',
      { danger:true, confirmLabel:'Purge All' }
    )) return;
    const code = prompt('Type DELETE ALL (exact, uppercase) to confirm:');
    if (code !== 'DELETE ALL') return NC.toast('Cancelled — code did not match', 'error');
    try {
      for (const p of FIN.plans)     await db.collection('finance_plans').doc(p.id).delete();
      for (const p of FIN.payments)  await db.collection('finance_payments').doc(p.id).delete();
      for (const d of FIN.deductions) await db.collection('finance_deductions').doc(d.id).delete();
      FIN.plans = []; FIN.payments = []; FIN.deductions = [];
      FIN.activePlanId = null;
      NC.toast('Purged all finance data', 'success');
      await loadFinance(true);
      renderFinanceTab();
    } catch (e) { NC.toast('Error: ' + e.message, 'error'); }
  }
});

/* ══════════════════════════════════════════════════════
   MODULE REGISTRATION
   ══════════════════════════════════════════════════════ */
NC.registerModule('finance', {
  init() {
    loadFinance(false).then(() => {
      console.log('[Finance module] ✅ Ready — ' + FIN.plans.length + ' plans, ' + FIN.payments.length + ' payments, ' + FIN.deductions.length + ' deductions');
      NC.emit('finance:ready', { plans:FIN.plans.length });

  views: {
    'finance-dashboard': {

      icon: 'coins',
      order: 1,
      render: renderFinanceMain
    },
    'finance-plan-detail': {
      title: 'Plan Details',
      tab: 'finance',
      icon: 'file-invoice-dollar',
      order: 2,
      showInNav: false,
      render: renderPlanDetail
    }
  }
});

console.log('%c[Part 5 — FINANCE MANAGER] ✅ Registered', 'color:#10b981;font-weight:bold');

})();
</script>
<!-- ══════════════════════════════════════════════════════
     PART 6 — BUSINESS LEDGER (biz-overview, sources,
             deployments, projects, reports)
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modLedger) return;
window.__modLedger = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;
const T = NC.T;
const dfmt = NC.dateFmt;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function sources()     { return NC.data.ncMoneySources || []; }
function deployments() { return NC.data.ncDeployments || []; }
function projects()    { return NC.data.projects || []; }
function categories()  { return NC.state.categories || []; }
function banks()       { return NC.data.bankAccounts || []; }
function cashLedger()  { return NC.data.ncCashLedger || []; }
function shopPayments(){ return NC.data.ncShopPayments || []; }
function sourceRepayments() { return NC.data.ncSourceRepayments || []; }

function catColor(name) {
  const c = categories().find(x => x.name === name);
  return (c && c.color) || '#6366f1';
}

function sourceTypeMeta(type) {
  return {
    loan:      { label:'Loan from party', color:'#dc2626', icon:'hand-holding-usd' },
    own:       { label:'Own money',       color:'#10b981', icon:'user' },
    reinvest:  { label:'Reinvestment',    color:'#0ea5e9', icon:'recycle' }
  }[type] || { label: type || 'Unknown', color:'#6366f1', icon:'circle' };
}

async function loadLedger() {
  try {
    const [src, dep, proj] = await Promise.all([
      NC.load('ncMoneySources', { fresh:false }),
      NC.load('ncDeployments',  { fresh:false }),
      NC.load('projects',       { fresh:false })
    ]);
    NC.data.ncMoneySources = src;
    NC.data.ncDeployments  = dep;
    NC.data.projects       = proj;
  } catch (e) { console.warn('[Ledger] load', e); }
}

/* Compute available balance for a source */
function sourceDeployed(sourceId) {
  return deployments()
    .filter(d => d.sourceId === sourceId)
    .reduce((s,d) => s + N(d.amount), 0);
}
function sourceAvailable(src) {
  return Math.max(0, N(src.amount) - sourceDeployed(src.id));
}
function projectDeployed(projectId) {
  return deployments()
    .filter(d => d.projectId === projectId)
    .reduce((s,d) => s + N(d.amount), 0);
}
function projectReceived(projectId) {
  return shopPayments()
    .filter(x => x.projectId === projectId)
    .reduce((s,x) => s + N(x.amount), 0);
}

/* ══════════════════════════════════════════════════════
   VIEW 1 — BUSINESS OVERVIEW
   ══════════════════════════════════════════════════════ */
function renderOverview(el) {
  const totalSources   = sources().reduce((s,x) => s + N(x.amount), 0);
  const totalDeployed  = deployments().reduce((s,d) => s + N(d.amount), 0);
  const totalReceived  = shopPayments().reduce((s,p) => s + N(p.amount), 0);
  const cashTotal      = cashLedger().reduce((s,c) => s + (c.type === 'in' ? N(c.amount) : -N(c.amount)), 0);
  const bankTotal      = banks().reduce((s,b) => s + N(b.currentBalance), 0);
  const netCycle       = totalReceived - totalDeployed;
  const availableSources = sources().reduce((s,x) => s + sourceAvailable(x), 0);

  // Alerts
  const alerts = [];
  sources().filter(s => s.type === 'loan').forEach(s => {
    const o = N(s.amount) - N(s.repaidTotal);
    if (o > 0 && s.endDate && new Date(s.endDate).getTime() < Date.now()) {
      alerts.push({ sev:'danger', title:'Overdue loan — ' + (s.party || ''), msg:'Outstanding ' + F(o) });
    }
  });
  banks().forEach(b => {
    if (N(b.currentBalance) < 0) alerts.push({ sev:'warning', title:'Negative balance — ' + (b.bankName || b.name || 'Bank'), msg: F(b.currentBalance) });
  });
  if (cashTotal < 0) alerts.push({ sev:'warning', title:'Cash in hand negative', msg: F(cashTotal) });

  el.innerHTML =
  '<div class="widgets-grid">' +
    kpi('Total Sources',   F(totalSources),   '#6366f1', '#4f46e5', 'money-bill-trend-up',   availableSources > 0 ? F(availableSources) + ' available' : null) +
    kpi('Deployed',        F(totalDeployed),  '#f59e0b', '#d97706', 'arrow-up-right-dots',   deployments().length + ' deployment(s)') +
    kpi('Received',        F(totalReceived),  '#10b981', '#059669', 'arrow-down',            shopPayments().length + ' payment(s)') +
    kpi('Net Cycle',       F(netCycle),       netCycle >= 0 ? '#0ea5e9' : '#ef4444', netCycle >= 0 ? '#0284c7' : '#dc2626', 'chart-line', netCycle >= 0 ? 'Profit' : 'Loss') +
    kpi('Cash in Hand',    F(cashTotal),      '#8b5cf6', '#7c3aed', 'coins',                 null) +
    kpi('Banks',           F(bankTotal),      '#06b6d4', '#0891b2', 'university',            banks().length + ' account(s)') +
  '</div>' +

  (alerts.length > 0
    ? '<div class="card">' +
        '<div class="card-header">' +
          '<h3 class="card-title" style="color:var(--danger)"><i class="fas fa-bell"></i> Active Alerts (' + alerts.length + ')</h3>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' +
          alerts.map(a => {
            const col = a.sev === 'danger' ? '#dc2626' : '#d97706';
            const bg  = a.sev === 'danger' ? '#fee2e2' : '#fef3c7';
            return '<div style="background:' + bg + ';border-left:4px solid ' + col + ';padding:12px;border-radius:8px">' +
              '<div style="font-weight:700;color:' + col + ';font-size:13px">' + E(a.title) + '</div>' +
              '<div style="font-size:12px;color:var(--dark);margin-top:4px">' + E(a.msg) + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>'
    : '');

  function kpi(label, value, c1, c2, icon, sub) {
    return '<div class="widget" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');color:white">' +
      '<div class="widget-header">' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">' + label + '</div>' +
          '<div style="font-size:24px;font-weight:800;margin-top:6px">' + value + '</div>' +
          (sub ? '<div style="font-size:11px;opacity:.85;margin-top:4px">' + sub + '</div>' : '') +
        '</div>' +
        '<div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px">' +
          '<i class="fas fa-' + icon + '"></i>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
}

/* ══════════════════════════════════════════════════════
   VIEW 2 — MONEY SOURCES
   ══════════════════════════════════════════════════════ */
function renderSources(el) {
  const list = sources();
  const totalAmount = list.reduce((s,x) => s + N(x.amount), 0);
  const totalDeployed = list.reduce((s,x) => s + sourceDeployed(x.id), 0);
  const totalAvailable = list.reduce((s,x) => s + sourceAvailable(x), 0);
  const totalRepaid = list.reduce((s,x) => s + N(x.repaidTotal), 0);

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-hand-holding-usd" style="color:var(--primary);margin-right:8px"></i>Money Sources</h2>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary btn-sm" onclick="LEDGER.openRepayment()"><i class="fas fa-undo"></i> Record Repayment</button>' +
        '<button class="btn btn-primary btn-sm" onclick="LEDGER.openAddSource()"><i class="fas fa-plus"></i> Add Source</button>' +
      '</div>' +
    '</div>' +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px">' +
      statCard('Total Raised', F(totalAmount), list.length + ' source(s)', '#6366f1', '#4f46e5') +
      statCard('Deployed', F(totalDeployed), null, '#f59e0b', '#d97706') +
      statCard('Available', F(totalAvailable), totalAmount > 0 ? Math.round(totalAvailable/totalAmount*100) + '%' : null, '#10b981', '#059669') +
      statCard('Repaid', F(totalRepaid), null, '#06b6d4', '#0891b2') +
    '</div>' +

    (list.length === 0
      ? '<div class="empty-state">' +
          '<i class="fas fa-hand-holding-usd"></i>' +
          '<h3>No money sources yet</h3>' +
          '<p style="margin-top:8px">Track where money comes from — loans, own money, or reinvestments.</p>' +
          '<button class="btn btn-primary" style="margin-top:16px" onclick="LEDGER.openAddSource()"><i class="fas fa-plus"></i> Add First Source</button>' +
        '</div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>Type</th><th>Party</th><th>Amount</th><th>Deployed</th><th>Repaid</th><th>Available</th>' +
          '<th>Date</th><th>Due</th><th>Rate</th><th>Actions</th>' +
        '</tr></thead><tbody>' +
        list.map(s => {
          const meta = sourceTypeMeta(s.type);
          const deployed = sourceDeployed(s.id);
          const repaid = N(s.repaidTotal);
          const avail = sourceAvailable(s);
          const isOverdue = s.endDate && new Date(s.endDate) < new Date() && repaid < N(s.amount);
          return '<tr>' +
            '<td>' +
              '<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700;background:' + meta.color + '22;color:' + meta.color + '">' +
                '<i class="fas fa-' + meta.icon + '"></i> ' + E(meta.label) +
              '</span>' +
            '</td>' +
            '<td><strong>' + E(s.party || '-') + '</strong></td>' +
            '<td style="font-weight:700">' + F(s.amount) + '</td>' +
            '<td>' +
              F(deployed) +
              (deployed > 0 ? '<div style="background:var(--border);height:4px;border-radius:2px;margin-top:4px;overflow:hidden;max-width:120px"><div style="height:100%;width:' + Math.min(100, (deployed / N(s.amount) || 0) * 100) + '%;background:var(--primary)"></div></div>' : '') +
            '</td>' +
            '<td>' + F(repaid) + (repaid > 0 ? '<div style="font-size:10px;color:var(--gray);margin-top:3px">' + Math.round(repaid / N(s.amount) * 100) + '% repaid</div>' : '') + '</td>' +
            '<td style="font-weight:700;color:' + (avail > 0 ? 'var(--warning)' : 'var(--success)') + '">' + F(avail) + '</td>' +
            '<td>' + dfmt(s.date) + '</td>' +
            '<td style="color:' + (isOverdue ? 'var(--danger)' : 'inherit') + ';font-weight:' + (isOverdue ? '700' : '400') + '">' + dfmt(s.endDate) + (isOverdue ? '<div style="font-size:10px;color:var(--danger)">⚠ Overdue</div>' : '') + '</td>' +
            '<td>' + (N(s.interestRate) > 0 ? N(s.interestRate) + '%' : '-') + '</td>' +
            '<td>' +
              '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
                (avail > 0 ? '<button class="btn btn-xs btn-primary" onclick="LEDGER.openDeploy(\'' + s.id + '\')" title="Deploy to project"><i class="fas fa-arrow-right"></i></button>' : '') +
                (repaid < N(s.amount) ? '<button class="btn btn-xs btn-success" onclick="LEDGER.openRepaySpecific(\'' + s.id + '\')" title="Record repayment"><i class="fas fa-undo"></i></button>' : '') +
                '<button class="btn btn-xs btn-secondary" onclick="LEDGER.openEditSource(\'' + s.id + '\')" title="Edit"><i class="fas fa-edit"></i></button>' +
                '<button class="btn btn-xs btn-danger" onclick="LEDGER.removeSource(\'' + s.id + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';

  function statCard(label, value, sub, c1, c2) {
    return '<div style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');color:white;padding:16px;border-radius:12px">' +
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">' + label + '</div>' +
      '<div style="font-size:24px;font-weight:800;margin-top:6px">' + value + '</div>' +
      (sub ? '<div style="font-size:11px;opacity:.85;margin-top:4px">' + sub + '</div>' : '') +
    '</div>';
  }
}

/* ══════════════════════════════════════════════════════
   VIEW 3 — DEPLOYMENTS
   ══════════════════════════════════════════════════════ */
function renderDeployments(el) {
  const list = deployments().slice().sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
  const total = list.reduce((s,d) => s + N(d.amount), 0);

  // Group by category for summary
  const byCat = {};
  list.forEach(d => {
    const k = d.category || '(No category)';
    if (!byCat[k]) byCat[k] = { amount:0, count:0 };
    byCat[k].amount += N(d.amount);
    byCat[k].count++;
  });
  const catKeys = Object.keys(byCat).sort((a,b) => byCat[b].amount - byCat[a].amount);

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-boxes" style="color:var(--warning);margin-right:8px"></i>Deployments</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="LEDGER.openPickSourceToDeploy()"><i class="fas fa-plus"></i> Deploy</button>' +
    '</div>' +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px">' +
      '<div style="background:linear-gradient(135deg,#f59e0b,#d97706);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">Total Deployed</div>' +
        '<div style="font-size:24px;font-weight:800;margin-top:6px">' + F(total) + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">' + list.length + ' deployment(s)</div>' +
      '</div>' +
      (catKeys.length > 0
        ? catKeys.slice(0, 3).map(k => {
            const c = catColor(k);
            return '<div style="background:white;border:1px solid var(--border);border-left:4px solid ' + c + ';padding:16px;border-radius:12px">' +
              '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)">' + E(k) + '</div>' +
              '<div style="font-size:24px;font-weight:800;margin-top:6px;color:' + c + '">' + F(byCat[k].amount) + '</div>' +
              '<div style="font-size:11px;color:var(--gray);margin-top:4px">' + byCat[k].count + ' deployment(s)</div>' +
            '</div>';
          }).join('')
        : '') +
    '</div>' +

    (list.length === 0
      ? '<div class="empty-state">' +
          '<i class="fas fa-boxes"></i>' +
          '<h3>No deployments yet</h3>' +
          '<p style="margin-top:8px">Deploy money from a source to a project category.</p>' +
          '<button class="btn btn-primary" style="margin-top:16px" onclick="LEDGER.openPickSourceToDeploy()"><i class="fas fa-plus"></i> First Deployment</button>' +
        '</div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>Date</th><th>Project</th><th>Category</th><th>Purpose</th><th>Amount</th><th>Source</th><th>Actions</th>' +
        '</tr></thead><tbody>' +
        list.map(d => {
          const src = sources().find(s => s.id === d.sourceId);
          const proj = projects().find(p => p.id === d.projectId);
          const c = catColor(d.category);
          return '<tr>' +
            '<td>' + dfmt(d.date) + '</td>' +
            '<td><strong>' + E(proj ? proj.name : '-') + '</strong></td>' +
            '<td>' + (d.category ? '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:' + c + '22;color:' + c + '">' + E(d.category) + '</span>' : '-') + '</td>' +
            '<td>' + E(d.purpose || '-') + '</td>' +
            '<td style="font-weight:700">' + F(d.amount) + '</td>' +
            '<td><small style="color:var(--gray)">' + E(src ? (src.party || src.type) : '(deleted)') + '</small></td>' +
            '<td><button class="btn btn-xs btn-danger" onclick="LEDGER.removeDeployment(\'' + d.id + '\')"><i class="fas fa-trash"></i></button></td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';
}

function renderProjects(el) {
  const list = projects();
  const totalDeployed = list.reduce((s,p) => s + projectDeployed(p.id), 0);
  const totalReceived = list.reduce((s,p) => s + projectReceived(p.id), 0);
  const totalNet = totalReceived - totalDeployed;

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header">' +
      '<h2 class="card-title"><i class="fas fa-project-diagram" style="color:var(--success);margin-right:8px"></i>Projects</h2>' +
      '<button class="btn btn-primary btn-sm" onclick="LEDGER.openAddProject()"><i class="fas fa-plus"></i> Add Project</button>' +
    '</div>' +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px">' +
      '<div style="background:linear-gradient(135deg,#6366f1,#4f46e5);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">Projects</div>' +
        '<div style="font-size:24px;font-weight:800;margin-top:6px">' + list.length + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">' + list.filter(p => p.status === 'active').length + ' active</div>' +
      '</div>' +
      '<div style="background:linear-gradient(135deg,#f59e0b,#d97706);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">Invested</div>' +
        '<div style="font-size:24px;font-weight:800;margin-top:6px">' + F(totalDeployed) + '</div>' +
      '</div>' +
      '<div style="background:linear-gradient(135deg,#10b981,#059669);color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">Received</div>' +
        '<div style="font-size:24px;font-weight:800;margin-top:6px">' + F(totalReceived) + '</div>' +
      '</div>' +
      '<div style="background:linear-gradient(135deg,' + (totalNet >= 0 ? '#0ea5e9,#0284c7' : '#ef4444,#dc2626') + ');color:white;padding:16px;border-radius:12px">' +
        '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">Net Cycle</div>' +
        '<div style="font-size:24px;font-weight:800;margin-top:6px">' + F(totalNet) + '</div>' +
        '<div style="font-size:11px;opacity:.85;margin-top:4px">' + (totalNet >= 0 ? 'Profit' : 'Loss') + '</div>' +
      '</div>' +
    '</div>' +

    (list.length === 0
      ? '<div class="empty-state">' +
          '<i class="fas fa-project-diagram"></i>' +
          '<h3>No projects yet</h3>' +
          '<p style="margin-top:8px">Create a project to deploy money into and track returns.</p>' +
          '<button class="btn btn-primary" style="margin-top:16px" onclick="LEDGER.openAddProject()"><i class="fas fa-plus"></i> First Project</button>' +
        '</div>'
      : '<div class="table-container"><table><thead><tr>' +
          '<th>Project</th><th>Client</th><th>Default Category</th><th>Deployed</th><th>Received</th><th>Net</th><th>ROI</th><th>Actions</th>' +
        '</tr></thead><tbody>' +
        list.map(p => {
          const deployed = projectDeployed(p.id);
          const received = projectReceived(p.id);
          const net = received - deployed;
          const roi = deployed > 0 ? (net / deployed * 100) : 0;
          const cColor = p.defaultCategory ? catColor(p.defaultCategory) : '#94a3b8';
          return '<tr>' +
            '<td><strong>' + E(p.name) + '</strong>' +
              (p.status && p.status !== 'active' ? '<div style="font-size:10px;color:var(--gray);margin-top:2px">' + E(p.status) + '</div>' : '') +
            '</td>' +
            '<td>' + E(p.client || '-') + '</td>' +
            '<td>' + (p.defaultCategory ? '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:' + cColor + '22;color:' + cColor + '">' + E(p.defaultCategory) + '</span>' : '-') + '</td>' +
            '<td>' + F(deployed) + '</td>' +
            '<td style="color:var(--success)">' + F(received) + '</td>' +
            '<td style="font-weight:700;color:' + (net >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + F(net) + '</td>' +
            '<td>' +
              '<span style="font-weight:700;color:' + (roi >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + roi.toFixed(1) + '%</span>' +
              (deployed > 0 ? '<div style="background:var(--border);height:4px;border-radius:2px;margin-top:4px;overflow:hidden;max-width:100px"><div style="height:100%;width:' + Math.min(100, Math.abs(roi)) + '%;background:' + (roi >= 0 ? 'var(--success)' : 'var(--danger)') + '"></div></div>' : '') +
            '</td>' +
            '<td>' +
              '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
                '<button class="btn btn-xs btn-secondary" onclick="LEDGER.openProjectDetails(\'' + p.id + '\')" title="Details"><i class="fas fa-eye"></i></button>' +
                '<button class="btn btn-xs btn-primary" onclick="LEDGER.openEditProject(\'' + p.id + '\')" title="Edit"><i class="fas fa-edit"></i></button>' +
                '<button class="btn btn-xs btn-danger" onclick="LEDGER.removeProject(\'' + p.id + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';
}

function renderProjectSummary() {
  const tbody = $('rptProjSummary');
  if (!tbody) return;
  const list = projects();
  if (!list.length) { tbody.innerHTML = ''; return; }

  let tI = 0, tR = 0;
  const rows = list.map(p => {
    const dep = projectDeployed(p.id);
    const rec = projectReceived(p.id);
    tI += dep;
    tR += rec;
    const net = rec - dep;
    const roi = dep > 0 ? (net / dep * 100) : 0;
    return '<tr>' +
      '<td><strong>' + E(p.name) + '</strong></td>' +
      '<td>' + E(p.client || '-') + '</td>' +
      '<td>' + F(dep) + '</td>' +
      '<td>' + F(rec) + '</td>' +
      '<td style="color:' + (net >= 0 ? 'var(--success)' : 'var(--danger)') + ';font-weight:700">' + F(net) + '</td>' +
      '<td style="color:' + (roi >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + roi.toFixed(1) + '%</td>' +
    '</tr>';
  }).join('');

  const tNet = tR - tI;
  const totalRow = '<tr style="background:var(--light);font-weight:800">' +
    '<td>TOTAL</td><td></td>' +
    '<td>' + F(tI) + '</td>' +
    '<td>' + F(tR) + '</td>' +
    '<td style="color:' + (tNet >= 0 ? 'var(--success)' : 'var(--danger)') + '">' + F(tNet) + '</td>' +
    '<td>' + (tI > 0 ? ((tNet / tI) * 100).toFixed(1) : '0.0') + '%</td>' +
  '</tr>';

  tbody.innerHTML = rows + totalRow;
}

/* ══════════════════════════════════════════════════════
   PUBLIC API — LEDGER.*
   ══════════════════════════════════════════════════════ */
const LEDGER = window.LEDGER = {};

/* ── SOURCE CRUD ── */
LEDGER.openAddSource = function () {
  NC.modal({
    id:'ledAddSrcModal',
    title:'Add Money Source',
    width:600,
    fields: [
      { id:'type', label:'Type *', type:'select', required:true, options:[
        { value:'loan', label:'Loan from party' },
        { value:'own', label:'Own money' },
        { value:'reinvest', label:'Reinvestment' }
      ], value:'loan' },
      { id:'party', label:'Party', type:'text', hint:'Who provided the money' },
      { id:'amount', label:'Amount (Rs.) *', type:'number', required:true, step:'0.01' },
      { id:'date', label:'Date *', type:'date', required:true, value: T() },
      { id:'endDate', label:'Due date', type:'date', hint:'Optional for loans' },
      { id:'interestRate', label:'Interest % / month', type:'number', step:'0.01', value:0 },
      { id:'notes', label:'Notes', type:'textarea' }
    ],
    onSave: async d => {
      await db.collection('ncMoneySources').add(Object.assign({}, d, {
        repaidTotal: 0,
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      }));
      NC.toast('Source added', 'success');
      NC.invalidate('ncMoneySources');
      NC.data.ncMoneySources = await NC.load('ncMoneySources', { fresh:true });
      renderSources($('biz-sources'));
    }
  });
};

LEDGER.openEditSource = function (id) {
  const s = sources().find(x => x.id === id);
  if (!s) return;
  NC.modal({
    id:'ledEditSrcModal',
    title:'Edit Money Source',
    width:600,
    fields: [
      { id:'type', label:'Type', type:'select', required:true, options:[
        { value:'loan', label:'Loan from party' },
        { value:'own', label:'Own money' },
        { value:'reinvest', label:'Reinvestment' }
      ], value: s.type },
      { id:'party', label:'Party', type:'text', value: s.party || '' },
      { id:'amount', label:'Amount (Rs.)', type:'number', required:true, step:'0.01', value: s.amount },
      { id:'date', label:'Date', type:'date', required:true, value: s.date },
      { id:'endDate', label:'Due date', type:'date', value: s.endDate || '' },
      { id:'interestRate', label:'Interest % / month', type:'number', step:'0.01', value: s.interestRate || 0 },
      { id:'notes', label:'Notes', type:'textarea', value: s.notes || '' }
    ],
    onSave: async d => {
      // Guard: cannot reduce below deployed
      const deployed = sourceDeployed(id);
      if (N(d.amount) < deployed - 0.01) {
        throw new Error('Amount cannot be less than deployed amount (' + F(deployed) + ')');
      }
      await db.collection('ncMoneySources').doc(id).update(Object.assign({}, d, { updatedAt: NC.ts() }));
      NC.toast('Source updated', 'success');
      NC.invalidate('ncMoneySources');
      NC.data.ncMoneySources = await NC.load('ncMoneySources', { fresh:true });
      renderSources($('biz-sources'));
    }
  });
};

LEDGER.removeSource = async function (id) {
  const s = sources().find(x => x.id === id);
  if (!s) return;
  const deployed = sourceDeployed(id);

LEDGER.openDeploy = function (sourceId) {
  const src = sources().find(s => s.id === sourceId);
  if (!src) return;
  const deployed = sourceDeployed(sourceId);
  const avail = Math.max(0, N(src.amount) - deployed);
  if (avail <= 0) { NC.toast('No available balance', 'error'); return; }

  const projList = projects();
  if (projList.length === 0) { NC.toast('Add a project first', 'error'); return; }

  const catOpts = categories().map(c => ({ value:c.name, label:c.name }));

  NC.modal({
    id:'ledDeployModal',
    title:'Deploy ' + F(avail) + ' from ' + (src.party || src.type),
    width:640,
    fields: [
      { id:'projectId', label:'Project *', type:'select', required:true,
        options: projList.map(p => ({ value:p.id, label:p.name })),
        placeholder:'-- Select project --' },
      { id:'category', label:'Category *', type:'select', required:true,
        options: catOpts, placeholder:'-- Select category --' },
      { id:'amount', label:'Amount (Rs.) *', type:'number', required:true, step:'0.01',
        value: avail.toFixed(2), hint:'Max: ' + F(avail) },
      { id:'date', label:'Date *', type:'date', required:true, value: T() },
      { id:'purpose', label:'Purpose / Item', type:'text' }
    ],
    onSave: async d => {
      if (N(d.amount) > avail + 0.01) throw new Error('Exceeds available balance ' + F(avail));
      if (N(d.amount) <= 0) throw new Error('Amount must be positive');
      await db.collection('ncDeployments').add(Object.assign({}, d, {
        sourceId,
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      }));
      NC.toast('Deployed ' + F(d.amount) + ' → ' + d.category, 'success');
      NC.invalidate('ncDeployments');
      NC.data.ncDeployments = await NC.load('ncDeployments', { fresh:true });
      renderDeployments($('biz-deployments'));
      renderSources($('biz-sources'));
    }
  });
};

LEDGER.openRepaySpecific = function (sourceId) {
  const src = sources().find(s => s.id === sourceId);
  if (!src) return;
  const avail = N(src.amount) - N(src.repaidTotal);
  if (avail <= 0) { NC.toast('Already fully repaid', 'info'); return; }

  const bankOpts = banks().map(b => ({ value:b.id, label: b.bankName || b.name || 'Bank' }));

  NC.modal({
    id:'ledRepayModal',
    title:'Repay ' + (src.party || src.type),
    width:600,
    fields: [
      { id:'amount', label:'Amount (Rs.) *', type:'number', required:true, step:'0.01',
        value: avail.toFixed(2), hint:'Outstanding: ' + F(avail) },
      { id:'date', label:'Date *', type:'date', required:true, value: T() },
      { id:'method', label:'Method', type:'select', options: [
        { value:'cash', label:'Cash' },
        { value:'bank', label:'Bank' }
      ], value:'cash' },
      { id:'bankAccountId', label:'Bank (if method = bank)', type:'select',
        options: [{ value:'', label:'-- None --' }].concat(bankOpts), value:'' },
      { id:'interest', label:'Interest paid (Rs.)', type:'number', step:'0.01', value:0 },
      { id:'notes', label:'Notes', type:'textarea' }
    ],
    onSave: async d => {
      const amt = N(d.amount);
      if (amt <= 0) throw new Error('Amount must be positive');
      if (amt > avail + 0.01) throw new Error('Exceeds outstanding ' + F(avail));
      const total = amt + N(d.interest);

      await db.collection('ncSourceRepayments').add({
        sourceId, amount: amt, interest: N(d.interest), date: d.date,
        method: d.method, bankAccountId: d.bankAccountId || null,
        notes: d.notes || '',
        createdAt: NC.ts(),
        createdBy: NC.state.user ? NC.state.user.email : 'anonymous'
      });

      await db.collection('ncMoneySources').doc(sourceId).update({
        repaidTotal: NC.inc(amt),
        updatedAt: NC.ts()
      });

      // Cash ledger or bank
      if (d.method === 'bank' && d.bankAccountId) {
        await db.collection('bankTransactions').add({
          bankAccountId: d.bankAccountId, date: d.date, type: 'debit',
          amount: total, description: 'Source repayment', category: 'Finance',
          reference: 'repayment:' + sourceId,
          createdAt: NC.ts()
        });
        await db.collection('bankAccounts').doc(d.bankAccountId).update({
          currentBalance: NC.inc(-total)
        });
      } else {
        await db.collection('ncCashLedger').add({
          type: 'out', amount: total, date: d.date,
          source: 'source-repayment', notes: 'Repayment to ' + (src.party || src.type),
          createdAt: NC.ts()
        });
      }

      NC.toast('Repaid ' + F(amt), 'success');
      NC.invalidate('ncMoneySources');
      NC.invalidate('ncSourceRepayments');
      NC.invalidate('ncCashLedger');
      NC.invalidate('bankTransactions');
      NC.invalidate('bankAccounts');
      NC.data.ncMoneySources = await NC.load('ncMoneySources', { fresh:true });
      renderSources($('biz-sources'));
    }
  });
};

  sources().forEach(s => events.push({ date: s.date, type:'source', label:'Source added — ' + (s.party || s.type), amount: N(s.amount), sign:'+' }));
  deployments().forEach(d => events.push({ date: d.date, type:'deploy', label:'Deployed — ' + (projects().find(p => p.id === d.projectId) || {}).name + ' / ' + (d.category || ''), amount: N(d.amount), sign:'-' }));

  events.sort((a,b) => new Date(a.date || 0) - new Date(b.date || 0));

  const w = window.open('', '_blank');
  if (!w) return NC.toast('Allow popups to print', 'error');
  let html = '<html><head><title>Master Timeline</title><style>body{font-family:Arial;padding:30px;color:#1e293b}h1{color:#6366f1}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #ddd;padding:8px;font-size:12px;text-align:left}th{background:#6366f1;color:white}tr:nth-child(even){background:#f8fafc}</style></head><body>';
  html += '<h1>Master Timeline</h1><p>Generated: ' + new Date().toLocaleString() + ' · ' + events.length + ' events</p>';
  html += '<table><thead><tr><th>Date</th><th>Event</th><th>Amount</th></tr></thead><tbody>';
  events.forEach(ev => {
    html += '<tr><td>' + dfmt(ev.date) + '</td><td>' + E(ev.label) + '</td><td style="color:' + (ev.sign === '+' ? '#10b981' : '#ef4444') + ';font-weight:700">' + ev.sign + ' ' + F(ev.amount) + '</td></tr>';
  });
  html += '</tbody></table></body></html>';
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 500);
  NC.toast('Timeline opened for printing', 'success');
};

<script>
(function(){
'use strict';

const $ = NC.$;
const N = NC.N;

const E = NC.E;

/* ══════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════ */
function shopPayments()  { return NC.data.ncShopPayments || []; }
function inPayments()    { return NC.data.inPayments || []; }
function outPayments()   { return NC.data.outPayments || []; }
function cashLedger()    { return NC.data.ncCashLedger || []; }
function cashTransfers() { return NC.data.ncCashTransfers || []; }
function banks()         { return NC.data.bankAccounts || []; }
function bankTxns()      { return NC.data.bankTransactions || []; }
function parties()       { return NC.data.parties || []; }
function projects()      { return NC.data.projects || []; }
function categories()    { return NC.state.categories || []; }

function catColor(name) {
  const c = categories().find(x => x.name === name);
  return (c && c.color) || '#6366f1';
}
function projectName(id) {
  const p = projects().find(x => x.id === id);
  return p ? p.name : '-';
}
function bankName(id) {
  const b = banks().find(x => x.id === id);
  return b ? (b.bankName || b.name || 'Bank') : '(deleted bank)';
}
function cashBalance() {
  return cashLedger().reduce((s,c) => s + (c.type === 'in' ? N(c.amount) : -N(c.amount)), 0);
}

/* ══════════════════════════════════════════════════════
   LOAD ALL DATA
   ══════════════════════════════════════════════════════ */
async function loadMoneyFlow(force) {
  try {
    const [sp, ip, op, cl, ct, ba, bt, pt, pr] = await Promise.all([
      NC.load('ncShopPayments',  { fresh: !!force }),
      NC.load('inPayments',      { fresh: !!force }),
      NC.load('outPayments',     { fresh: !!force }),
      NC.load('ncCashLedger',    { fresh: !!force }),
      NC.load('ncCashTransfers', { fresh: !!force }),
      NC.load('bankAccounts',    { fresh: !!force }),
      NC.load('bankTransactions', { fresh: !!force }),
      NC.load('parties',         { fresh: !!force }),
      NC.load('projects',        { fresh: false })
    ]);
    NC.data.ncShopPayments  = sp;
    NC.data.inPayments      = ip;
    NC.data.outPayments     = op;
    NC.data.ncCashLedger    = cl;
    NC.data.ncCashTransfers = ct;
    NC.data.bankAccounts    = ba;
    NC.data.bankTransactions = bt;
    NC.data.parties         = pt;
    NC.data.projects        = pr;
    NC.emit('moneyflow:changed');
  } catch (e) { console.warn('[MoneyFlow] load', e); }
}

      miniCard('Via Cheque', F(chequeTotal), null, '#6366f1', '#4f46e5') +

    (list.length === 0

            '<td>' + (p.bankAccountId ? E(bankName(p.bankAccountId)) : '-') + '</td>' +
            '<td>' + E(p.notes || '-') + '</td>' +
            '<td>' +
              '<div style="display:flex;gap:4px;flex-wrap:wrap">' +
                '<button class="btn btn-xs btn-secondary" onclick="MF.viewShopPayment(\'' + p.id + '\')" title="View"><i class="fas fa-eye"></i></button>' +
                '<button class="btn btn-xs btn-danger" onclick="MF.removeShopPayment(\'' + p.id + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +
              '</div>' +
            '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
    ) +
  '</div>';

  function miniCard(label, value, sub, c1, c2) {
    return '<div style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');color:white;padding:16px;border-radius:12px">' +
      '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">' + label + '</div>' +
      '<div style="font-size:22px;font-weight:800;margin-top:6px">' + value + '</div>' +
      (sub ? '<div style="font-size:11px;opacity:.85;margin-top:4px">' + sub + '</div>' : '') +
    '</div>';
  }
}

/* ══════════════════════════════════════════════════════
   VIEW 8 — BANK ANALYTICS
   ══════════════════════════════════════════════════════ */
function renderBankAnalytics(el) {
  const txns = bankTxns();
  const totalCredit = txns.filter(t => t.type === 'credit').reduce((s,t) => s + N(t.amount), 0);
  const totalDebit = txns.filter(t => t.type === 'debit').reduce((s,t) => s + N(t.amount), 0);
  const net = totalCredit - totalDebit;
  const uncategorized = txns.filter(t => !t.category).length;

  // Category breakdown
  const byCat = {};
  txns.forEach(t => {
    const k = t.category || '(Uncategorized)';
    if (!byCat[k]) byCat[k] = { credit:0, debit:0, count:0 };
    if (t.type === 'credit') byCat[k].credit += N(t.amount);
    else byCat[k].debit += N(t.amount);
    byCat[k].count++;
  });
  const catKeys = Object.keys(byCat).sort((a,b) => (byCat[b].credit + byCat[b].debit) - (byCat[a].credit + byCat[a].debit));

  // Monthly trend (last 6 months)
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push({
      label: d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }),
      key: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
      credit: 0, debit: 0
    });
  }
  txns.forEach(t => {
    if (!t.date) return;
    const d = new Date(t.date);
    if (isNaN(d)) return;
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const m = months.find(x => x.key === key);
    if (!m) return;
    if (t.type === 'credit') m.credit += N(t.amount);
    else m.debit += N(t.amount);
  });
  const maxMonthly = Math.max(...months.map(m => Math.max(m.credit, m.debit)), 1);

  el.innerHTML =
  '<div class="card">' +
    '<div class="card-header"><h2 class="card-title"><i class="fas fa-chart-bar" style="color:#f59e0b;margin-right:8px"></i>Bank Analytics</h2></div>' +

    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:24px">' +
      big('Total Credit (IN)', F(totalCredit), '#10b981', '#059669', 'arrow-down') +
      big('Total Debit (OUT)', F(totalDebit), '#ef4444', '#dc2626', 'arrow-up') +
      big('Net', F(net), net >= 0 ? '#0ea5e9' : '#ef4444', net >= 0 ? '#0284c7' : '#dc2626', 'chart-line') +
      big('Uncategorized', uncategorized, '#94a3b8', '#64748b', 'question-circle') +
    '</div>' +

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">' +

      '<div style="background:var(--light);padding:18px;border-radius:12px">' +
        '<h3 style="font-size:14px;font-weight:700;margin-bottom:14px">Top Categories</h3>' +
        (catKeys.length === 0
          ? '<div style="text-align:center;padding:20px;color:var(--gray);font-size:12px">No data</div>'
          : '<div style="display:flex;flex-direction:column;gap:12px">' +
            catKeys.slice(0, 8).map(k => {
              const row = byCat[k];
              const total = row.credit + row.debit;
              const max = Math.max(...catKeys.map(kk => byCat[kk].credit + byCat[kk].debit));
              const pct = max > 0 ? (total / max) * 100 : 0;
              const color = k === '(Uncategorized)' ? '#94a3b8' : catColor(k);
              return '<div>' +
                '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">' +
                  '<span style="font-weight:600">' + E(k) + '</span>' +
                  '<span style="color:var(--gray)">' + row.count + ' · ' + F(total) + '</span>' +
                '</div>' +
                '<div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + color + '"></div></div>' +
              '</div>';
            }).join('') +
          '</div>'
        ) +
      '</div>' +

      '<div style="background:var(--light);padding:18px;border-radius:12px">' +
        '<h3 style="font-size:14px;font-weight:700;margin-bottom:14px">Last 6 Months</h3>' +
        '<div style="display:flex;align-items:flex-end;justify-content:space-around;height:200px;gap:8px">' +
          months.map(m => {
            const hc = (m.credit / maxMonthly) * 100;
            const hd = (m.debit / maxMonthly) * 100;
            return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">' +
              '<div style="flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px">' +
                '<div style="width:40%;height:' + hc + '%;min-height:3px;background:linear-gradient(180deg,#10b981,#059669);border-radius:4px 4px 0 0" title="Credit: ' + F(m.credit) + '"></div>' +
                '<div style="width:40%;height:' + hd + '%;min-height:3px;background:linear-gradient(180deg,#ef4444,#dc2626);border-radius:4px 4px 0 0" title="Debit: ' + F(m.debit) + '"></div>' +
              '</div>' +
              '<div style="font-size:10px;color:var(--gray);font-weight:600">' + m.label + '</div>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<div style="display:flex;justify-content:center;gap:16px;margin-top:12px;font-size:11px">' +
          '<span><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;margin-right:4px"></span>Credit</span>' +
          '<span><span style="display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:2px;margin-right:4px"></span>Debit</span>' +
        '</div>' +
      '</div>' +

    '</div>' +
  '</div>';

  function big(label, value, c1, c2, icon) {
    return '<div style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');color:white;padding:18px;border-radius:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
        '<div>' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.9">' + label + '</div>' +
          '<div style="font-size:24px;font-weight:800;margin-top:6px">' + value + '</div>' +
        '</div>' +
        '<div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:15px">' +
          '<i class="fas fa-' + icon + '"></i>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
}
