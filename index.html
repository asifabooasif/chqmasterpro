  NC.toast('Finance module not loaded', 'error');
};

ST.purgeAll = async function () {
  const code = prompt('⚠ This will delete ALL business data (cheques, categories, ledger, payments, finance).\n\nType DELETE EVERYTHING (uppercase) to confirm:');
  if (code !== 'DELETE EVERYTHING') return NC.toast('Cancelled', 'info');

  const cols = ['cheques','chequeCategories','chequeBooks','loans','projects','parties','ncMoneySources','ncDeployments','ncShopPayments','ncCashLedger','ncCashTransfers','bankAccounts','bankTransactions','inPayments','outPayments','finance_plans','finance_payments','finance_deductions'];
  NC.toast('Purging… this may take a while', 'info');
  let total = 0;
  for (const col of cols) {
    try {
      const snap = await db.collection(col).get();
      for (const d of snap.docs) {
        await db.collection(col).doc(d.id).delete();
        total++;
      }
    } catch (e) {}
  }
  NC.invalidate();
  NC.state.allCheques = [];
  NC.state.categories = [];
  if (window.FIN) { window.FIN.plans = []; window.FIN.payments = []; window.FIN.deductions = []; }
  NC.toast('Deleted ' + total + ' document(s)', 'success');
  renderUsersView2();
};

/* ══════════════════════════════════════════════════════
   SHORTCUTS
   ══════════════════════════════════════════════════════ */
function installShortcuts() {
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toUpperCase();
    const inField = tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable;

    /* Ctrl+K — command palette (simple version = settings search) */
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
      e.preventDefault();
      if (getUser('commandPaletteEnabled')) openPalette();
      return;
    }
    /* Ctrl+1/2/3 — switch tabs */
    if ((e.ctrlKey || e.metaKey) && ['1','2','3'].indexOf(e.key) !== -1) {
      e.preventDefault();
      const tabs = ['cheques','finance','payments'];
      NC.showTab(tabs[parseInt(e.key) - 1]);
      return;
    }
    /* Alt+letter — jump */
    if (e.altKey && !inField) {
      const map = {
        d: 'dashboard',
        c: 'all-cheques',
        f: 'finance-dashboard',
        b: 'biz-banks',
        s: 'settings',
        u: 'users'
      };
      const v = map[String(e.key).toLowerCase()];
      if (v) { e.preventDefault(); NC.navigate(v); }
    }
    /* Escape — close modals */
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    }
  });
}

function openPalette() {
  let host = $('stPalette');
  if (!host) {
    host = document.createElement('div');
    host.id = 'stPalette';
    host.className = 'modal-overlay';
    host.style.alignItems = 'flex-start';
    host.style.paddingTop = '12vh';
    host.innerHTML =
      '<div class="modal" style="max-width:560px">' +
        '<div style="padding:14px 18px;border-bottom:1px solid var(--border)">' +
          '<input type="text" id="stPalInput" placeholder="🔍  Jump to any view or setting…" style="width:100%;border:none;outline:none;font-size:16px;font-family:inherit;padding:8px 0;background:transparent">' +
        '</div>' +
        '<div id="stPalList" style="max-height:400px;overflow-y:auto;padding:8px"></div>' +
      '</div>';
    document.body.appendChild(host);
    host.addEventListener('click', e => { if (e.target === host) host.classList.remove('active'); });

    const input = $('stPalInput');
    input.oninput = () => renderPalette(input.value.toLowerCase());
    input.onkeydown = e => {
      if (e.key === 'Escape') { host.classList.remove('active'); }
      if (e.key === 'Enter') {
        const first = document.querySelector('#stPalList [data-target]');
        if (first) first.click();
      }
    };
    renderPalette('');
  }
  host.classList.add('active');
  setTimeout(() => $('stPalInput').focus(), 50);
}

function renderPalette(q) {
  const items = [];
  // Views
  Object.values(NC.views || {}).forEach(v => {
    items.push({ type:'view', label: v.title, sub:'Navigate', icon: v.icon, target: v.id, nav: v.id });
  });
  // Settings sections
  SECTIONS.flatMap(g => g.items).forEach(it => {
    items.push({ type:'setting', label: it.label, sub:'Setting', icon: it.icon, target: 'settings', section: it.id });
  });

  const filtered = items.filter(i => !q || i.label.toLowerCase().includes(q) || (i.sub || '').toLowerCase().includes(q));

  const list = $('stPalList');
  if (!list) return;
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gray);font-size:13px">No matches</div>';
    return;
  }
  list.innerHTML = filtered.slice(0, 30).map(it =>
    '<div class="st-pal-item" data-target="' + E(it.target) + '" data-section="' + E(it.section || '') + '" style="padding:12px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px;font-size:13px">' +
      '<i class="fas fa-' + (it.icon || 'circle') + '" style="width:20px;text-align:center;color:var(--primary)"></i>' +
      '<div style="flex:1">' +
        '<div style="font-weight:600">' + E(it.label) + '</div>' +
        '<div style="font-size:11px;color:var(--gray)">' + E(it.sub) + '</div>' +
      '</div>' +
      '<i class="fas fa-arrow-right" style="color:var(--gray);font-size:11px"></i>' +
    '</div>'
  ).join('');

  list.querySelectorAll('.st-pal-item').forEach(el => {
    el.onmouseover = () => el.style.background = 'var(--light)';
    el.onmouseout = () => el.style.background = '';
    el.onclick = () => {
      const target = el.dataset.target;
      const section = el.dataset.section;
      $('stPalette').classList.remove('active');
      if (target === 'settings' && section) {
        ST.activeSection = section;
        NC.navigate('settings');
      } else if (NC.views[target]) {
        NC.navigate(target);
      }
    };
  });
}

/* ══════════════════════════════════════════════════════
   MODULE REGISTRATION
   ══════════════════════════════════════════════════════ */
NC.registerModule('settings', {
  init() {
    loadSettings().then(() => {
      installShortcuts();
      console.log('[Settings module] ✅ Ready');
    });

    // React to auth changes
    NC.on('auth:ready', () => loadSettings());
  },
  views: {
    'settings': {
      title: 'Settings',
      tab: 'cheques',
      icon: 'cog',
      order: 19,   /* just before Users */
      render: renderSettingsView
    }
  }
});

console.log('%c[Part 11 — SETTINGS] ✅ Registered — 14 sections', 'color:#10b981;font-weight:bold');

})();
</script>
<!-- ══════════════════════════════════════════════════════
     PART 12 — FINAL GLUE · DIAGNOSTICS · OPTIONAL GUARD
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modFinal) return;
window.__modFinal = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;

/* Update version marker */
NC.version = '6.0.0';
NC.codename = 'Aurora';

/* ══════════════════════════════════════════════════════
   1 · CUSTOM FIELDS → CHEQUE MODALS
   Patch NC.modal so that chqAddModal / chqEditModal
   automatically gain whatever fields are configured in
   Settings → Custom Fields.
   ══════════════════════════════════════════════════════ */

let _lastEditChequeId = null;

function getCustomFields() {
  try {
    const m = (NC.state.settings && NC.state.settings.main) || {};
    return Array.isArray(m.customFields) ? m.customFields : [];
  } catch (e) { return []; }
}

function chequeById(id) {
  return (NC.state.allCheques || []).find(c => c.id === id);
}

/* Wrap CHEQ.openEdit to remember which cheque is being edited */
function patchCheqOpenEdit() {
  if (!window.CHEQ || typeof CHEQ.openEdit !== 'function') return false;
  if (CHEQ.openEdit.__p12Wrapped) return true;
  const orig = CHEQ.openEdit;
  CHEQ.openEdit = function (id) {
    _lastEditChequeId = id;
    return orig.apply(this, arguments);
  };
  CHEQ.openEdit.__p12Wrapped = true;
  return true;
}

/* Wrap NC.modal to inject custom fields + wire values into save */
function patchModal() {
  if (NC.modal.__p12Wrapped) return true;
  const orig = NC.modal;

  NC.modal = function (opts) {
    if (!opts) return orig.call(NC, opts);

    const isChequeModal = opts.id === 'chqAddModal' || opts.id === 'chqEditModal';
    if (!isChequeModal) return orig.call(NC, opts);

    const cfs = getCustomFields();
    if (!cfs.length) return orig.call(NC, opts);

    /* Determine existing cheque (for edit only) */
    let existing = null;
    if (opts.id === 'chqEditModal' && _lastEditChequeId) {
      existing = chequeById(_lastEditChequeId);
    }

    /* Clone opts so we don't mutate the caller's object */
    const newOpts = Object.assign({}, opts);
    newOpts.fields = (opts.fields || []).slice();

    /* Insert custom fields at the end */
    cfs.forEach(cf => {
      const key = 'cf_' + cf.key;
      const currentVal = existing && existing.customFields ? (existing.customFields[cf.key] ?? '') : '';

      const field = {
        id: key,
        label: cf.label,
        type: cf.type === 'select' ? 'select' : cf.type,
        required: !!cf.required,
        value: currentVal
      };
      if (cf.type === 'select' && Array.isArray(cf.options)) {
        field.options = [{ value:'', label:'-- Select --' }].concat(
          cf.options.map(o => ({ value:o, label:o }))
        );
      }
      newOpts.fields.push(field);
    });

    /* Wrap onSave so the custom fields get packed into cheque.customFields */
    const origOnSave = opts.onSave;
    if (typeof origOnSave === 'function') {
      newOpts.onSave = async function (data, host) {
        const cfData = (existing && existing.customFields)
          ? Object.assign({}, existing.customFields)
          : {};

        cfs.forEach(cf => {
          const k = 'cf_' + cf.key;
          if (Object.prototype.hasOwnProperty.call(data, k)) {
            const v = data[k];
            if (v === '' || v === null || v === undefined) {
              delete cfData[cf.key];
            } else {
              cfData[cf.key] = v;
            }
            delete data[k];
          }
        });

        data.customFields = cfData;
        return origOnSave.call(this, data, host);
      };
    }

    return orig.call(NC, newOpts);
  };

  NC.modal.__p12Wrapped = true;
  return true;
}

/* ══════════════════════════════════════════════════════
   2 · ESCALATION ENGINE → BELL
   Reads Settings → Escalation Rules and adds items to the
   notification bell without modifying Part 10.
   We hook by observing the bell panel's DOM.
   ══════════════════════════════════════════════════════ */

const ESCALATIONS = [];

function getRules() {
  try {
    const m = (NC.state.settings && NC.state.settings.main) || {};
    return Array.isArray(m.escalationRules) ? m.escalationRules : [];
  } catch (e) { return []; }
}

function computeEscalations() {
  const rules = getRules();
  ESCALATIONS.length = 0;
  if (!rules.length) return;

  const cheques = (NC.state.allCheques || []).filter(c => !c.deletedAt);
  const FIN = window.FIN || {};
  const plans = FIN.plans || [];
  const deductions = FIN.deductions || [];

  rules.forEach((rule, idx) => {
    const threshold = N(rule.threshold);
    const type = rule.condition;

    if (type === 'in-hand-days') {
      cheques.filter(c => c.status === 'in-hand').forEach(c => {
        const days = Math.round((Date.now() - new Date(c.date).getTime()) / 86400000);
        if (Math.abs(days) > threshold) {
          ESCALATIONS.push({
            source: 'escalation',
            id: 'esc_' + idx + '_' + c.id,
            type: 'danger',
            icon: 'fire',
            title: 'Escalation — stale in-hand',
            desc: 'Rule "' + (rule.name || 'Rule') + '" → cheque #' + c.number + ' in-hand ' + Math.abs(days) + 'd (threshold ' + threshold + 'd)',
            target: 'in-hand',
            rule: rule.name
          });
        }
      });
    }

    if (type === 'returned-amount') {
      cheques.filter(c => c.status === 'returned').forEach(c => {
        if (N(c.amount) > threshold) {
          ESCALATIONS.push({
            source: 'escalation',
            id: 'esc_' + idx + '_' + c.id,
            type: 'danger',
            icon: 'fire',
            title: 'Escalation — large returned cheque',
            desc: 'Rule "' + (rule.name || 'Rule') + '" → cheque #' + c.number + ' for ' + F(c.amount),
            target: 'returned',
            rule: rule.name
          });
        }
      });
    }

    if (type === 'finance-overdue') {
      plans.filter(p => p.status === 'active').forEach(p => {
        const cleared = (FIN.payments || [])
          .filter(x => x.planId === p.id && x.status !== 'pending' && x.status !== 'bounced')
          .sort((a, b) => new Date(b.effectiveDate || b.date) - new Date(a.effectiveDate || a.date));
        const last = cleared[0];
        const lastDate = last ? new Date(last.effectiveDate || last.date) : new Date(p.startDate);
        const days = Math.round((Date.now() - lastDate) / 86400000);
        if (days > threshold) {
          ESCALATIONS.push({
            source: 'escalation',
            id: 'esc_' + idx + '_' + p.id,
            type: 'danger',
            icon: 'fire',
            title: 'Escalation — finance overdue',
            desc: 'Rule "' + (rule.name || 'Rule') + '" → plan "' + p.vehicle + '" overdue ' + days + 'd',
            planId: p.id,
            target: 'finance-plan-detail',
            rule: rule.name
          });
        }
      });
    }

    if (type === 'deduction-overdue') {
      deductions.forEach(d => {
        const paid = (d.directPayments || []).reduce((s,p) => s + N(p.amount), 0)
                   + (d.mainDeductions || []).reduce((s,m) => s + N(m.amount), 0);
        const rem = Math.max(0, N(d.amount) - paid);
        if (rem <= 0.001) return;
        const days = Math.round((Date.now() - new Date(d.dueDate).getTime()) / 86400000);
        if (days > threshold) {
          const pl = plans.find(x => x.id === d.planId);
          ESCALATIONS.push({
            source: 'escalation',
            id: 'esc_' + idx + '_' + d.id,
            type: 'danger',
            icon: 'fire',
            title: 'Escalation — deduction overdue',
            desc: 'Rule "' + (rule.name || 'Rule') + '" → "' + d.label + '" overdue ' + days + 'd' + (pl ? ' (' + pl.vehicle + ')' : ''),
            planId: d.planId,
            target: 'finance-plan-detail',
            rule: rule.name
          });
        }
      });
    }
  });

  /* Update bell badge with combined total */
  updateCombinedBadge();
}

/* Inject escalation items into the bell panel via MutationObserver */
function watchBellPanel() {
  const list = document.getElementById('ncBellList');
  if (!list) return false;

  if (list.__p12Observed) return true;
  list.__p12Observed = true;

  const inject = () => {
    if (!ESCALATIONS.length) return;
    // remove previously injected items
    list.querySelectorAll('[data-escalation="1"]').forEach(el => el.remove());
    // only inject if the panel has some items (i.e. user is viewing)
    if (list.offsetParent === null) return;

    const header = '<div data-escalation="1" style="padding:10px 16px 6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#dc2626"><i class="fas fa-fire"></i> Escalations</div>';
    const html = ESCALATIONS.map((n, i) => {
      const colors = { danger:{ bg:'#fee2e2', fg:'#b91c1c', border:'#dc2626' } };
      const c = colors.danger;
      return '<div data-escalation="1" class="nc-bell-item" data-esc-i="' + i + '" style="padding:14px;border-radius:10px;margin-bottom:4px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:.2s;border-left:4px solid ' + c.border + ';background:linear-gradient(90deg,' + c.bg + '55,transparent)">' +
        '<div style="width:36px;height:36px;border-radius:10px;background:' + c.bg + ';color:' + c.fg + ';display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">' +
          '<i class="fas fa-' + n.icon + '"></i>' +
        '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:700;font-size:13px;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
            '<span style="font-size:9px;padding:2px 7px;border-radius:8px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:#fee2e2;color:#b91c1c">Escalation</span>' +
            E(n.title) +
          '</div>' +
          '<div style="font-size:12px;color:var(--gray);line-height:1.5">' + E(n.desc) + '</div>' +
        '</div>' +
        '<i class="fas fa-chevron-right" style="color:var(--gray);font-size:11px;margin-top:11px"></i>' +
      '</div>';
    }).join('');

    list.insertAdjacentHTML('afterbegin', header + html);

    list.querySelectorAll('[data-esc-i]').forEach(el => {
      el.onclick = () => {
        const n = ESCALATIONS[parseInt(el.dataset.escI, 10)];
        if (!n) return;
        const panel = document.getElementById('ncBellPanel');
        if (panel) panel.style.display = 'none';
        if (window.BELL) window.BELL.open = false;
        if (n.target === 'finance-plan-detail' && n.planId && window.FIN && typeof FIN.openPlanDetail === 'function') {
          FIN.openPlanDetail(n.planId);
        } else if (n.target) {
          NC.navigate(n.target);
        }
      };
    });
  };

  const obs = new MutationObserver(() => setTimeout(inject, 30));
  obs.observe(list, { childList: true });
  return true;
}

function updateCombinedBadge() {
  const dot = document.getElementById('ncBellDot');
  if (!dot) return;
  const base = (window.BELL && window.BELL.notifications && window.BELL.notifications.length) || 0;
  const total = base + ESCALATIONS.length;
  if (total > 0) {
    dot.style.display = 'flex';
    dot.textContent = total > 99 ? '99+' : total;
  }
}

/* ══════════════════════════════════════════════════════
   3 · HEALTH MONITOR — verify all modules loaded
   ══════════════════════════════════════════════════════ */

const EXPECTED_MODULES = [
  'cheques', 'categories', 'loans', 'finance',
  'ledger', 'moneyflow', 'bridge', 'users', 'bell', 'settings'
];

function healthReport() {
  const modules = Object.keys(NC.modules || {});
  const missing = EXPECTED_MODULES.filter(m => !NC.modules[m]);
  const present = EXPECTED_MODULES.filter(m => NC.modules[m]);

  /* Count views */
  const views = Object.values(NC.views || {});
  const viewsByTab = { cheques:0, finance:0, payments:0 };
  views.forEach(v => { if (viewsByTab[v.tab] != null) viewsByTab[v.tab]++; });

  const tabs = document.querySelectorAll('.nc-nav-tab').length;
  const navItems = document.querySelectorAll('.nc-nav-item').length;
  const viewDivs = document.querySelectorAll('.nc-view').length;

  return {
    ok: missing.length === 0,
    modules,
    expected: EXPECTED_MODULES,
    present,
    missing,
    views: views.length,
    viewsByTab,
    dom: { main: !!main, nav: !!nav, tabs, navItems, viewDivs },
    user: NC.state.user ? NC.state.user.email : null,
    role: (window.PERMS && PERMS.role) || null,
    counts: {
      cheques: (NC.state.allCheques || []).length,
      categories: (NC.state.categories || []).length,

      finance_plans: (window.FIN && FIN.plans && FIN.plans.length) || 0,
      finance_payments: (window.FIN && FIN.payments && FIN.payments.length) || 0,
      finance_deductions: (window.FIN && FIN.deductions && FIN.deductions.length) || 0,
      sources: (NC.data.ncMoneySources || []).length,
      projects: (NC.data.projects || []).length,
      shopPayments: (NC.data.ncShopPayments || []).length,
      inPayments: (NC.data.inPayments || []).length,
      outPayments: (NC.data.outPayments || []).length,
      banks: (NC.data.bankAccounts || []).length,
      bankTxns: (NC.data.bankTransactions || []).length,
      parties: (NC.data.parties || []).length,
      users: (NC.data.users || []).length
    }
  };
}

/* ══════════════════════════════════════════════════════
   4 · NC.diagnose() — printed report + optional panel
   ══════════════════════════════════════════════════════ */

NC.diagnose = function (opts) {
  opts = opts || {};
  const h = healthReport();

  /* Console output */
  console.group('%c🔍 NeonCheque Diagnostic Report', 'color:#6366f1;font-size:14px;font-weight:bold');
  console.log('%cVersion', 'color:#0ea5e9;font-weight:bold', NC.version + ' · ' + (NC.codename || ''));
  console.log('%cUser', 'color:#0ea5e9;font-weight:bold', h.user || '—', '·', h.role || '—');
  console.log('%cHealth', 'color:#0ea5e9;font-weight:bold',
    h.ok ? '%c✓ All modules loaded' : '%c⚠ Missing: ' + h.missing.join(', '),
    h.ok ? 'color:#10b981;font-weight:bold' : 'color:#ef4444;font-weight:bold');
  console.log('%cModules', 'color:#0ea5e9;font-weight:bold', h.modules);
  console.log('%cViews registered', 'color:#0ea5e9;font-weight:bold', h.views,
    '· cheques=' + h.viewsByTab.cheques,
    'finance=' + h.viewsByTab.finance,
    'payments=' + h.viewsByTab.payments);
  console.log('%cDOM', 'color:#0ea5e9;font-weight:bold', h.dom);
  console.groupCollapsed('%cRecord counts', 'color:#0ea5e9;font-weight:bold');
  Object.keys(h.counts).forEach(k => console.log('  ' + k + ':', h.counts[k]));
  console.groupEnd();
  console.groupEnd();

  /* Toast summary */
  if (h.ok) {
    NC.toast('✅ All ' + h.modules.length + ' modules loaded · ' + h.views + ' views', 'success');
  } else {
    NC.toast('⚠ Missing modules: ' + h.missing.join(', '), 'warning');
  }

  if (opts.panel !== false) showDiagnosticPanel(h);

  return h;
};

function showDiagnosticPanel(h) {
  const moduleRows = EXPECTED_MODULES.map(m => {
    const loaded = !!NC.modules[m];
    return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border)">' +
      '<div style="font-size:13px"><i class="fas fa-' + (loaded ? 'check-circle' : 'times-circle') + '" style="color:' + (loaded ? 'var(--success)' : 'var(--danger)') + ';margin-right:8px"></i>' + E(m) + '</div>' +
      '<div style="font-size:12px;color:' + (loaded ? 'var(--success)' : 'var(--danger)') + ';font-weight:700">' + (loaded ? 'OK' : 'MISSING') + '</div>' +
    '</div>';
  }).join('');

  const countRows = Object.keys(h.counts).map(k =>
    '<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:var(--gray)">' + E(k) + '</span><strong>' + h.counts[k] + '</strong></div>'

  const body =

/* ══════════════════════════════════════════════════════
   5 · GLOBAL ERROR HANDLER (non-blocking)

let _errCount = 0;

window.addEventListener('error', e => {
  _errCount++;

    type: 'error',
    message: e.message,
    source: e.filename,

window.addEventListener('unhandledrejection', e => {
  _errCount++;
  _errLog.push({
    type: 'rejection',
    message: e.reason && e.reason.message ? e.reason.message : String(e.reason),

NC.errors = function () { return _errLog.slice(); };

/* ══════════════════════════════════════════════════════
   6 · CLEANUP PASS — orphan nodes, duplicate IDs, z-index
   ══════════════════════════════════════════════════════ */

function cleanup() {
  /* Remove duplicate IDs */
  const seen = new Set();
  document.querySelectorAll('[id]').forEach(el => {
    if (seen.has(el.id)) {
      console.warn('[cleanup] duplicate id removed:', el.id, el.tagName);
      el.removeAttribute('id');
    } else {
      seen.add(el.id);
    }
  });

  /* Remove orphan modal overlays with class "active" but no visible content */
  document.querySelectorAll('.modal-overlay').forEach(el => {
    if (el.classList.contains('active') && el.children.length === 0) {
      el.classList.remove('active');
    }
  });

  /* Ensure main content has at least one active view; if not, go home */
  const main = NC.$('ncMainContent');
  if (main && main.querySelectorAll('.nc-view').length > 0) {
    const active = main.querySelector('.nc-view.active');
    if (!active) {
      const first = main.querySelector('.nc-view');
      if (first) first.classList.add('active');
    }
  }
}

   If a module's view div doesn't exist when navigate() is
   called, create it on the fly (defensive — no errors).
   ══════════════════════════════════════════════════════ */

function patchNavigate() {
  if (NC.navigate.__p12Wrapped) return;
  const orig = NC.navigate;
  NC.navigate = function (viewId) {
    const v = NC.views[viewId];
    if (v && !NC.$(viewId)) {
      const main = NC.$('ncMainContent');
      if (main) {
        const el = document.createElement('div');
        el.id = viewId;
        el.className = 'nc-view';
        el.innerHTML = '<div class="empty-state"><i class="fas fa-circle-notch" style="animation:rotate 1.2s linear infinite;color:var(--primary)"></i></div>';
        main.appendChild(el);
      }
    }
    return orig.apply(this, arguments);
  };
  NC.navigate.__p12Wrapped = true;
}

/* ══════════════════════════════════════════════════════
   8 · OPTIONAL DEVTOOLS GUARD (OFF BY DEFAULT)
   Enable with:
     • URL: ?protect=1
     • Console: localStorage.setItem('nc_devguard', '1')
     • Console: NC.enableDevGuard()
   Disable with:
     • Console: NC.disableDevGuard()
     • URL: ?protect=0
   Non-destructive — shows overlay instead of wiping DOM.
   ══════════════════════════════════════════════════════ */

const DEVGUARD = {
  key: 'nc_devguard',
  enabled: false,
  armed: false,
  interval: null,
  overlay: null,
  threshold: 170,
  debugThreshold: 100
};

function isDevGuardRequested() {
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('protect') === '1') return true;
    if (params.get('protect') === '0') return false;
    if (localStorage.getItem(DEVGUARD.key) === '1') return true;
  } catch (e) {}
  return false;
}

function startDevGuard() {
  if (DEVGUARD.enabled) return;
  DEVGUARD.enabled = true;

  const check = () => {
    if (!DEVGUARD.enabled) return;
    if (isSizeOpen() || isDebuggerOpen()) {
      showGuardOverlay();
    }
  };

  DEVGUARD.interval = setInterval(check, 1200);

  window.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return false; }
    const k = String(e.key).toLowerCase();
    const ctrl = e.ctrlKey || e.metaKey;
    const shift = e.shiftKey;
    if (ctrl && shift && ['i','j','c'].indexOf(k) !== -1) { e.preventDefault(); return false; }
    if (ctrl && k === 'u') { e.preventDefault(); return false; }
  }, true);

  console.log('%c[DevGuard] ✓ Enabled — non-destructive overlay mode', 'color:#f59e0b;font-weight:bold');
}

function stopDevGuard() {
  if (!DEVGUARD.enabled) return;
  DEVGUARD.enabled = false;
  if (DEVGUARD.interval) clearInterval(DEVGUARD.interval);
  if (DEVGUARD.overlay) { DEVGUARD.overlay.remove(); DEVGUARD.overlay = null; }
  console.log('%c[DevGuard] ✗ Disabled', 'color:#64748b;font-weight:bold');
}

function isSizeOpen() {
  try {
    const w = Math.abs((window.outerWidth || 0) - (window.innerWidth || 0));
    const h = Math.abs((window.outerHeight || 0) - (window.innerHeight || 0));
    return w > DEVGUARD.threshold || h > DEVGUARD.threshold;
  } catch (e) { return false; }
}

function isDebuggerOpen() {
  try {
    const t1 = performance.now();
    // eslint-disable-next-line no-debugger
    (function(){ return false; }).constructor('debugger').call();
    const t2 = performance.now();
    return (t2 - t1) > DEVGUARD.debugThreshold;
  } catch (e) { return false; }
}

function showGuardOverlay() {
  if (DEVGUARD.overlay) return;
  const ov = document.createElement('div');
  ov.style.cssText = [
    'position:fixed','inset:0','z-index:2147483647',
    'background:radial-gradient(circle at 50% 50%,#1a0b3d 0%,#000 100%)',
    'color:#fff','display:flex','align-items:center','justify-content:center',
    'padding:40px','text-align:center',
    'font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif'
  ].join(';');
  ov.innerHTML = ''
    + '<div style="max-width:560px">'
    +   '<div style="font-size:88px;margin-bottom:20px;filter:drop-shadow(0 0 24px rgba(168,85,247,.6))">🔒</div>'
    +   '<h1 style="font-size:26px;font-weight:800;margin-bottom:12px">Developer Tools Detected</h1>'
    +   '<p style="font-size:14px;line-height:1.7;color:rgba(255,255,255,.75);margin-bottom:24px">Please close DevTools to continue using NeonCheque.</p>'
    +   '<button id="__dgClose" style="padding:12px 24px;border-radius:11px;border:none;background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;font-weight:700;cursor:pointer;font-size:14px">Retry</button>'
    + '</div>';
  document.body.appendChild(ov);
  DEVGUARD.overlay = ov;
  ov.querySelector('#__dgClose').onclick = () => {
    if (DEVGUARD.overlay) { DEVGUARD.overlay.remove(); DEVGUARD.overlay = null; }
  };
}

NC.enableDevGuard = function () {
  try { localStorage.setItem(DEVGUARD.key, '1'); } catch (e) {}
  startDevGuard();
  NC.toast('Dev guard enabled', 'success');
};

NC.disableDevGuard = function () {
  try { localStorage.setItem(DEVGUARD.key, '0'); } catch (e) {}
  stopDevGuard();
  NC.toast('Dev guard disabled', 'success');
};

NC.devGuardStatus = function () {
  return { enabled: DEVGUARD.enabled, armed: DEVGUARD.armed, threshold: DEVGUARD.threshold };
};

/* ══════════════════════════════════════════════════════

      console.log('%c  NeonCheque · Aurora v' + NC.version + ' — Ready', 'color:#6366f1;font-weight:bold;font-size:13px');
      console.log('%c═══════════════════════════════════════════════════════════', 'color:#6366f1');
      console.log('%c  Modules loaded:', 'color:#0ea5e9;font-weight:bold', h.modules.length + '/' + EXPECTED_MODULES.length);
      console.log('%c  Views registered:', 'color:#0ea5e9;font-weight:bold', h.views);
      console.log('%c  Chevrons  →  Cheques:' + h.viewsByTab.cheques, 'color:#64748b');
      console.log('%c            →  Finance:' + h.viewsByTab.finance, 'color:#64748b');
      console.log('%c            →  Payments:' + h.viewsByTab.payments, 'color:#64748b');
      if (h.missing.length) {
        console.log('%c  ⚠ Missing modules:', 'color:#ef4444;font-weight:bold', h.missing);
      } else {
        console.log('%c  ✓ All modules OK', 'color:#10b981;font-weight:bold');
      }
      console.log('%c  Type NC.diagnose() for full report', 'color:#64748b;font-style:italic');
      console.log('%c═══════════════════════════════════════════════════════════', 'color:#6366f1');

      /* Silent toast */

      }, 800);

}

/* Boot when user is ready */
NC.on('auth:ready', warmUp);

/* Also boot immediately if already authed (e.g. hot reload) */

<!-- ══════════════════════════════════════════════════════
     PART 13 — EMERGENCY FIX
     • Fixes "Loading modules…" stuck placeholder
     • Fixes "Cannot read properties of undefined (reading 'split')"
     • Restores visible Sort dropdown on All Cheques
     • Fixes Bulk Numbers filter (Enter key + better matching)
     • Auto-renders when switching tabs
     ══════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
if (window.__modFix13) return;
window.__modFix13 = true;

const $ = NC.$;
const N = NC.N;
const F = NC.fmt;
const E = NC.E;

/* ══════════════════════════════════════════════════════
   FIX 1 — Global safe-split (prevents the crash)
   We monkey-patch sortCheques-style helpers in every module
   by guarding the sort key. Also wrap all known risky split
   calls at the source so undefined never reaches them.
   ══════════════════════════════════════════════════════ */

/* Safe split for sort keys — "field-dir" or defaults to date-desc */
window.NC_safeSortKey = function (key, fallback) {
  if (typeof key !== 'string' || key.indexOf('-') === -1) {
    return (fallback || 'chequeDate-desc').split('-');
  }
  const parts = key.split('-');
  if (parts.length !== 2) return (fallback || 'chequeDate-desc').split('-');
  return parts;
};

/* ══════════════════════════════════════════════════════
   FIX 2 — Kill stuck "Loading modules…" placeholder
   Patch NC.navigate so:
     • Any leftover placeholder is cleared BEFORE render
     • If render throws, a proper fallback shows
     • If view has no render, we show an actionable message
   ══════════════════════════════════════════════════════ */

function patchNavigate() {
  if (NC.navigate.__p13Fixed) return;
  const orig = NC.navigate;

  NC.navigate = function (viewId) {
    const v = NC.views[viewId];

    /* If view ID is unknown, bail cleanly */
    if (!v) {
      console.warn('[NC.navigate] Unknown view: ' + viewId + ' — going to first view of tab');
      /* Try to fall back to first view in the currently-active tab */
      const fallbackTab = NC.state.activeTab || 'cheques';
      const first = Object.values(NC.views)
        .filter(x => x.tab === fallbackTab && x.showInNav !== false)
        .sort((a, b) => (a.order || 999) - (b.order || 999))[0];
      if (first && first.id !== viewId) {
        return orig.call(NC, first.id);
      }
      return;
    }

    /* Pre-clear the placeholder: this is the key fix.
       Any existing element with id=viewId gets its inner
       "Loading modules…" wiped if it's still the placeholder. */
    const existing = NC.$(viewId);
    if (existing) {
      const html = existing.innerHTML || '';
      if (html.indexOf('Loading modules') !== -1 && html.indexOf('empty-state') !== -1) {
        existing.innerHTML = '';
      }
    }

    /* Call original navigate */
    const result = orig.call(NC, viewId);

    /* Post-check: if placeholder STILL shows after 2s, force-render */
    if (v && typeof v.render === 'function') {
      setTimeout(() => {
        const el = NC.$(viewId);
        if (!el) return;
        const html = el.innerHTML || '';
        if (html.indexOf('Loading modules') !== -1) {
          console.warn('[P13] Stuck placeholder on ' + viewId + ' — force re-render');
          try {
            v.render(el, NC.state);
          } catch (e) {
            console.error('[P13] Force-render failed for ' + viewId, e);
            el.innerHTML =
              '<div class="card">' +
                '<div class="empty-state">' +
                  '<i class="fas fa-exclamation-triangle"></i>' +
                  '<h3>Could not render this view</h3>' +
                  '<p style="font-size:13px;margin-top:8px">' + E(e.message) + '</p>' +
                  '<button class="btn btn-primary" style="margin-top:16px" onclick="NC.navigate(\'dashboard\')">' +
                    '<i class="fas fa-home"></i> Go to Dashboard' +
                  '</button>' +
                '</div>' +
              '</div>';
          }
        }
      }, 2000);
    }

    return result;
  };

  NC.navigate.__p13Fixed = true;
  console.log('[P13] ✅ navigate patched');
}

/* ══════════════════════════════════════════════════════
   FIX 3 — Auto-navigate when clicking a tab
   If the currently-active view doesn't belong to the tab
   you just clicked, jump to that tab's first view.
   ══════════════════════════════════════════════════════ */

function patchShowTab() {
  if (NC.showTab.__p13Fixed) return;
  const orig = NC.showTab;

  NC.showTab = function (tabId) {
    /* Call original */
    const result = orig.call(NC, tabId);

    /* After tab UI updates, check whether active view belongs to this tab */
    setTimeout(() => {
      const active = document.querySelector('.nc-view.active');
      const activeId = active ? active.id : null;
      const activeMeta = activeId ? NC.views[activeId] : null;

      if (!activeMeta || activeMeta.tab !== tabId) {
        /* Find first view of this tab */
        const first = Object.values(NC.views)
          .filter(v => v.tab === tabId && v.showInNav !== false)
          .sort((a, b) => (a.order || 999) - (b.order || 999))[0];
        if (first) NC.navigate(first.id);
      }
    }, 30);

    return result;
  };

  NC.showTab.__p13Fixed = true;
  console.log('[P13] ✅ showTab patched (auto-navigate on tab click)');
}

/* ══════════════════════════════════════════════════════
   FIX 5 — Bulk Numbers filter (Enter + change events)
   Adds Enter handling and trailing cleanup so a comma-
   separated list reliably filters.
   ══════════════════════════════════════════════════════ */

function patchBulkNumbersInput() {
  const input = $('chqBulkNums');
  if (!input || input.__p13Bound) return;
  input.__p13Bound = true;

  /* Re-bind: Enter triggers, but the oninput already calls CHEQ.applyFilters.
     The main issue is that spaces, trailing commas, and newlines can confuse
     the filter. We normalise them via a small hook. */
  const origHandler = input.oninput;
  input.oninput = function () {
    /* Normalise: replace tabs / newlines / multiple commas with single comma */
    const cleaned = this.value.replace(/[\s]+/g, ' ').replace(/\s*,\s*/g, ', ');
    if (cleaned !== this.value) {
      const pos = this.selectionStart;
      this.value = cleaned;
      try { this.setSelectionRange(pos, pos); } catch (e) {}
    }
    if (typeof CHEQ !== 'undefined' && typeof CHEQ.applyFilters === 'function') {
      CHEQ.applyFilters();
    }
  };

  input.onkeydown = function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (typeof CHEQ !== 'undefined' && typeof CHEQ.applyFilters === 'function') {
        CHEQ.applyFilters();
        NC.toast('Filter applied', 'info');
      }
    }
  };
}

  input.__p13Bound = true;
  input.onkeydown = function (e) {

}

/* ══════════════════════════════════════════════════════

   Injects a sort <select> right next to the "Filters"

   ══════════════════════════════════════════════════════ */

function injectSortDropdown() {

  wrap.style.cssText = 'display:flex;align-items:center;gap:6px';
  wrap.innerHTML =
    '<i class="fas fa-sort" style="color:var(--gray);font-size:13px"></i>' +
    '<select id="chqSortQuick" style="padding:7px 12px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;background:white">' +
      '<option value="chequeDate-desc">Date (Newest)</option>' +
      '<option value="chequeDate-asc">Date (Oldest)</option>' +
      '<option value="createdAt-desc">Created (Newest)</option>' +
      '<option value="createdAt-asc">Created (Oldest)</option>' +
      '<option value="amount-desc">Amount (High → Low)</option>' +
      '<option value="amount-asc">Amount (Low → High)</option>' +
      '<option value="number-asc">Cheque # (A-Z)</option>' +
      '<option value="number-desc">Cheque # (Z-A)</option>' +
      '<option value="payee-asc">Payee (A-Z)</option>' +
      '<option value="payee-desc">Payee (Z-A)</option>' +
    '</select>';

  /* Insert before the "Filters" button */
  btnRow.insertBefore(wrap, filtersBtn);

  /* Wire the change event */
  const sel = $('chqSortQuick');
  /* Sync with existing hidden sort inside panel */
  const hiddenSel = $('chqSortBy');
  if (hiddenSel && hiddenSel.value) sel.value = hiddenSel.value;

  sel.onchange = function () {
    const v = this.value;
    /* Update hidden select too */
    if (hiddenSel) hiddenSel.value = v;
    /* Update state and refresh */
    if (typeof CHEQ !== 'undefined' && typeof CHEQ.setSort === 'function') {
      CHEQ.setSort(v);
    }
  };
}

/* ══════════════════════════════════════════════════════
   FIX 7 — Safe-guard user.email.split
   Part 1 / Part 9 call user.email.split('@') — if email is
   ever undefined, this throws. Wrap it via a safe-email
   helper that we set on window.
   ══════════════════════════════════════════════════════ */

window.NC_safeEmailPrefix = function (email, fallback) {
  if (typeof email === 'string' && email.indexOf('@') !== -1) {
    return email.split('@')[0];
  }
  return fallback || 'user';
};

/* Also patch the top-bar user name render in Part 1 by re-running it safely
   whenever auth state changes */
NC.on('auth:ready', () => {
  try {
    const user = NC.state.user;
    if (user) {
      const email = (user.email || 'user@local').toString();
      const prefix = email.split('@')[0] || 'user';
      const nameEl = NC.$('ncUserName');
      const avatarEl = NC.$('ncUserAvatar');
      if (nameEl) nameEl.textContent = user.displayName || prefix;
      if (avatarEl) avatarEl.textContent = (user.displayName || email).charAt(0).toUpperCase();
    }
  } catch (e) {
    console.warn('[P13] auth name render failed', e);
  }
});

/* ══════════════════════════════════════════════════════
   FIX 8 — Re-apply patches whenever All Cheques renders
   ══════════════════════════════════════════════════════ */

function scheduleInjections() {
  /* Try immediately */
  patchBulkNumbersInput();
  patchPayeeInput();
  injectSortDropdown();

  /* And keep retrying every 800ms whenever All Cheques is active */
  setInterval(() => {
    const view = $('all-cheques');
    if (view && view.classList.contains('active')) {
      patchBulkNumbersInput();
      patchPayeeInput();
      injectSortDropdown();
    }
  }, 800);
}

/* ══════════════════════════════════════════════════════
   FIX 9 — One-shot healing pass on boot
   ══════════════════════════════════════════════════════ */

function boot() {
  /* Apply all patches */
  patchNavigate();
  patchShowTab();

  /* Wait for CHEQ & views to register, then wire inputs */
  setTimeout(scheduleInjections, 500);
  setTimeout(scheduleInjections, 2000);
  setTimeout(scheduleInjections, 5000);

  /* Also apply when auth fires (in case the user logs in after patch loads) */
  NC.on('auth:ready', () => {
    setTimeout(scheduleInjections, 300);
  });

  /* Listen for view changes: inject on All Cheques */
  NC.on('route:changed', e => {
    if (e && e.viewId === 'all-cheques') {
      setTimeout(() => {
        patchBulkNumbersInput();
        patchPayeeInput();
        injectSortDropdown();
      }, 150);
    }
  });

  console.log('[P13] ✅ Emergency fix applied');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

console.log('%c[Part 13 — EMERGENCY FIX] ✅ Registered', 'color:#10b981;font-weight:bold');

})();
</script>
